<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: #000; width: 100%; height: 100%; overflow: hidden; font-family: Arial, Helvetica, sans-serif; color: #eee; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
#playerWrapper { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; overflow: hidden; }
#videoContainer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
#video { width: 100%; height: 100%; background: #000; object-fit: contain; display: block; }
#video.fit-contain { object-fit: contain !important; }
#video.fit-cover   { object-fit: cover   !important; }
#video.fit-stretch { object-fit: fill    !important; }

#topBar { position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0)); display: flex; align-items: center; gap: 12px; transition: opacity .3s ease, visibility .3s ease; pointer-events: none; }
#topBar.hidden { opacity: 0; visibility: hidden; }
.top-btn { pointer-events: auto; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.28); color: #fff; border-radius: 8px; padding: 10px 16px; min-height: 44px; font-size: 14px; font-weight: bold; cursor: pointer; outline: none; font-family: inherit; white-space: nowrap; transition: background .15s, border-color .15s; flex-shrink: 0; }
.top-btn:hover { background: rgba(255,255,255,0.22); }
.top-btn:focus { background: rgba(30,90,120,0.9); border-color: #4fc3f7; box-shadow: 0 0 0 2px rgba(79,195,247,0.4); }
#titleWrap { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; pointer-events: none; }
#chNum { display: inline-block; padding: 3px 9px; background: rgba(79,195,247,0.18); border: 1px solid rgba(79,195,247,0.5); color: #7cd0f5; border-radius: 6px; font-size: 13px; font-weight: bold; letter-spacing: 1px; flex-shrink: 0; }
#chNum:empty { display: none; }
#title { font-size: 16px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

#dthBanner { position: absolute; bottom: 100px; left: 16px; right: 16px; z-index: 15; background: linear-gradient(135deg, rgba(12,22,32,0.97) 0%, rgba(18,35,50,0.94) 100%); border: 1px solid rgba(79,195,247,0.35); border-radius: 14px; padding: 14px 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.7); backdrop-filter: blur(8px); transform: translateY(30px); opacity: 0; visibility: hidden; pointer-events: none; transition: transform .3s ease, opacity .3s ease, visibility .3s ease; }
#dthBanner.visible { transform: translateY(0); opacity: 1; visibility: visible; }
.dth-row { display: flex; gap: 16px; align-items: flex-start; }
.dth-logo-box { width: 100px; height: 100px; border-radius: 10px; background: #0a0a0a; border: 1px solid rgba(79,195,247,0.25); position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }

.dth-ch-num { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: bold; color: #7cd0f5; background: rgba(0,0,0,0.88); padding: 3px 0; letter-spacing: 1.5px; border-top: 1px solid rgba(79,195,247,0.25); }
.dth-logo-box.no-logo .dth-logo { display: none; }
.dth-logo-box.no-logo .dth-ch-num { position: static; font-size: 22px; font-weight: bold; background: transparent; color: #4fc3f7; border: none; letter-spacing: 1px; padding: 0; }
.dth-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.dth-ch-name { font-size: 18px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.dth-now { background: rgba(79,195,247,0.07); border-left: 3px solid #66bb6a; border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.dth-now-header { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.dth-now-label { color: #66bb6a; font-weight: bold; letter-spacing: 1px; flex-shrink: 0; }
.dth-now-time { color: #a0b8c8; font-size: 11px; }
.dth-now-title { font-size: 14px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.dth-progress { height: 4px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.dth-progress-fill { height: 100%; background: linear-gradient(90deg, #66bb6a 0%, #4fc3f7 100%); border-radius: 2px; width: 0%; transition: width 1s linear; }
.dth-next { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 10px; background: rgba(79,195,247,0.05); border-left: 3px solid #4fc3f7; border-radius: 6px; opacity: 0.9; }
.dth-next-label { color: #4fc3f7; font-weight: bold; font-size: 11px; letter-spacing: 1px; flex-shrink: 0; }
.dth-next-time { color: #9bbdd0; font-size: 11px; flex-shrink: 0; }
.dth-next-title { color: #e0e8ee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-weight: bold; }

#placeholder { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; color: #888; text-align: center; padding: 24px; font-size: 15px; line-height: 1.6; }
#placeholder.hidden { display: none; }
#placeholder .ph-actions { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#placeholder button { background: #2a2a2a; border: none; color: #eee; padding: 12px 22px; min-height: 44px; border-radius: 8px; font-size: 15px; cursor: pointer; font-family: inherit; outline: none; }
#placeholder button:hover { background: #3a3a3a; }
#placeholder button:focus { background: #1e5a78; box-shadow: 0 0 0 2px rgba(79,195,247,0.4); }
.spinner { display: inline-block; width: 34px; height: 34px; border: 3px solid #333; border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

#tapToPlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); cursor: pointer; }
#tapToPlay.hidden { display: none; }
.tap-play-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 30px 50px; background: rgba(10,20,28,0.92); border: 2px solid #4fc3f7; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.7); }

.tap-play-text { font-size: 18px; font-weight: bold; color: #fff; }

#unmuteBtn { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 10px; padding: 12px 22px; background: rgba(220,53,69,0.95); border: 2px solid rgba(255,255,255,0.4); color: #fff; border-radius: 30px; font-size: 15px; font-weight: bold; font-family: inherit; cursor: pointer; outline: none; box-shadow: 0 4px 20px rgba(0,0,0,0.6); animation: pulseUnmute 1.8s ease-in-out infinite; }
#unmuteBtn.hidden { display: none; }
#unmuteBtn:hover, #unmuteBtn:focus { background: rgba(240,70,85,1); }
@keyframes pulseUnmute { 0%, 100% { box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 0 0 rgba(220,53,69,0.7); } 50% { box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 0 10px rgba(220,53,69,0); } }
.unmute-icon { font-size: 20px; }

#chNumOverlay { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); min-width: 180px; padding: 20px 40px; background: rgba(10,20,28,0.96); border: 3px solid #4fc3f7; border-radius: 18px; text-align: center; z-index: 2000; pointer-events: none; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.7); }
#chNumOverlay.visible { display: block; }
#chNumOverlay .num-label { font-size: 12px; color: #7ab8d6; letter-spacing: 2px; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; }
#chNumOverlay .num-value { font-size: 72px; color: #fff; font-weight: bold; line-height: 1; letter-spacing: 4px; text-shadow: 0 2px 10px rgba(79,195,247,0.6); }

#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(30,30,30,0.95); color: #fff; padding: 12px 22px; border-radius: 8px; border: 1px solid #4fc3f7; font-size: 14px; z-index: 2500; opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.visible { opacity: 1; }

.shaka-controls-container { font-size: 14px; }
.shaka-bottom-controls { padding-bottom: calc(8px + env(safe-area-inset-bottom)) !important; padding-left: calc(12px + env(safe-area-inset-left)) !important; padding-right: calc(12px + env(safe-area-inset-right)) !important; }

@media (min-width: 1280px) { .shaka-controls-container { font-size: 18px; } #chNum { font-size: 15px; padding: 4px 10px; } #title { font-size: 22px; } #dthBanner { bottom: 120px; padding: 18px 24px; } .dth-logo-box { width: 120px; height: 120px; } .dth-logo { max-width: 96px; max-height: 76px; } .dth-ch-name { font-size: 22px; } .dth-now-title { font-size: 17px; } }
@media (max-width: 480px) { #topBar { gap: 8px; padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top)); } #chNum { font-size: 11px; padding: 2px 7px; } #title { font-size: 13px; } .top-btn { padding: 10px 12px; min-height: 42px; font-size: 13px; } #dthBanner { bottom: 80px; left: 10px; right: 10px; padding: 10px 12px; } .dth-logo-box { width: 70px; height: 70px; } .dth-logo { max-width: 56px; max-height: 46px; } .dth-ch-num { font-size: 9px; padding: 2px 0; letter-spacing: 1px; } .dth-ch-name { font-size: 14px; } .dth-now-title { font-size: 12px; } .dth-now, .dth-next { padding: 6px 8px; } .dth-next-title { font-size: 11px; } #chNumOverlay .num-value { font-size: 56px; } }
@media (max-height: 480px) and (orientation: landscape) { #topBar { padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top)); } #dthBanner { bottom: 70px; padding: 8px 12px; } .dth-logo-box { width: 64px; height: 64px; } }
</style>

<script>
if (!Array.prototype.includes) Array.prototype.includes = function(x){ return this.indexOf(x) !== -1; };
if (!Element.prototype.closest) { Element.prototype.closest = function(sel) { var el = this; while (el) { if (el.matches && el.matches(sel)) return el; el = el.parentElement; } return null; }; }

function xhrFetch(url, opts) {
  opts = opts || {};
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(opts.method || 'GET', url, true);
    xhr.timeout = opts.timeout || 20000;
    if (opts.headers) for (var k in opts.headers) if (opts.headers.hasOwnProperty(k)) { try { xhr.setRequestHeader(k, opts.headers[k]); } catch(e){} }
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) resolve({ ok:true, status:xhr.status, text: function(){ return Promise.resolve(xhr.responseText); }, json: function(){ return Promise.resolve(JSON.parse(xhr.responseText)); } });
      else reject(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = function(){ reject(new Error('Network error')); };
    xhr.ontimeout = function(){ reject(new Error('Timeout')); };
    try { xhr.send(opts.body || null); } catch(e){ reject(e); }
  });
}

var CHANNELS_CANDIDATES = ['/jstr4web.json', 'https://jjtvxweb.pages.dev/jstr4web.json'];

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function formatTimeOnly(ms) { var d = new Date(ms), h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap; }
function formatRange(s, e) { return formatTimeOnly(s) + ' - ' + formatTimeOnly(e); }
function getQueryParam(name) {
  var q = window.location.search.substring(1).split('&');
  for (var i = 0; i < q.length; i++) { var kv = q[i].split('='); if (decodeURIComponent(kv[0]) === name) return decodeURIComponent(kv[1] || ''); }
  return null;
}
function isJioPlLiveUrl(url) { try { var a = document.createElement('a'); a.href = url; return a.hostname.toLowerCase() === 'jiotvpllive.cdn.jio.com'; } catch (e) { return false; } }
function fetchWithFallback(url, opts) { return xhrFetch(url, opts).catch(function(e){ return xhrFetch(CORS_PROXY + url, opts); }); }
function showPlaceholder(html, showActions, showSpinner) { placeholder.classList.remove('hidden'); phMsg.innerHTML = html; phSpinner.style.display = showSpinner ? 'inline-block' : 'none'; phActions.style.display = showActions ? 'flex' : 'none'; }
function hidePlaceholder() { placeholder.classList.add('hidden'); }
function showToast(msg, isError) { toastEl.textContent = msg; toastEl.classList.add('visible'); if (isError) toastEl.classList.add('error'); else toastEl.classList.remove('error'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('visible'); }, 2500); }
function getChannelNumber(ch) { if (!ch) return null; if (typeof ch.id === 'number') return ch.id; if (typeof ch.id === 'string') { var n = parseInt(ch.id, 10); if (!isNaN(n) && String(n) === ch.id) return n; } return null; }

function showTapToPlay() { tapToPlay.classList.remove('hidden'); }
function hideTapToPlay() { tapToPlay.classList.add('hidden'); }
function showUnmuteBtn() { unmuteBtn.classList.remove('hidden'); }

function attemptPlayback() {
  autoplayAttempted = true; hideTapToPlay();
  var p = videoEl.play();
  if (!p || !p.then) { setTimeout(function() { if (videoEl.paused && !isLoading) tryMutedPlayback(); }, 1500); return; }
  p.then(function() { hideUnmuteBtn(); hideTapToPlay(); })
   .catch(function(err) { console.warn('[play] sound blocked:', err && err.name); tryMutedPlayback(); });
}
function tryMutedPlayback() {
  videoEl.muted = true;
  var p = videoEl.play();
  if (!p || !p.then) { setTimeout(function() { if (videoEl.paused) showTapToPlay(); else showUnmuteBtn(); }, 1500); return; }
  p.then(function() { showUnmuteBtn(); }).catch(function(err) { showTapToPlay(); });
}
tapToPlay.addEventListener('click', function(e) {
  e.stopPropagation(); hideTapToPlay(); videoEl.muted = false;
  var p = videoEl.play();
  if (p && p.then) p.then(function() { hideUnmuteBtn(); }).catch(function() { videoEl.muted = true; var p2 = videoEl.play(); if (p2 && p2.then) p2.then(function(){ showUnmuteBtn(); }).catch(function(){ showTapToPlay(); }); });
});
unmuteBtn.addEventListener('click', function(e) { e.stopPropagation(); videoEl.muted = false; if (videoEl.paused) videoEl.play().catch(function(){}); if (!videoEl.muted) hideUnmuteBtn(); });

function loadChannelPrograms() {
  try {
    var raw = localStorage.getItem('channelPrograms');
    if (!raw) { channelPrograms = null; return; }
    channelPrograms = JSON.parse(raw);
    if (!channelPrograms || !channelPrograms.length) { channelPrograms = null; return; }
    for (var i = 0; i < channelPrograms.length; i++) { var p = channelPrograms[i]; if (typeof p.start === 'string') p.start = new Date(p.start).getTime(); if (typeof p.end === 'string') p.end = new Date(p.end).getTime(); }
  } catch (e) { channelPrograms = null; }
}
function findCurrentAndNext() {
  if (!channelPrograms || !channelPrograms.length) return { current: null, next: null };
  var now = Date.now(), current = null, next = null;
  for (var i = 0; i < channelPrograms.length; i++) { var p = channelPrograms[i]; var sMs = p.start instanceof Date ? p.start.getTime() : p.start, eMs = p.end instanceof Date ? p.end.getTime() : p.end; if (sMs <= now && eMs > now) { current = { p: p, s: sMs, e: eMs }; break; } }
  var ref = current ? current.e : now;
  for (var j = 0; j < channelPrograms.length; j++) { var q = channelPrograms[j]; var qs = q.start instanceof Date ? q.start.getTime() : q.start; if (qs > ref) { next = { p: q, s: qs, e: q.end instanceof Date ? q.end.getTime() : q.end }; break; } }
  return { current: current, next: next };
}
function updateProgress() {
  if (!channelPrograms || !channelPrograms.length) return;
  var cur = findCurrentAndNext();
  if (!cur.current) { dthProgressFill.style.width = '0%'; return; }
  var total = cur.current.e - cur.current.s, elapsed = Date.now() - cur.current.s;
  dthProgressFill.style.width = Math.max(0, Math.min(100, (elapsed / total) * 100)).toFixed(1) + '%';
}
function startProgressUpdates() { stopProgressUpdates(); updateProgress(); progressTimer = setInterval(updateProgress, 1000); }
function stopProgressUpdates() { if (progressTimer) { clearInterval(progressTimer); progressTimer = null; } }
function updateDthBanner() {
  if (!currentChannel) return;
  var num = getChannelNumber(currentChannel);
  dthChNum.textContent = num !== null ? 'CH ' + num : 'CH —';
  if (currentChannel.logo) { dthLogo.src = currentChannel.logo; dthLogo.style.display = 'block'; dthLogoBox.classList.remove('no-logo'); }
  else { dthLogo.style.display = 'none'; dthLogoBox.classList.add('no-logo'); }
  dthChName.textContent = currentChannel.name || 'Unknown';
  var cur = findCurrentAndNext();
  if (cur.current) { dthNowTime.textContent = formatRange(cur.current.s, cur.current.e); dthNowTitle.textContent = cur.current.p.title || 'No Title'; }
  else { dthNowTime.textContent = ''; dthNowTitle.textContent = channelPrograms ? 'No current programme' : 'Loading guide…'; }
  if (cur.next) { dthNextTime.textContent = formatTimeOnly(cur.next.s); dthNextTitle.textContent = cur.next.p.title || 'No Title'; }
  else { dthNextTime.textContent = ''; dthNextTitle.textContent = channelPrograms ? 'No upcoming' : ''; }
  updateProgress();
}
function showDthBanner(ms) { updateDthBanner(); dthBanner.classList.add('visible'); startProgressUpdates(); if (bannerHideTimer) clearTimeout(bannerHideTimer); if (ms && ms > 0) bannerHideTimer = setTimeout(hideDthBanner, ms); }
function hideDthBanner() { dthBanner.classList.remove('visible'); stopProgressUpdates(); if (bannerHideTimer) { clearTimeout(bannerHideTimer); bannerHideTimer = null; } }
function peekBanner(ms) { if (!dthBanner.classList.contains('visible')) showDthBanner(ms || 5000); }
function startBannerRefreshTimer() { if (programUpdateTimer) clearInterval(programUpdateTimer); programUpdateTimer = setInterval(function() { if (dthBanner.classList.contains('visible')) updateDthBanner(); }, 60000); }

/* ══════════════════════════════════════════════════════════════
   Channel number typing — auto-switch after 1.2s, no OK needed
   ══════════════════════════════════════════════════════════════ */
function showChNumOverlay() { chNumValue.textContent = chNumBuffer || '—'; chNumOverlay.classList.add('visible'); }
function hideChNumOverlay() { chNumOverlay.classList.remove('visible'); }
function handleChNumDigit(digit) {
  if (chNumBuffer.length >= 4) chNumBuffer = '';
  chNumBuffer += digit;
  showChNumOverlay();
  clearTimeout(chNumTimer);
  chNumTimer = setTimeout(autoSwitchByNumber, 1200);
}
function autoSwitchByNumber() {
  var num = chNumBuffer;
  chNumBuffer = '';
  clearTimeout(chNumTimer);
  hideChNumOverlay();
  if (!num) return;

  var n = parseInt(num, 10);
  var all = [];
  try { all = JSON.parse(localStorage.getItem('allChannels') || '[]'); } catch (e) {}
  var found = null;
  for (var i = 0; i < all.length; i++) if (getChannelNumber(all[i]) === n) { found = all[i]; break; }

  if (found) { switchToChannel(found, n); return; }

  showToast('Looking up CH ' + n + '…');
  fetchChannelsFrom(0).then(function(chs) {
    try { localStorage.setItem('allChannels', JSON.stringify(chs)); } catch (e) {}
    var f2 = null;
    for (var j = 0; j < chs.length; j++) if (getChannelNumber(chs[j]) === n) { f2 = chs[j]; break; }
    if (f2) switchToChannel(f2, n);
    else showToast('Channel ' + num + ' not found', true);
  }).catch(function() { showToast('Channel ' + num + ' not found', true); });
}
function switchToChannel(ch, num) {
  try {
    localStorage.setItem('currentChannel', JSON.stringify(ch));
    var cache = JSON.parse(localStorage.getItem(EPG_CACHE_KEY) || '{}');
    var raw = cache.data && cache.data[String(ch.id)];
    if (raw && raw.length) {
      var ser = [];
      for (var i = 0; i < raw.length; i++) ser.push({ title: raw[i].t, description: raw[i].d, start: raw[i].s, end: raw[i].e, icon: raw[i].ic || '' });
      localStorage.setItem('channelPrograms', JSON.stringify(ser));
    } else localStorage.removeItem('channelPrograms');
  } catch (e) {}
  showToast('Switching to CH ' + num + ' · ' + (ch.name || ''));
  setTimeout(function() { window.location.href = 'jplayer.html?id=' + encodeURIComponent(ch.id); }, 300);
}

function extractStarCookie(data, channelId) {
  var results = [];
  if (data && Array.isArray(data.successful_results)) results = results.concat(data.successful_results);
  if (data && Array.isArray(data.failed_results)) results = results.concat(data.failed_results);
  for (var i = 0; i < results.length; i++) {
    var item = results[i]; if (!item) continue;
    if (String(item.channel_id) !== String(channelId)) continue;
    var finalUrl = (item.error_details && item.error_details.final_url) || item.final_url || '';
    var match = finalUrl.match(/[?&]__hdnea__=([^&]+)/); if (match) return '__hdnea__=' + match[1];
    var raw = finalUrl.match(/__hdnea__=([^&]+)/); if (raw) return '__hdnea__=' + raw[1];
  }
  return '';
}
function fetchCookiesForChannel(channelData) {
  var streamUrls = [channelData.url, channelData.url1, channelData.url2, channelData.url3].filter(function(u){ return !!u; }).map(function(u){ return u.replace('bpk-tv//', 'bpk-tv/'); });
  var hasJio = false, hasRegular = false;
  for (var i = 0; i < streamUrls.length; i++) { if (isJioPlLiveUrl(streamUrls[i])) hasJio = true; else hasRegular = true; }
  var primaryCookie = '', fallbackCookie = '', starCookie = '';
  var tasks = [];
  if (hasJio) tasks.push(fetchWithFallback(COOKIE_STAR_SPORTS, { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(d){ starCookie = extractStarCookie(d, channelData.id); }).catch(function(){}));
  if (hasRegular) tasks.push(fetchWithFallback(COOKIE_PRIMARY, { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(d){ if (Array.isArray(d)) { for (var i = 0; i < d.length; i++) if (d[i] && d[i].cookie) { primaryCookie = d[i].cookie; break; } } else if (d && d.cookie) primaryCookie = d.cookie; }).catch(function(){}));
  return Promise.all(tasks).then(function() { return { streamUrls: streamUrls, primaryCookie: primaryCookie, fallbackCookie: fallbackCookie, starCookie: starCookie }; });
}
function parseChannelJson(text) {
  var c = String(text).trim(); if (c.charCodeAt(0) === 0xFEFF) c = c.slice(1);
  try { var p = JSON.parse(c); if (Array.isArray(p)) return p; if (p && Array.isArray(p.channels)) return p.channels; } catch(e){}
  try { var p2 = JSON.parse('[' + c.replace(/,\s*$/, '') + ']'); if (Array.isArray(p2)) return p2; } catch(e){}
  throw new Error('Invalid JSON');
}
function fetchChannelsFrom(idx) {
  if (idx >= CHANNELS_CANDIDATES.length) return Promise.reject(new Error('All failed'));
  return xhrFetch(CHANNELS_CANDIDATES[idx], { headers: { 'X-Requested-With': 'XMLHttpRequest' }, timeout: 20000 })
    .then(function(r){ return r.text(); })
    .then(function(t){ var p = parseChannelJson(t); if (p && p.length) return p; throw new Error('Empty'); })
    .catch(function(){ return fetchChannelsFrom(idx + 1); });
}
function findChannelById(id) {
  var last = CHANNELS_CANDIDATES[CHANNELS_CANDIDATES.length - 1];
  return fetchChannelsFrom(0).catch(function() {
    return xhrFetch(CORS_PROXY + last, { timeout: 25000 }).then(function(r){ return r.text(); }).then(function(t){ return parseChannelJson(t); });
  }).then(function(list) {
    for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) return list[i];
    throw new Error('Channel not found');
  });
}

function initPlayer() {
  if (typeof shaka === 'undefined' || !shaka.Player) { showPlaceholder('⚠️ Player failed to load.<br>Check your internet connection.', true, false); return false; }
  try { if (shaka.polyfill && shaka.polyfill.installAll) shaka.polyfill.installAll(); } catch (e) {}
  if (!shaka.Player.isBrowserSupported()) { showPlaceholder('⚠️ This browser is not supported by the player.', true, false); return false; }

  shakaPlayer = new shaka.Player(videoEl);
  shakaPlayer.getNetworkingEngine().registerRequestFilter(function(type, request) {
    request.headers['Referer']    = 'https://www.jiotv.com/';
    request.headers['User-Agent'] = 'plaYtv/7.1.5';
    if (activeCookie && (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT)) {
      var url = request.uris[0];
      url = url.replace(/([?&])__hdnea__=[^&]*/g, '$1').replace(/[?&]+$/, '');
      var sep = url.indexOf('?') === -1 ? '?' : '&';
      request.uris[0] = url + sep + activeCookie;
    }
  });
  try {
    var uiConfig = { addSeekBar: true, addBigPlayButton: true, controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'quality', 'captions', 'playback_rate', 'picture_in_picture', 'fullscreen', 'overflow_menu'], overflowMenuButtons: ['quality', 'captions', 'playback_rate', 'picture_in_picture'] };
    shakaUI = new shaka.ui.Overlay(shakaPlayer, videoContainer, videoEl, uiConfig);
  } catch (e) { videoEl.setAttribute('controls', 'controls'); }
  syncTopBarWithShakaControls();
  return true;
}
function syncTopBarWithShakaControls() {
  var lastState = null, attempts = 0;
  function check() {
    attempts++;
    var ctrl = videoContainer.querySelector('.shaka-controls-container');
    if (!ctrl) { if (attempts < 30) setTimeout(check, 200); return; }
    setInterval(function() {
      var isHidden = ctrl.classList.contains('shaka-hidden') || ctrl.offsetParent === null || window.getComputedStyle(ctrl).visibility === 'hidden' || parseFloat(window.getComputedStyle(ctrl).opacity) === 0;
      if (isHidden !== lastState) { lastState = isHidden; if (isHidden) topBar.classList.add('hidden'); else topBar.classList.remove('hidden'); }
    }, 200);
    var initial = ctrl.classList.contains('shaka-hidden');
    lastState = initial;
    if (initial) topBar.classList.add('hidden');
  }
  check();
}

function playChannel(channelData) {
  if (!shakaPlayer || isLoading) return;
  isLoading = true; autoplayAttempted = false; hideUnmuteBtn(); hideTapToPlay();
  currentChannel = channelData;
  var num = getChannelNumber(channelData);
  chNumEl.textContent = num !== null ? 'CH ' + num : '';
  titleEl.textContent = channelData.name || 'Unknown';
  showPlaceholder('Connecting to stream…', false, true);

  shakaPlayer.unload().catch(function(){}).then(function() { return fetchCookiesForChannel(channelData); }).then(function(cookies) {
    var streamUrls = cookies.streamUrls;
    if (!streamUrls.length) { isLoading = false; showPlaceholder('⚠️ No stream URL.', true, false); return; }
    var clearKeys = {};
    if (Array.isArray(channelData.keys)) for (var i = 0; i < channelData.keys.length; i++) { var k = channelData.keys[i]; if (k && k.keyId && k.key) clearKeys[k.keyId] = k.key; }
    else if (channelData.keyId && channelData.key) clearKeys[channelData.keyId] = channelData.key;
    shakaPlayer.configure({ drm: { clearKeys: clearKeys }, streaming: { lowLatencyMode: true }, abr: { enabled: true } });

    var urlIdx = 0, loaded = false;
    function tryNextUrl() {
      if (loaded || urlIdx >= streamUrls.length) {
        if (!loaded) { isLoading = false; activeCookie = ''; showPlaceholder('⚠️ Could not load this channel.<br>Try another or tap Retry.', true, false); }
        return;
      }
      var streamUrl = streamUrls[urlIdx++];
      var isJio = isJioPlLiveUrl(streamUrl);
      var rounds = [];
      if (isJio) { if (cookies.starCookie) rounds.push(cookies.starCookie); }
      else { if (cookies.primaryCookie) rounds.push(cookies.primaryCookie); if (cookies.fallbackCookie && cookies.fallbackCookie !== cookies.primaryCookie) rounds.push(cookies.fallbackCookie); if (rounds.length === 0) rounds.push(''); }
      var cIdx = 0;
      function tryNextCookie() {
        if (loaded || cIdx >= rounds.length) { tryNextUrl(); return; }
        activeCookie = rounds[cIdx++];
        shakaPlayer.load(streamUrl).then(function() {
          loaded = true; isLoading = false; hidePlaceholder();
          attemptPlayback();
          setTimeout(function() { peekBanner(5000); }, 400);
        }).catch(function(e) { console.warn('[play] failed:', e && (e.code || e.message)); tryNextCookie(); });
      }
      tryNextCookie();
    }
    tryNextUrl();
  }).catch(function(e) { isLoading = false; showPlaceholder('⚠️ Error: ' + escapeHtml(e && e.message ? e.message : 'unknown'), true, false); });
}

var fitModes = [{ key: 'contain', label: 'FIT: CONTAIN' }, { key: 'cover', label: 'FULL: COVER' }, { key: 'stretch', label: 'FULL: STRETCH' }];
var fitModeIndex = 0;
function applyFitMode(index) { fitModeIndex = (index + fitModes.length) % fitModes.length; var mode = fitModes[fitModeIndex]; videoEl.className = 'fit-' + mode.key; fitBtn.innerHTML = mode.label; }
fitBtn.addEventListener('click', function(e){ e.preventDefault(); applyFitMode(fitModeIndex + 1); });
applyFitMode(0);

function goBack() { try { if (history.length > 1) history.back(); else window.location.href = 'jtv.html'; } catch (e) { window.location.href = 'jtv.html'; } }
backBtn.addEventListener('click', function(e){ e.preventDefault(); goBack(); });
phBackBtn.addEventListener('click', function(e){ e.preventDefault(); goBack(); });
phRetryBtn.addEventListener('click', function(e){ e.preventDefault(); if (currentChannel) playChannel(currentChannel); });

videoContainer.addEventListener('click', function(e) {
  if (e.target === backBtn || e.target === fitBtn || e.target === unmuteBtn || e.target === tapToPlay) return;
  if (e.target.closest && (e.target.closest('.shaka-overlays-container') || e.target.closest('#unmuteBtn') || e.target.closest('#tapToPlay'))) return;
  peekBanner(5000);
});
videoContainer.addEventListener('touchstart', function(e) {
  if (e.target === backBtn || e.target === fitBtn || e.target === unmuteBtn || e.target === tapToPlay) return;
  peekBanner(5000);
}, { passive: true });
videoContainer.addEventListener('mousemove', function() {
  var now = Date.now();
  if (now - lastMouseMoveTs < 400) return;
  lastMouseMoveTs = now;
  peekBanner(5000);
});

document.addEventListener('keydown', function(e) {
  var k = e.keyCode, focused = document.activeElement;

  /* Digits — auto-switch after 1.2s, no OK needed */
  var isNum = (k >= 48 && k <= 57) || (k >= 96 && k <= 105);
  if (isNum) { e.preventDefault(); handleChNumDigit(String.fromCharCode(k >= 96 ? k - 48 : k)); return; }

  if (k === 8 || k === 27 || k === 461 || k === 10009 || k === 10033) {
    if (dthBanner.classList.contains('visible') && !document.querySelector('.shaka-overflow-menu:not(.shaka-hidden)') && !document.querySelector('.shaka-settings-menu:not(.shaka-hidden)')) { e.preventDefault(); hideDthBanner(); return; }
    if (document.querySelector('.shaka-overflow-menu:not(.shaka-hidden)') || document.querySelector('.shaka-settings-menu:not(.shaka-hidden)')) return;
    e.preventDefault();
    goBack();
    return;
  }
  if (k === 37 || k === 38 || k === 39 || k === 40) {
    if (focused === fitBtn || focused === backBtn) return;
    peekBanner(3000);
  }
  var inTopBar = (focused === backBtn || focused === fitBtn);
  if (k === 37) { if (focused === fitBtn) { backBtn.focus(); e.preventDefault(); } else if (!inTopBar) { backBtn.focus(); e.preventDefault(); } }
  else if (k === 39) { if (focused === backBtn) { fitBtn.focus(); e.preventDefault(); } else if (!inTopBar) { fitBtn.focus(); e.preventDefault(); } }
  else if (k === 40 && inTopBar) { focused.blur(); e.preventDefault(); }
  else if (k === 38 && !inTopBar) { backBtn.focus(); e.preventDefault(); }
  else if (k === 13 && inTopBar) { e.preventDefault(); if (focused === backBtn) goBack(); else if (focused === fitBtn) applyFitMode(fitModeIndex + 1); }
});

videoEl.addEventListener('playing', function() { hidePlaceholder(); isLoading = false; if (videoEl.muted) showUnmuteBtn(); else hideUnmuteBtn(); });
videoEl.addEventListener('loadedmetadata', function() {
  if (!autoplayAttempted) return;
  setTimeout(function() { if (videoEl.paused && !isLoading && currentChannel) tryMutedPlayback(); }, 2000);
});

function boot() {
  var channelId = getQueryParam('id');
  if (!channelId) { showPlaceholder('⚠️ No channel selected.<br>Return to the channel list.', true, false); return; }
  if (!initPlayer()) return;
  loadChannelPrograms();
  startBannerRefreshTimer();

  var ch = null;
  try { var raw = localStorage.getItem('currentChannel'); if (raw) ch = JSON.parse(raw); } catch (e) { ch = null; }
  if (ch && String(ch.id) === String(channelId)) { playChannel(ch); return; }
  channelPrograms = null;
  showPlaceholder('Looking up channel…', false, true);
  findChannelById(channelId).then(function(found){ playChannel(found); }).catch(function(e) {
    showPlaceholder('⚠️ Channel not found.<br><div style="color:#888;font-size:12px;margin-top:8px">' + escapeHtml(e.message || '') + '</div>', true, false);
  });
}

if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 0);
else document.addEventListener('DOMContentLoaded', boot);
</script>
