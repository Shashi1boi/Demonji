<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Player</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#000; width:100%; height:100%; overflow:hidden; font-family:Arial,Helvetica,sans-serif; }
#frame { position:fixed; top:0; left:0; width:100%; height:100%; border:0; display:block; background:#000; }
#backBtn {
  position:fixed; top:calc(12px + env(safe-area-inset-top)); left:12px;
  z-index:100; padding:10px 14px; min-height:44px;
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.28);
  color:#fff; border-radius:8px;
  font:bold 14px Arial,Helvetica,sans-serif;
  cursor:pointer; outline:none;
  -webkit-appearance:none; appearance:none;
}
#backBtn:focus, #backBtn:hover { background:rgba(30,90,120,0.9); border-color:#4fc3f7; }
</style>
</head>
<body>
<button id="backBtn" type="button" aria-label="Back">◄</button>
<iframe
  id="frame"
  allow="autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write"
  allowfullscreen
  referrerpolicy="no-referrer"
  webkitallowfullscreen
  mozallowfullscreen
></iframe>
<script>
  var id = new URLSearchParams(location.search).get('id') || '167';
  document.getElementById('frame').src = 'https://livetgtv.lovable.app/embed/' + encodeURIComponent(id);
  document.getElementById('backBtn').onclick = function() {
    try { if (history.length > 1) history.back(); else location.href = 'jtv.html'; }
    catch (e) { location.href = 'jtv.html'; }
  };
</script>
</body>
</html>
