function xhrFetch(url, opts) {
  opts = opts || {};
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(opts.method || 'GET', url, true);
    xhr.timeout = opts.timeout || 20000;
    if (opts.headers) for (var k in opts.headers) if (opts.headers.hasOwnProperty(k)) try { xhr.setRequestHeader(k, opts.headers[k]); } catch(e){}

/* ════════ XMLTV parser ════════ */

    var descM = inner.match(/<desc[^>]*>([\s\S]*?)<\/desc>/);

}

  }

/* ════════ Program state (5 tiers) ════════ */
var STATE_RECENT_MS = 6 * 3600000;   /* 6h */
var STATE_UPCOMING_MS = 12 * 3600000; /* 12h */

function getProgramState(progs, now) {
  if (!progs || !progs.length) return null;
  now = now || Date.now();

  /* 1. Strict live */
  var live = null;
  for (var i = 0; i < progs.length; i++) {
    var p = progs[i];
    if (p.s <= now && p.e > now) { if (!live || p.s > live.s) live = p; }
  }
  if (live) return { p: live, state: 'live' };

  /* 2. Recent — ended within 6h */
  var recent = null;
  for (var j = 0; j < progs.length; j++) {
    var q = progs[j];
    if (q.e <= now && (now - q.e) <= STATE_RECENT_MS) { if (!recent || q.e > recent.e) recent = q; }
  }
  if (recent) return { p: recent, state: 'recent' };

  /* 3. Upcoming — starts within 12h */
  var upcoming = null;
  for (var k = 0; k < progs.length; k++) {
    var u = progs[k];
    if (u.s > now && (u.s - now) <= STATE_UPCOMING_MS) { if (!upcoming || u.s < upcoming.s) upcoming = u; }
  }
  if (upcoming) return { p: upcoming, state: 'upcoming' };

  /* 4/5. Closest — always show something if we have data */
  var closest = null, closestDist = Infinity, closestPast = false;
  for (var m = 0; m < progs.length; m++) {
    var c = progs[m];
    var dist = c.s > now ? (c.s - now) : (c.e < now ? (now - c.e) : 0);
    if (dist < closestDist) { closestDist = dist; closest = c; closestPast = c.e < now; }
  }
  if (closest) return { p: closest, state: closestPast ? 'far-past' : 'far-future' };
  return null;
}

function getCurrentProgram(progs, now) { var r = getProgramState(progs, now); return r ? r.p : null; }

  for (var i = 0; i < progs.length; i++) { var p = progs[i]; if (p.s > ref && (!best || p.s < best.s)) best = p; }
  return best;
}

}

  var total = state.p.e - state.p.s;

  return Math.max(0, Math.min(100, ((Date.now() - state.p.s) / total) * 100));
}

function buildCardMap() {
  cardMap = {};
  var cards = gridEl.querySelectorAll('.card');
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i], idx = parseInt(card.getAttribute('data-idx'), 10);
    var ch = displayedChannels[idx]; if (!ch) continue;
    cardMap[String(ch.id)] = { el: card, epg: card.querySelector('.card-epg'), ch: ch, lastEpg: '' };
    (function(cardEl, channel) {
      cardEl.addEventListener('click', function(e) { if (e.target.closest && (e.target.closest('.card-btn') || e.target.closest('.card-star'))) return; openDetails(channel); });
      cardEl.addEventListener('keydown', function(ev) { if (ev.keyCode === 13) { ev.preventDefault(); openDetails(channel); } });
      var playBtn = cardEl.querySelector('.card-btn'); if (playBtn) playBtn.addEventListener('click', function(e) { e.stopPropagation(); openPlayer(channel); });
      var star = cardEl.querySelector('.card-star'); if (star) star.addEventListener('click', function(e) { e.stopPropagation(); toggleFavorite(channel.id); });
    })(card, ch);
  }
}

/* ════════ Sort / filter ════════ */
function sortChannels(arr) {
  var copy = arr.slice();
  if (sortMode === 'number') copy.sort(function(a,b){ var na = getChannelNumber(a), nb = getChannelNumber(b); if (na === null && nb === null) return (a.name || '').localeCompare(b.name || ''); if (na === null) return 1; if (nb === null) return -1; return na - nb; });
  else if (sortMode === 'name') copy.sort(function(a,b){ return (a.name || '').localeCompare(b.name || ''); });
  else if (sortMode === 'category') copy.sort(function(a,b){ var ca = (a.category || a.group || 'Other').toLowerCase(); var cb = (b.category || b.group || 'Other').toLowerCase(); if (ca !== cb) return ca.localeCompare(cb); return (a.name || '').localeCompare(b.name || ''); });
  return copy;
}
function channelMatches(ch, q, cat) {
  var chCat = ch.category || ch.group || 'Other';
  if (cat === 'favorites') { if (!favorites[String(ch.id)]) return false; }
  else if (cat === 'recents') { if (recents.indexOf(String(ch.id)) === -1) return false; }
  else if (cat === 'live') { var st = getProgramState(epgByChannelId[String(ch.id)]); if (!st || st.state !== 'live') return false; }
  else if (cat !== 'all' && chCat !== cat) return false;
  if (q) {
    var nameLow = (ch.name || '').toLowerCase(), catLow = chCat.toLowerCase();
    if (nameLow.indexOf(q) === -1 && catLow.indexOf(q) === -1) {
      var progs = epgByChannelId[String(ch.id)];
      if (!progs) return false;
      var found = false;
      for (var i = 0; i < progs.length; i++) if ((progs[i].t || '').toLowerCase().indexOf(q) !== -1 || (progs[i].d || '').toLowerCase().indexOf(q) !== -1) { found = true; break; }
      if (!found) return false;
    }
  }
  return true;
}
function applyFilter() {
  var q = searchQuery, cat = selectedCategory, visible = [];
  for (var i = 0; i < allChannels.length; i++) if (channelMatches(allChannels[i], q, cat)) visible.push(allChannels[i]);
  displayedChannels = sortChannels(visible);
  renderAllCards(function(){
    if (viewMode === 'compact') { var cards = gridEl.querySelectorAll('.card'); for (var k = 0; k < cards.length; k++) cards[k].classList.add('compact'); }
    refreshAllCardsEpg();
  });
}
function renderCategories() {
  var set = {};
  for (var i = 0; i < allChannels.length; i++) { var cat = allChannels[i].category || allChannels[i].group || 'Other'; set[cat] = true; }
  var cats = ['all']; for (var k in set) if (set.hasOwnProperty(k)) cats.push(k);
  cats.sort(function(a,b){ if(a==='all') return -1; if(b==='all') return 1; return a.toLowerCase().localeCompare(b.toLowerCase()); });
  var html = '<button class="cat-chip fav-chip' + (selectedCategory==='favorites'?' active':'') + '" data-cat="favorites" type="button">★ Favorites</button>';
  html += '<button class="cat-chip recent-chip' + (selectedCategory==='recents'?' active':'') + '" data-cat="recents" type="button">🕐 Recent</button>';
  html += '<button class="cat-chip live-chip' + (selectedCategory==='live'?' active':'') + '" data-cat="live" type="button">● Live</button>';
  html += '<button class="cat-chip' + (selectedCategory==='all'?' active':'') + '" data-cat="all" type="button">All</button>';
  for (var j = 0; j < cats.length; j++) { if (cats[j] === 'all') continue; var a = cats[j] === selectedCategory ? ' active' : ''; html += '<button class="cat-chip' + a + '" data-cat="' + escapeHtml(cats[j]) + '" type="button">' + escapeHtml(cats[j]) + '</button>'; }
  categoriesEl.innerHTML = html;
  var chips = categoriesEl.querySelectorAll('.cat-chip');
  for (var c = 0; c < chips.length; c++) (function(chip){ chip.addEventListener('click', function(){ selectedCategory = chip.getAttribute('data-cat'); renderCategories(); applyFilter(); wrapEl.scrollTop = 0; }); })(chips[c]);
}

/* ════════ Detail modal ════════ */
function openDetails(ch) {
  currentDetailChannel = ch; currentDetailTab = 'info';
  dTabInfo.classList.add('active'); dTabGuide.classList.remove('active');
  var num = getChannelNumber(ch);
  dNum.textContent = num !== null ? 'CH ' + num : '';
  dName.textContent = ch.name || 'Unknown';
  dCat.textContent = ch.category || ch.group || 'Other';
  dLogo.src = ch.logo || ''; dLogo.style.visibility = ch.logo ? 'visible' : 'hidden';
  renderDetailBody(); detailModal.classList.remove('hidden');
}
function renderDetailBody() { if (!currentDetailChannel) return; if (currentDetailTab === 'info') renderInfoTab(currentDetailChannel); else renderGuideTab(currentDetailChannel); }
function renderInfoTab(ch) {
  var progs = epgByChannelId[String(ch.id)] || [];
  var st = getProgramState(progs);
  var next = st ? getNextProgram(progs, st.p.e) : getNextProgram(progs, Date.now());
  var body = '';
  if (st) {
    var cls = st.state === 'live' ? 'now' : (st.state === 'recent' ? 'recent' : (st.state === 'upcoming' ? 'next' : 'none'));
    var lbl = stateLabel(st.state).text;
    body += '<div class="detail-show ' + cls + '"><div class="show-label">' + lbl + ' · ' + formatRange(st.p.s, st.p.e) + '</div><div class="show-title">' + escapeHtml(st.p.t || 'No Title') + '</div>';
    if (st.p.ep || st.p.g) body += '<div class="show-meta-row">' + (st.p.ep ? escapeHtml(st.p.ep) : '') + (st.p.g ? ' · ' + escapeHtml(st.p.g) : '') + '</div>';
    if (st.p.ic) body += '<div class="show-image"><img src="' + escapeHtml(st.p.ic) + '" onerror="this.parentNode.style.display=\'none\'"></div>';
    if (st.p.d) body += '<div class="show-desc">' + escapeHtml(st.p.d) + '</div>';
    if (st.state === 'live') body += '<div class="epg-progress"><div class="epg-progress-fill" style="width:' + progProgress(st).toFixed(1) + '%"></div></div>';
    body += '</div>';
  } else if (epgLoaded) body += '<div class="detail-show none"><div class="show-label">● NOW</div><div class="show-title">No guide data for this channel</div></div>';
  else body += '<div class="detail-show none"><div class="show-label">● NOW</div><div class="show-title">Loading guide…</div></div>';
  if (next) {
    body += '<div class="detail-show next"><div class="show-label">○ NEXT · ' + formatRange(next.s, next.e) + '</div><div class="show-title">' + escapeHtml(next.t || 'No Title') + '</div>';
    if (next.d) body += '<div class="show-desc">' + escapeHtml(next.d) + '</div>';
    body += '</div>';
  }
  dBody.innerHTML = body;
}
function renderGuideTab(ch) {
  var progs = epgByChannelId[String(ch.id)] || [];
  if (!progs.length) { dBody.innerHTML = '<div class="msg" style="padding:30px">No guide data for this channel.</div>'; return; }
  var now = Date.now();
  var strictLive = getStrictLive(progs, now);
  var todayStart = new Date(); todayStart.setHours(0,0,0,0);
  var todayEnd = todayStart.getTime() + 86400000;
  var filtered = progs.filter(function(p){ return p.e > todayStart.getTime() && p.s < todayEnd; });
  if (!filtered.length) filtered = progs.slice(0, 30);
  var body = '';
  for (var i = 0; i < filtered.length; i++) {
    var p = filtered[i];
    var isLive = strictLive && strictLive.p === p;
    var isPast = p.e <= now;
    var cls = isLive ? ' live' : (isPast ? ' past' : '');
    var badge = isLive ? ' <span class="airing-tag">● AIRING</span>' : '';
    body += '<div class="timeline-row' + cls + '"><div class="timeline-time">' + formatRange(p.s, p.e) + '</div><div class="timeline-title">' + escapeHtml(p.t || 'No Title') + (p.ep ? ' <span style="color:#7cd0f5;font-size:11px">' + escapeHtml(p.ep) + '</span>' : '') + badge + '</div></div>';
  }
  dBody.innerHTML = body;
}
function closeDetails(){ detailModal.classList.add('hidden'); currentDetailChannel = null; }

/* ════════ Player launch ════════ */
function openPlayer(ch) {
  addRecent(ch.id);
  try {
    localStorage.setItem('currentChannel', JSON.stringify(ch));
    localStorage.setItem('allChannels', JSON.stringify(allChannels));
    var progs = epgByChannelId[String(ch.id)];
    if (progs && progs.length) {
      var ser = [];
      for (var i = 0; i < progs.length; i++) ser.push({ title: progs[i].t, description: progs[i].d, start: progs[i].s, end: progs[i].e, icon: progs[i].ic || '', episode: progs[i].ep || '', genre: progs[i].g || '' });
      localStorage.setItem('channelPrograms', JSON.stringify(ser));
    } else localStorage.removeItem('channelPrograms');
  } catch (e) {}
  var url = 'jplayer.html?id=' + encodeURIComponent(ch.id);
  try { var w = window.open(url, '_blank'); if (!w) window.location.href = url; } catch (e) { window.location.href = url; }
}

/* ════════ Channel number overlay ════════ */
function showChNumOverlay(){ chNumValue.textContent = chNumBuffer || '—'; chNumOverlay.classList.add('visible'); }
function hideChNumOverlay(){ chNumOverlay.classList.remove('visible'); }
function handleChNumDigit(digit) { if (chNumBuffer.length >= 4) chNumBuffer = ''; chNumBuffer += digit; showChNumOverlay(); clearTimeout(chNumTimer); chNumTimer = setTimeout(commitChNum, 1200); }
function commitChNum() {
  var num = chNumBuffer; chNumBuffer = ''; clearTimeout(chNumTimer); hideChNumOverlay();
  if (!num) return;
  var n = parseInt(num, 10);
  for (var i = 0; i < allChannels.length; i++) if (getChannelNumber(allChannels[i]) === n) { showToast('Tuning to CH ' + n + ' · ' + (allChannels[i].name || '')); openPlayer(allChannels[i]); return; }
  showToast('Channel ' + num + ' not found', true);
}
function cancelChNum(){ chNumBuffer = ''; clearTimeout(chNumTimer); hideChNumOverlay(); }

/* ════════ Coverage stats ════════ */
function countCoverage() {
  var now = Date.now(), withData = 0, live = 0, recent = 0, upcoming = 0, farPast = 0, farFuture = 0;
  for (var i = 0; i < allChannels.length; i++) {
    var progs = epgByChannelId[String(allChannels[i].id)];
    if (progs && progs.length) {
      withData++;
      var st = getProgramState(progs, now);
      if (st) {
        if (st.state === 'live') live++;
        else if (st.state === 'recent') recent++;
        else if (st.state === 'upcoming') upcoming++;
        else if (st.state === 'far-past') farPast++;
        else if (st.state === 'far-future') farFuture++;
      }
    }
  }
  return { withData: withData, live: live, recent: recent, upcoming: upcoming, farPast: farPast, farFuture: farFuture };
}

/* ════════ Load EPG ════════ */
function loadEPG() {
  var t0 = Date.now();
  setEpgStatus('Loading guide (jioepg)…');
  fetchAndParseEPG().then(function(result) {
    if (result && Object.keys(result.data).length) {
      epgByChannelId = result.data; epgLoaded = true; saveCache();
      var elapsed = ((Date.now() - t0) / 1000).toFixed(1);
      var cov = countCoverage(), total = allChannels.length;
      var pct = Math.round((cov.withData / total) * 100);
      var kind = pct >= 60 ? 'ok' : (pct >= 30 ? 'warn' : 'error');
      setEpgStatus('Guide: ' + cov.withData + '/' + total + ' ch (' + pct + '%) · ' + cov.live + ' live · ' + cov.recent + ' recent · ' + cov.upcoming + ' next · ' + cov.farPast + ' past · ' + cov.farFuture + ' future · ' + elapsed + 's', kind);
      setTimeout(function(){ setEpgStatus(''); }, 14000);
      refreshAllCardsEpg();
      safeLog('[epg] DONE — ' + cov.withData + '/' + total + ' ch · live=' + cov.live + ' recent=' + cov.recent + ' upcoming=' + cov.upcoming + ' farPast=' + cov.farPast + ' farFuture=' + cov.farFuture);
    } else {
      setEpgStatus('Guide unavailable — channels only', 'error');
      setTimeout(function(){ setEpgStatus(''); }, 5000);
    }
  });
}

/* ════════ Load channels ════════ */
function loadChannels() {
  gridEl.innerHTML = '<div class="msg"><div class="spinner"></div><div>Loading channels…</div></div>';
  var last = CHANNELS_CANDIDATES[CHANNELS_CANDIDATES.length - 1];
  fetchChannelsFrom(0)
    .catch(function() { return xhrFetch(CORS_PROXY + last, { timeout: 25000 }).then(function(r){ return r.text(); }).then(function(t){ return parseChannelJson(t); }); })
    .then(function(chs) {
      if (!chs || !chs.length) throw new Error('No channels');
      allChannels = chs; displayedChannels = chs.slice();
      loadPrefs(); renderCategories();
      var cacheFresh = loadCache();
      renderAllCards(function() {
        if (cacheFresh) {
          refreshAllCardsEpg();
          var cov = countCoverage();
          setEpgStatus('Cache: ' + cov.withData + '/' + allChannels.length + ' · ' + cov.live + ' live · ' + cov.recent + ' recent · ' + cov.upcoming + ' next · ' + cov.farPast + ' past · ' + cov.farFuture + ' future');
          setTimeout(function(){ setEpgStatus(''); }, 6000);
        } else loadEPG();
      });
      if (progressUpdateTimer) clearInterval(progressUpdateTimer);
      progressUpdateTimer = setInterval(function(){ refreshAllCardsEpg(); }, 30000);
    })
    .catch(function() { gridEl.innerHTML = '<div class="msg err">⚠️ Could not load channels.<br><button onclick="location.reload()">Retry</button></div>'; });
}

/* ════════ Wiring ════════ */
var searchTimer = null;
searchEl.addEventListener('input', function() { clearTimeout(searchTimer); searchTimer = setTimeout(function() { searchQuery = searchEl.value.trim().toLowerCase(); applyFilter(); wrapEl.scrollTop = 0; }, 150); });
sortSelect.addEventListener('change', function() { sortMode = sortSelect.value; savePrefs(); applyFilter(); });
viewBtn.addEventListener('click', function() { viewMode = viewMode === 'grid' ? 'compact' : 'grid'; updateViewBtn(); savePrefs(); var cards = gridEl.querySelectorAll('.card'); for (var i = 0; i < cards.length; i++) { if (viewMode === 'compact') cards[i].classList.add('compact'); else cards[i].classList.remove('compact'); } });
refreshBtn.addEventListener('click', function() { showToast('Refreshing guide…'); clearCacheAndRefresh(); });
helpBtn.addEventListener('click', function() { helpModal.classList.remove('hidden'); });
helpClose.addEventListener('click', function() { helpModal.classList.add('hidden'); });
dTabInfo.addEventListener('click', function(){ currentDetailTab = 'info'; dTabInfo.classList.add('active'); dTabGuide.classList.remove('active'); renderDetailBody(); });
dTabGuide.addEventListener('click', function(){ currentDetailTab = 'guide'; dTabGuide.classList.add('active'); dTabInfo.classList.remove('active'); renderDetailBody(); });
dClose.addEventListener('click', function(e){ e.preventDefault(); closeDetails(); });
dCancel.addEventListener('click', function(e){ e.preventDefault(); closeDetails(); });
dWatch.addEventListener('click', function(e){ e.preventDefault(); if (currentDetailChannel) openPlayer(currentDetailChannel); });
detailModal.addEventListener('click', function(e){ if (e.target === detailModal) closeDetails(); });

document.addEventListener('keydown', function(e) {
  var k = e.keyCode, focused = document.activeElement;
  var inDetail = !detailModal.classList.contains('hidden'), inHelp = !helpModal.classList.contains('hidden'), inSearch = focused === searchEl;
  if (inHelp) { if (k === 27 || k === 13) { e.preventDefault(); helpModal.classList.add('hidden'); } return; }
  if (inDetail) { if (k === 27 || k === 8) { e.preventDefault(); closeDetails(); } return; }
  if (k === 191 && !inSearch) { e.preventDefault(); helpModal.classList.remove('hidden'); return; }
  if (k === 82 && !inSearch && !chNumBuffer) { e.preventDefault(); refreshBtn.click(); return; }
  if (k === 83 && !inSearch && !chNumBuffer) { e.preventDefault(); searchEl.focus(); return; }
  if (k === 70 && focused && focused.classList && focused.classList.contains('card')) { e.preventDefault(); var favId = focused.getAttribute('data-chid'); if (favId) toggleFavorite(favId); return; }
  var isNumKey = (k >= 48 && k <= 57) || (k >= 96 && k <= 105);
  if (isNumKey && !inSearch) { e.preventDefault(); handleChNumDigit(String.fromCharCode(k >= 96 ? k - 48 : k)); return; }
  if (k === 13 && chNumBuffer) { e.preventDefault(); clearTimeout(chNumTimer); commitChNum(); return; }
  if ((k === 27 || k === 8) && chNumBuffer) { e.preventDefault(); cancelChNum(); return; }
  if (focused && focused.classList && focused.classList.contains('card')) {
    var visible = gridEl.querySelectorAll('.card'), cardIdx = Array.prototype.indexOf.call(visible, focused);
    if (k === 37 && cardIdx > 0) { visible[cardIdx - 1].focus(); e.preventDefault(); }
    else if (k === 39 && cardIdx < visible.length - 1) { visible[cardIdx + 1].focus(); e.preventDefault(); }
    else if (k === 13) { e.preventDefault(); var chid = focused.getAttribute('data-chid'); for (var fi = 0; fi < displayedChannels.length; fi++) if (String(displayedChannels[fi].id) === chid) { openDetails(displayedChannels[fi]); return; } }
  }
});

function boot() { loadChannels(); }
if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 0);
else document.addEventListener('DOMContentLoaded', boot);
</script>
