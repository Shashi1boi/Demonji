<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Channels</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: #0a0a0a; color: #eee; font-family: Arial, Helvetica, sans-serif; width: 100%; height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; }
#header { background: #111; border-bottom: 1px solid #222; padding: 12px 20px; padding-top: calc(12px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; flex-shrink: 0; }
#header h1 { font-size: 20px; font-weight: bold; color: #4fc3f7; white-space: nowrap; margin: 0; }
#searchWrap { flex: 1; min-width: 200px; }
#search { width: 100%; padding: 12px 16px; font-size: 16px; background: #1a1a1a; border: 1px solid #333; color: #eee; border-radius: 6px; outline: none; font-family: inherit; -webkit-appearance: none; }
#search:focus { border-color: #4fc3f7; background: #202020; }
#epgStatus { font-size: 11px; color: #888; width: 100%; margin-top: 4px; display: none; }
#epgStatus.visible { display: block; }
#epgStatus.error { color: #ef5350; }
#categories { background: #0e0e0e; border-bottom: 1px solid #222; padding: 10px 16px; overflow-x: auto; overflow-y: hidden; white-space: nowrap; flex-shrink: 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
#categories::-webkit-scrollbar { display: none; }
.cat-chip { display: inline-block; padding: 8px 16px; margin-right: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; outline: none; font-family: inherit; white-space: nowrap; transition: background .15s, color .15s, border-color .15s; }
.cat-chip:hover { background: #242424; color: #fff; }

.cat-chip:focus { background: #1e2a35; border-color: #4fc3f7; box-shadow: 0 0 0 2px rgba(79,195,247,0.35); }
#wrap { height: calc(100vh - 130px); height: calc(100dvh - 130px); overflow-y: auto; overflow-x: hidden; padding: 14px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
#grid { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -6px; }
.card { box-sizing: border-box; padding: 12px; margin: 6px; width: calc(100% - 12px); background: #161616; border: 2px solid transparent; border-radius: 10px; cursor: pointer; outline: none; transition: background .15s, border-color .15s; display: flex; flex-direction: column; gap: 10px; }

.card-logo { width: 48px; height: 48px; border-radius: 8px; object-fit: contain; background: #222; flex-shrink: 0; }
.card-meta { flex: 1; min-width: 0; }
.card-name { font-size: 15px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.card-epg { padding: 10px 12px; background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 3px solid #4fc3f7; min-height: 50px; }
.epg-now-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #888; margin-bottom: 4px; }
.epg-now-label { display: inline-block; padding: 2px 6px; background: #66bb6a; color: #fff; border-radius: 3px; font-size: 10px; font-weight: bold; letter-spacing: .5px; }
.epg-now-time { color: #aaa; font-size: 11px; }
.epg-now-title { font-size: 13px; color: #ddd; font-weight: bold; line-height: 1.35; margin-bottom: 4px; }
.epg-now-desc { font-size: 11px; color: #777; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.epg-empty { font-size: 12px; color: #555; font-style: italic; }
.card-actions { display: flex; gap: 8px; justify-content: flex-end; }
.card-btn { padding: 8px 14px; background: #1e5a78; border: 1px solid #4fc3f7; color: #fff; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; outline: none; font-family: inherit; white-space: nowrap; }
.card-btn:hover { background: #2a7ba0; }
.card-btn:focus { box-shadow: 0 0 0 2px rgba(79,195,247,0.35); }

.msg button { margin-top: 16px; background: #2a2a2a; border: none; color: #eee; padding: 12px 24px; border-radius: 6px; font-size: 15px; cursor: pointer; font-family: inherit; }
.spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #333; border-top-color: #4fc3f7; border-radius: 50%; -webkit-animation: spin 0.8s linear infinite; animation: spin 0.8s linear infinite; margin-bottom: 14px; }
@-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (min-width: 600px) { .card { width: calc(50% - 12px); } }
@media (min-width: 900px) { .card { width: calc(33.333% - 12px); } }
@media (min-width: 1280px) { .card { width: calc(33.333% - 12px); padding: 14px; } .card-logo { width: 56px; height: 56px; } .card-name { font-size: 17px; } .epg-now-title { font-size: 14px; } }
@media (min-width: 1700px) { .card { width: calc(25% - 12px); } .card-name { font-size: 18px; } }
@media (max-width: 480px) { #header { padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top)); } #header h1 { font-size: 16px; width: 100%; } #searchWrap { min-width: 100%; } #search { padding: 10px 12px; font-size: 15px; } #categories { padding: 8px 12px; } .cat-chip { padding: 7px 12px; font-size: 12px; } #wrap { padding: 10px; } .card { padding: 10px; gap: 8px; } .card-logo { width: 42px; height: 42px; } .card-name { font-size: 14px; } .epg-now-title { font-size: 12px; } .epg-now-desc { -webkit-line-clamp: 1; } .card-btn { padding: 7px 12px; font-size: 11px; } }
</style>
</head>
<body>

<div id="header">
  <h1>📺 JTV Channels</h1>
  <div id="searchWrap">
    <input id="search" type="search" placeholder="Search channels…" autocomplete="off">
  </div>
  <div id="epgStatus"></div>
</div>
<div id="categories"></div>
<div id="wrap">
  <div id="grid"><div class="msg"><div class="spinner"></div><div>Loading channels…</div></div></div>
</div>

<script>
if (!Array.prototype.includes) {
  Array.prototype.includes = function(x){ return this.indexOf(x) !== -1; };
}

function safeLog() { try { console.log.apply(console, arguments); } catch (e) {} }
function safeWarn() { try { console.warn.apply(console, arguments); } catch (e) {} }

function xhrFetch(url, opts) {
  opts = opts || {};
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(opts.method || 'GET', url, true);
    xhr.timeout = opts.timeout || 20000;
    if (opts.headers) {
      for (var k in opts.headers) {
        if (opts.headers.hasOwnProperty(k)) {
          try { xhr.setRequestHeader(k, opts.headers[k]); } catch(e){}
        }
      }
    }
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve({
          ok: true, status: xhr.status,
          text: function(){ return Promise.resolve(xhr.responseText); },
          json: function(){ return Promise.resolve(JSON.parse(xhr.responseText)); }
        });
      } else reject(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = function(){ reject(new Error('Network error')); };
    xhr.ontimeout = function(){ reject(new Error('Timeout after ' + xhr.timeout + 'ms')); };
    try { xhr.send(opts.body || null); } catch(e){ reject(e); }
  });
}

function xhrFetchBuffer(url, opts) {
  opts = opts || {};
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(opts.method || 'GET', url, true);
    xhr.responseType = 'arraybuffer';
    xhr.timeout = opts.timeout || 120000;
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.response);
      else reject(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = function(){ reject(new Error('Network error')); };
    xhr.ontimeout = function(){ reject(new Error('Timeout after ' + xhr.timeout + 'ms')); };
    try { xhr.send(null); } catch(e){ reject(e); }
  });
}

/* ══════════════════════════════════════════════════════════════
   CONFIG — TSEPG first, Open-EPG second
   ══════════════════════════════════════════════════════════════ */
var CHANNELS_CANDIDATES = [
  '/jstr4web.json',
  'https://jjtvxweb.pages.dev/jstr4web.json'
];
var CORS_PROXY = 'https://demonji.onrender.com/cors-proxy.php/';

var EPG_SOURCES = [
  { url: 'https://avkb.short.gy/tsepg.xml.gz',            name: 'AVKB TSEPG', timeout: 180000 },
  { url: 'https://www.open-epg.com/files/india.xml',   name: 'Open-EPG',   timeout: 180000 }
];

var gridEl       = document.getElementById('grid');
var searchEl     = document.getElementById('search');
var categoriesEl = document.getElementById('categories');
var wrapEl       = document.getElementById('wrap');
var epgStatusEl  = document.getElementById('epgStatus');

var allChannels      = [];
var filteredChannels = [];
var selectedCategory = 'all';
var searchQuery      = '';

var epgById   = null;
var epgByName = null;
var epgLoaded = false;

/* ══════════════════════════════════════════════════════════════
   NEW: PRE-COMPUTED LOOKUP — same matching as before, computed once
   ══════════════════════════════════════════════════════════════ */
var channelEpgMap = {};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function truncate(str, n) {
  if (!str) return '';
  return str.length > n ? str.substring(0, n - 1) + '…' : str;
}
function formatTimeOnly(date) {
  var h = date.getHours(); var m = date.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
}
function parseEPGDate(dateStr) {
  if (!dateStr) return null;
  var parts = String(dateStr).trim().split(' ');
  var datetime = parts[0];
  var tz = parts[1] || '+0000';
  var year   = parseInt(datetime.slice(0, 4), 10);
  var month  = parseInt(datetime.slice(4, 6), 10) - 1;
  var day    = parseInt(datetime.slice(6, 8), 10);
  var hour   = parseInt(datetime.slice(8, 10), 10);
  var minute = parseInt(datetime.slice(10, 12), 10);
  var second = parseInt(datetime.slice(12, 14), 10);
  if (isNaN(year)) return null;
  var date = new Date(Date.UTC(year, month, day, hour, minute, second));
  var tzSign  = tz.charAt(0);
  var tzHours = parseInt(tz.slice(1, 3), 10) || 0;
  var tzMins  = parseInt(tz.slice(3, 5), 10) || 0;
  var offset  = (tzHours * 3600 + tzMins * 60) * 1000;
  if (tzSign === '-') offset = -offset;
  date.setTime(date.getTime() - offset);
  return date;
}
function normalizeChannelName(name) {
  if (!name) return '';
  var cleaned = String(name).toLowerCase()
    .replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
  cleaned = cleaned.replace(/\b(hd|sd|fhd|4k|plus|movies|music|news|tv|channel)\b/g, '').trim();
  return cleaned;
}
function bytesToUtf8String(bytes) {
  if (typeof TextDecoder !== 'undefined') {
    try { return new TextDecoder('utf-8').decode(bytes); } catch (e) {}
  }
  var result = '', i = 0;
  while (i < bytes.length) {
    var b = bytes[i++];
    if (b < 0x80) result += String.fromCharCode(b);
    else if (b < 0xE0) result += String.fromCharCode(((b & 0x1F) << 6) | (bytes[i++] & 0x3F));
    else if (b < 0xF0) result += String.fromCharCode(((b & 0x0F) << 12) | ((bytes[i++] & 0x3F) << 6) | (bytes[i++] & 0x3F));
    else {
      var cp = ((b & 0x07) << 18) | ((bytes[i++] & 0x3F) << 12) | ((bytes[i++] & 0x3F) << 6) | (bytes[i++] & 0x3F);
      cp -= 0x10000;
      result += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 0x3FF));
    }
  }
  return result;
}

function setEpgStatus(text, isError) {
  if (!epgStatusEl) return;
  if (!text) { epgStatusEl.classList.remove('visible'); epgStatusEl.textContent = ''; return; }
  epgStatusEl.textContent = text;
  epgStatusEl.classList.add('visible');
  if (isError) epgStatusEl.classList.add('error');
  else epgStatusEl.classList.remove('error');
}

function chunkedUngzip(bytes) {
  return new Promise(function(resolve, reject) {
    if (typeof pako === 'undefined') { reject(new Error('pako not loaded')); return; }
    try {
      var inflator = new pako.Inflate({ to: 'string' });
      var chunks = [];
      var totalChars = 0;
      var startTime = Date.now();

      inflator.onData = function(chunk) { chunks.push(chunk); totalChars += chunk.length; };
      inflator.onEnd = function(status) {
        if (status === 0) {
          safeLog('[pako] done — ' + totalChars + ' chars in ' + (Date.now() - startTime) + 'ms');
          resolve(chunks.join(''));
        } else reject(new Error('inflate failed status ' + status));
      };

      var offset = 0;
      var CHUNK = 65536;
      function pushNext() {
        if (offset >= bytes.length) return;
        var end = Math.min(offset + CHUNK, bytes.length);
        var chunk = bytes.subarray(offset, end);
        var isFinal = end >= bytes.length;
        try { inflator.push(chunk, isFinal); } catch (e) { reject(e); return; }
        offset = end;
        if (!isFinal) setTimeout(pushNext, 0);
      }
      pushNext();
    } catch (e) { reject(e); }
  });
}

function processXmlText(xmlText, label) {
  if (!xmlText || xmlText.length < 500) {
    throw new Error('XML too small (' + (xmlText ? xmlText.length : 0) + ' chars)');
  }
  if (xmlText.indexOf('<tv') === -1 && xmlText.indexOf('<?xml') === -1) {
    throw new Error('Not XMLTV content');
  }

  var xmlDoc = new DOMParser().parseFromString(xmlText, 'text/xml');
  if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
    throw new Error('XML parse error');
  }

  var channelIdToName = {};
  var channelNodes = xmlDoc.getElementsByTagName('channel');
  for (var c = 0; c < channelNodes.length; c++) {
    var chNode = channelNodes[c];
    var id = chNode.getAttribute('id');
    if (!id) continue;
    var dnNode = chNode.getElementsByTagName('display-name')[0];
    var dn = dnNode ? dnNode.textContent : '';
    if (!dn) continue;
    channelIdToName[id] = dn.trim();
  }
  safeLog('[epg] ' + label + ' → ' + Object.keys(channelIdToName).length + ' channel elements');

  var sampleIds = Object.keys(channelIdToName).slice(0, 3);
  for (var s = 0; s < sampleIds.length; s++) {
    safeLog('[epg] sample channel: id="' + sampleIds[s] + '" name="' + channelIdToName[sampleIds[s]] + '"');
  }

  var byId   = {};
  var byName = {};
  var progNodes = xmlDoc.getElementsByTagName('programme');

  for (var p = 0; p < progNodes.length; p++) {
    var prog = progNodes[p];
    var chId = prog.getAttribute('channel');
    if (!chId) continue;

    var startStr = prog.getAttribute('start');
    var stopStr  = prog.getAttribute('stop');
    if (!startStr) continue;
    var start = parseEPGDate(startStr);
    if (!start) continue;
    var end = stopStr ? parseEPGDate(stopStr) : new Date(start.getTime() + 3600000);
    if (!end) continue;

    var titleNode = prog.getElementsByTagName('title')[0];
    var descNode  = prog.getElementsByTagName('desc')[0];

    var entry = {
      title: titleNode ? titleNode.textContent : 'No title',
      description: descNode ? descNode.textContent : '',
      start: start, end: end
    };

    if (!byId[chId]) byId[chId] = [];
    byId[chId].push(entry);

    var chName = channelIdToName[chId];
    if (chName) {
      var normKey = normalizeChannelName(chName);
      if (normKey) {
        if (!byName[normKey]) byName[normKey] = [];
        byName[normKey].push(entry);
      }
    }
  }

  for (var k1 in byId) { if (byId.hasOwnProperty(k1)) byId[k1].sort(function(a,b){ return a.start - b.start; }); }
  for (var k2 in byName) { if (byName.hasOwnProperty(k2)) byName[k2].sort(function(a,b){ return a.start - b.start; }); }

  safeLog('[epg] ' + label + ' → ' + progNodes.length + ' programmes, ' +
          Object.keys(byId).length + ' id keys, ' +
          Object.keys(byName).length + ' name keys');

  return { byId: byId, byName: byName };
}

function fetchAndParseSingleEPG(source) {
  if (typeof pako === 'undefined') { safeWarn('[epg] pako missing'); return Promise.resolve(null); }

  var url = source.url, name = source.name, timeout = source.timeout || 60000;
  safeLog('[epg] fetching ' + url + ' (timeout ' + (timeout/1000) + 's)');
  var t0 = Date.now();

  return xhrFetchBuffer(url, { timeout: timeout })
    .then(function(buf) {
      if (!buf) throw new Error('Empty response');
      var bytes = new Uint8Array(buf);
      safeLog('[epg] ' + name + ' downloaded ' + bytes.length + ' bytes in ' + (Date.now()-t0) + 'ms');
      if (bytes.length < 500) throw new Error('Too small');

      var isGzip = bytes[0] === 0x1f && bytes[1] === 0x8b;
      if (isGzip) {
        safeLog('[epg] ' + name + ' → gzipped, decompressing…');
        return chunkedUngzip(bytes).then(function(xmlText) {
          return processXmlText(xmlText, name);
        });
      }
      return processXmlText(bytesToUtf8String(bytes), name);
    })
    .catch(function(e) {
      safeWarn('[epg] ' + name + ' FAILED: ' + e.message + ' — trying proxy');
      return xhrFetchBuffer(CORS_PROXY + url, { timeout: 180000 })
        .then(function(buf) {
          var bytes = new Uint8Array(buf);
          safeLog('[epg] ' + name + ' (proxy) ' + bytes.length + ' bytes');
          if (bytes.length < 500) throw new Error('Too small via proxy');
          if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
            return chunkedUngzip(bytes).then(function(x){ return processXmlText(x, name + ' (proxy)'); });
          }
          return processXmlText(bytesToUtf8String(bytes), name + ' (proxy)');
        })
        .catch(function(e2) {
          safeWarn('[epg] ' + name + ' proxy also failed: ' + e2.message);
          return null;
        });
    });
}

function loadAllEPG() {
  var mergedById = {};
  var mergedByName = {};
  var idx = 0;

  function loadNext() {
    if (idx >= EPG_SOURCES.length) {
      epgById = mergedById;
      epgByName = mergedByName;
      epgLoaded = true;
      safeLog('[epg] ✓ ALL DONE — ' +
              Object.keys(mergedById).length + ' id keys, ' +
              Object.keys(mergedByName).length + ' name keys');
      setEpgStatus('Guide ready (' + Object.keys(mergedById).length + ' channels)');
      setTimeout(function(){ setEpgStatus(''); }, 4000);
      buildChannelEpgMap();
      refreshAllCardsEpg();
      return;
    }

    var source = EPG_SOURCES[idx]; idx++;
    setEpgStatus('Guide ' + idx + '/' + EPG_SOURCES.length + ': ' + source.name + '…');

    fetchAndParseSingleEPG(source).then(function(result) {
      if (result) {
        for (var id in result.byId) {
          if (!result.byId.hasOwnProperty(id)) continue;
          if (!mergedById[id]) mergedById[id] = [];
          mergedById[id] = mergedById[id].concat(result.byId[id]);
        }
        for (var nm in result.byName) {
          if (!result.byName.hasOwnProperty(nm)) continue;
          if (!mergedByName[nm]) mergedByName[nm] = [];
          mergedByName[nm] = mergedByName[nm].concat(result.byName[nm]);
        }
        if (!epgLoaded) {
          epgById = mergedById;
          epgByName = mergedByName;
          epgLoaded = true;
        }
        buildChannelEpgMap();
        refreshAllCardsEpg();
      }
      loadNext();
    });
  }

  loadNext();
}

/* ══════════════════════════════════════════════════════════════
   PRE-COMPUTE LOOKUP — same matching logic as original findEPGForChannel,
   but computed ONCE per channel instead of per render
   ══════════════════════════════════════════════════════════════ */
function buildChannelEpgMap() {
  channelEpgMap = {};
  if (!epgLoaded || !allChannels.length) return;

  for (var i = 0; i < allChannels.length; i++) {
    var ch = allChannels[i];
    var idKey = String(ch.id);
    var result = null;

    /* 1. Exact ID match */
    if (epgById && epgById[idKey] && epgById[idKey].length) {
      result = epgById[idKey];
    }
    /* 2. Exact name match */
    else if (epgByName) {
      var norm = normalizeChannelName(ch.name);
      if (norm && epgByName[norm]) {
        result = epgByName[norm];
      }
      /* 3. Partial name match (same as before — keeps all matches working) */
      else if (norm) {
        for (var k in epgByName) {
          if (!epgByName.hasOwnProperty(k)) continue;
          if (k.indexOf(norm) !== -1 || norm.indexOf(k) !== -1) { result = epgByName[k]; break; }
        }
      }
    }

    channelEpgMap[idKey] = result;
  }

  safeLog('[epg] lookup map built for ' + allChannels.length + ' channels');
}

/* O(1) lookup — same results as before, no computation */
function findEPGForChannel(channel) {
  if (!channel || !epgLoaded) return null;
  return channelEpgMap[String(channel.id)] || null;
}

function getCurrentProgram(programmes) {
  if (!programmes || !programmes.length) return null;
  var now = Date.now();
  for (var i = 0; i < programmes.length; i++) {
    if (programmes[i].start.getTime() <= now && programmes[i].end.getTime() > now) return programmes[i];
  }
  return null;
}

function parseChannelJson(text) {
  var c = String(text).trim();
  if (c.charCodeAt(0) === 0xFEFF) c = c.slice(1);
  try {
    var p = JSON.parse(c);
    if (Array.isArray(p)) return p;
    if (p && Array.isArray(p.channels)) return p.channels;
  } catch(e){}
  try {
    var p2 = JSON.parse('[' + c.replace(/,\s*$/, '') + ']');
    if (Array.isArray(p2)) return p2;
  } catch(e){}
  throw new Error('Invalid JSON');
}

function fetchChannelsFrom(idx) {
  if (idx >= CHANNELS_CANDIDATES.length) return Promise.reject(new Error('All failed'));
  var url = CHANNELS_CANDIDATES[idx];
  return xhrFetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' }, timeout: 20000 })
    .then(function(r){ return r.text(); })
    .then(function(t){
      var p = parseChannelJson(t);
      if (p && p.length) return p;
      throw new Error('Empty');
    })
    .catch(function(){ return fetchChannelsFrom(idx + 1); });
}

function loadChannels() {
  gridEl.innerHTML = '<div class="msg"><div class="spinner"></div><div>Loading channels…</div></div>';
  var last = CHANNELS_CANDIDATES[CHANNELS_CANDIDATES.length - 1];

  fetchChannelsFrom(0)
    .catch(function() {
      return xhrFetch(CORS_PROXY + last, { timeout: 25000 })
        .then(function(r){ return r.text(); })
        .then(function(t){ return parseChannelJson(t); });
    })
    .then(function(chs) {
      if (!chs || !chs.length) throw new Error('No channels');
      allChannels = chs;
      filteredChannels = allChannels.slice();

      for (var d = 0; d < Math.min(3, allChannels.length); d++) {
        safeLog('[channels] sample: id="' + allChannels[d].id + '" name="' + allChannels[d].name + '"');
      }

      renderCategories();
      renderGrid();
      loadAllEPG();
    })
    .catch(function(e) {
      gridEl.innerHTML =
        '<div class="msg err">⚠️ Could not load channels.<br>' +
        '<div style="color:#888;font-size:12px;margin-top:10px">' +
        escapeHtml(e.message || '') + '</div>' +
        '<button id="retry">Retry</button></div>';
      var rb = document.getElementById('retry');
      if (rb) rb.onclick = loadChannels;
    });
}

function renderCategories() {
  var set = {};
  for (var i = 0; i < allChannels.length; i++) {
    var cat = allChannels[i].category || allChannels[i].group || 'Other';
    set[cat] = true;
  }
  var cats = ['all'];
  for (var k in set) if (set.hasOwnProperty(k)) cats.push(k);
  cats.sort(function(a,b){
    if (a === 'all') return -1;
    if (b === 'all') return 1;
    return a.toLowerCase().localeCompare(b.toLowerCase());
  });

  var html = '';
  for (var j = 0; j < cats.length; j++) {
    var label = cats[j] === 'all' ? 'All' : cats[j];
    var activeCls = cats[j] === selectedCategory ? ' active' : '';
    html += '<button class="cat-chip' + activeCls + '" data-cat="' +
            escapeHtml(cats[j]) + '" type="button">' + escapeHtml(label) + '</button>';
  }
  categoriesEl.innerHTML = html;

  var chips = categoriesEl.querySelectorAll('.cat-chip');
  for (var c = 0; c < chips.length; c++) {
    (function(chip) {
      chip.addEventListener('click', function() {
        selectedCategory = chip.getAttribute('data-cat');
        renderCategories();
        applyFilters();
        wrapEl.scrollTop = 0;
      });
    })(chips[c]);
  }
}

function applyFilters() {
  filteredChannels = allChannels.filter(function(ch) {
    var chCat = ch.category || ch.group || 'Other';
    if (selectedCategory !== 'all' && chCat !== selectedCategory) return false;
    if (searchQuery) {
      var name = (ch.name || '').toLowerCase();
      var cat  = chCat.toLowerCase();
      if (name.indexOf(searchQuery) === -1 && cat.indexOf(searchQuery) === -1) return false;
    }
    return true;
  });
  renderGrid();
}

function renderGrid() {
  if (!filteredChannels.length) {
    gridEl.innerHTML = '<div class="msg">No channels found.</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < filteredChannels.length; i++) html += buildCardHtml(filteredChannels[i], i);
  gridEl.innerHTML = html;

  var cards = gridEl.querySelectorAll('.card');
  for (var j = 0; j < cards.length; j++) {
    (function(card, idx) {
      var ch = filteredChannels[idx];
      if (!ch) return;
      card.addEventListener('click', function(e) {
        if (e.target.closest && e.target.closest('.card-btn')) return;
        openPlayer(ch);
      });
      card.addEventListener('keydown', function(ev) {
        if (ev.keyCode === 13) {
          var tgt = ev.target;
          if (tgt && tgt.classList && tgt.classList.contains('card-btn')) return;
          ev.preventDefault();
          openPlayer(ch);
        }
      });
      var playBtn = card.querySelector('.card-btn');
      if (playBtn) playBtn.addEventListener('click', function(e){ e.stopPropagation(); openPlayer(ch); });
    })(cards[j], j);
  }
}

function buildCardHtml(ch, idx) {
  var epgHtml = buildEpgBlockHtml(ch);
  var cat = ch.category || ch.group || 'Other';
  return '<div class="card" tabindex="0" data-idx="' + idx + '">' +
    '<div class="card-top">' +
      '<img class="card-logo" src="' + escapeHtml(ch.logo || '') + '" alt="" ' +
        'onerror="this.style.visibility=\'hidden\'">' +
      '<div class="card-meta">' +
        '<div class="card-name">' + escapeHtml(ch.name || 'Unknown') + '</div>' +
        '<div class="card-cat">' + escapeHtml(cat) + '</div>' +
      '</div>' +
    '</div>' +
    epgHtml +
    '<div class="card-actions"><button class="card-btn" type="button">▶ Watch</button></div>' +
  '</div>';
}

function buildEpgBlockHtml(ch) {
  if (!epgLoaded) return '<div class="card-epg"><div class="epg-empty">Loading guide…</div></div>';
  var progs = findEPGForChannel(ch);
  var current = getCurrentProgram(progs);
  if (!current) return '<div class="card-epg"><div class="epg-empty">No guide data</div></div>';
  return '<div class="card-epg">' +
    '<div class="epg-now-row"><span class="epg-now-label">NOW</span>' +
      '<span class="epg-now-time">' +
        formatTimeOnly(current.start) + ' - ' + formatTimeOnly(current.end) +
      '</span></div>' +
    '<div class="epg-now-title">' + escapeHtml(current.title || 'No Title') + '</div>' +
    (current.description ? '<div class="epg-now-desc">' +
      escapeHtml(truncate(current.description, 120)) + '</div>' : '') +
  '</div>';
}

/* CHUNKED refresh — 15 cards per frame, same results, TV stays responsive */
function refreshAllCardsEpg() {
  var cards = gridEl.querySelectorAll('.card');
  var total = cards.length;
  if (!total) return;

  var batch = 15;
  var i = 0;

  function processNext() {
    var end = Math.min(i + batch, total);
    for (; i < end; i++) {
      var card = cards[i];
      var idx = parseInt(card.getAttribute('data-idx'), 10);
      if (isNaN(idx) || !filteredChannels[idx]) continue;
      var ch = filteredChannels[idx];
      var epgBox = card.querySelector('.card-epg');
      if (!epgBox) continue;
      var progs = findEPGForChannel(ch);
      var current = getCurrentProgram(progs);
      if (current) {
        epgBox.innerHTML =
          '<div class="epg-now-row"><span class="epg-now-label">NOW</span>' +
            '<span class="epg-now-time">' +
              formatTimeOnly(current.start) + ' - ' + formatTimeOnly(current.end) +
            '</span></div>' +
          '<div class="epg-now-title">' + escapeHtml(current.title || 'No Title') + '</div>' +
          (current.description ? '<div class="epg-now-desc">' +
            escapeHtml(truncate(current.description, 120)) + '</div>' : '');
      } else {
        epgBox.innerHTML = '<div class="epg-empty">No guide data</div>';
      }
    }
    if (i < total) setTimeout(processNext, 0);
  }

  processNext();
}

/* ══════════════════════════════════════════════════════════════
   OPEN PLAYER — localStorage (works in new tab) + window.open
   ══════════════════════════════════════════════════════════════ */
function openPlayer(ch) {
  try {
    /* localStorage so the new tab can read the data */
    localStorage.setItem('currentChannel', JSON.stringify(ch));
    localStorage.setItem('allChannels', JSON.stringify(allChannels));

    var progs = findEPGForChannel(ch);
    if (progs && progs.length) {
      var serializable = [];
      for (var i = 0; i < progs.length; i++) {
        serializable.push({
          title: progs[i].title,
          description: progs[i].description,
          start: progs[i].start.toISOString(),
          end:   progs[i].end.toISOString()
        });
      }
      localStorage.setItem('channelPrograms', JSON.stringify(serializable));
    } else {
      localStorage.removeItem('channelPrograms');
    }
  } catch (e) {}

  var playerUrl = 'jplayer.html?id=' + encodeURIComponent(ch.id);

  /* Open in new tab; fall back to same tab if popup blocked */
  try {
    var win = window.open(playerUrl, '_blank');
    if (!win) window.location.href = playerUrl;
  } catch (e) {
    window.location.href = playerUrl;
  }
}

var searchTimer = null;
searchEl.addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    searchQuery = searchEl.value.trim().toLowerCase();
    applyFilters();
    wrapEl.scrollTop = 0;
  }, 120);
});

document.addEventListener('keydown', function(e) {
  var k = e.keyCode;
  var focused = document.activeElement;

  if (focused && focused.classList && focused.classList.contains('cat-chip')) {
    var chips = categoriesEl.querySelectorAll('.cat-chip');
    var cidx = Array.prototype.indexOf.call(chips, focused);
    if (k === 37 && cidx > 0) { chips[cidx - 1].focus(); e.preventDefault(); }
    else if (k === 39 && cidx < chips.length - 1) { chips[cidx + 1].focus(); e.preventDefault(); }
    else if (k === 40) { var f = gridEl.querySelector('.card'); if (f) { f.focus(); e.preventDefault(); } }
    return;
  }
  if (focused === searchEl) {
    if (k === 40) { var f2 = gridEl.querySelector('.card'); if (f2) { f2.focus(); e.preventDefault(); } }
    return;
  }
  if (focused && focused.classList && focused.classList.contains('card')) {
    var cards = gridEl.querySelectorAll('.card');
    var cardIdx = Array.prototype.indexOf.call(cards, focused);
    var colCount = 1;
    if (cards.length > 0) {
      var firstRect = cards[0].getBoundingClientRect();
      var rowPerCard = 1;
      for (var ci = 1; ci < cards.length; ci++) {
        if (Math.abs(cards[ci].getBoundingClientRect().top - firstRect.top) < 4) rowPerCard++;
        else break;
      }
      colCount = rowPerCard;
    }
    if (k === 37) { if (cardIdx > 0) { cards[cardIdx - 1].focus(); e.preventDefault(); } }
    else if (k === 39) { if (cardIdx < cards.length - 1) { cards[cardIdx + 1].focus(); e.preventDefault(); } }
    else if (k === 38) {
      if (cardIdx - colCount >= 0) { cards[cardIdx - colCount].focus(); e.preventDefault(); }
      else {
        var activeChip = categoriesEl.querySelector('.cat-chip.active') || categoriesEl.querySelector('.cat-chip');
        if (activeChip) { activeChip.focus(); e.preventDefault(); }
      }
    }
    else if (k === 40) { if (cardIdx + colCount < cards.length) { cards[cardIdx + colCount].focus(); e.preventDefault(); } }
    else if (k === 13) { e.preventDefault(); var ch = filteredChannels[cardIdx]; if (ch) openPlayer(ch); }
    return;
  }
  if (k === 40 || k === 39) {
    var anyChip = categoriesEl.querySelector('.cat-chip');
    if (anyChip) { anyChip.focus(); e.preventDefault(); }
  }
});

function boot() { loadChannels(); }

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(boot, 0);
} else {
  document.addEventListener('DOMContentLoaded', boot);
}
</script>
