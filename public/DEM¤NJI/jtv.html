function xhrFetch(url, opts) {
  opts = opts || {};
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(opts.method || 'GET', url, true);
    xhr.timeout = opts.timeout || 20000;

function truncate(s, n) { if (!s) return ''; return s.length > n ? s.substring(0, n - 1) + '…' : s; }
function formatTimeOnly(ms) {
  var d = new Date(ms);

  h = h % 12; if (h === 0) h = 12;

function parseEPGDate(dateStr) {
  if (!dateStr) return null;
  var parts = String(dateStr).trim().split(' ');
  var datetime = parts[0];
  var tz = parts[1] || '+0000';
  var year   = parseInt(datetime.slice(0, 4), 10);
  var month  = parseInt(datetime.slice(4, 6), 10) - 1;
  var day    = parseInt(datetime.slice(6, 8), 10);
  var hour   = parseInt(datetime.slice(8, 10), 10);
  var minute = parseInt(datetime.slice(10, 12), 10);
  var second = parseInt(datetime.slice(12, 14), 10);
  if (isNaN(year)) return null;
  var ms = Date.UTC(year, month, day, hour, minute, second);
  var tzSign  = tz.charAt(0);
  var tzHours = parseInt(tz.slice(1, 3), 10) || 0;
  var tzMins  = parseInt(tz.slice(3, 5), 10) || 0;
  var offset  = (tzHours * 3600 + tzMins * 60) * 1000;
  if (tzSign === '-') offset = -offset;
  return ms - offset;
}

function normalizeChannelName(name) {
  if (!name) return '';
  var s = String(name).toLowerCase();
  s = s.replace(/&/g, ' and ');
  s = s.replace(/[^\w\s]/g, ' ');
  s = s.replace(/\b(hd|sd|fhd|uhd|4k|8k|1080p|720p|1080i|720i|576p|480p|tv|channel)\b/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

/* Loose — strips more words, used ONLY as fallback for empty channels */
function normalizeChannelNameLoose(name) {
  if (!name) return '';
  var s = String(name).toLowerCase();
  s = s.replace(/&/g, ' and ');
  s = s.replace(/[^\w\s]/g, ' ');
  s = s.replace(/\b(hd|sd|fhd|uhd|4k|8k|1080p|720p|1080i|720i|576p|480p|tv|channel|plus|movies|music|news|sports|gold|comedy|kids|family|classic|action|drama)\b/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

function bytesToUtf8String(bytes) {

  while (i < bytes.length) {
    var b = bytes[i++];
    if (b < 0x80) result += String.fromCharCode(b);
    else if (b < 0xE0) result += String.fromCharCode(((b & 0x1F) << 6) | (bytes[i++] & 0x3F));
    else if (b < 0xF0) result += String.fromCharCode(((b & 0x0F) << 12) | ((bytes[i++] & 0x3F) << 6) | (bytes[i++] & 0x3F));
    else {
      var cp = ((b & 0x07) << 18) | ((bytes[i++] & 0x3F) << 12) | ((bytes[i++] & 0x3F) << 6) | (bytes[i++] & 0x3F);
      cp -= 0x10000;
      result += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 0x3FF));
    }
  }
  return result;
}

function chunkedUngzip(bytes) {
  return new Promise(function(resolve, reject) {
    if (typeof pako === 'undefined') { reject(new Error('pako not loaded')); return; }
    try {
      var t0 = Date.now();
      var inflator = new pako.Inflate({ to: 'string', chunkSize: 1024 * 1024 });
      inflator.push(bytes, true);
      if (inflator.err) { reject(new Error('inflate failed: ' + inflator.msg)); return; }
      safeLog('[pako] decompressed ' + bytes.length + ' bytes in ' + (Date.now() - t0) + 'ms');
      resolve(inflator.result);
    } catch (e) { reject(e); }
  });
}

function decodeXmlEntities(s) {
  if (!s || s.indexOf('&') === -1) return s;
  return s.replace(/&(#x?[0-9a-fA-F]+|amp|lt|gt|quot|apos);/g, function(m, e) {
    if (e === 'amp') return '&';
    if (e === 'lt') return '<';
    if (e === 'gt') return '>';
    if (e === 'quot') return '"';
    if (e === 'apos') return "'";
    if (e.charAt(0) === '#') {
      var code = (e.charAt(1) === 'x' || e.charAt(1) === 'X')
        ? parseInt(e.substr(2), 16)
        : parseInt(e.substr(1), 10);
      if (!isNaN(code)) return String.fromCharCode(code);
    }
    return m;
  });
}

/* ══════════════════════════════════════════════════════════════
   Regex XMLTV parser — also builds byLoose index (unique only)
   ══════════════════════════════════════════════════════════════ */
function processXmlText(xmlText, label) {
  if (!xmlText || xmlText.length < 500) throw new Error('XML too small');
  if (xmlText.indexOf('<tv') === -1 && xmlText.indexOf('<?xml') === -1) throw new Error('Not XMLTV');

  var t0 = Date.now();

  /* Channel id → display name */
  var channelIdToName = {};
  var chRe = /<channel\s+([^>]*?)>([\s\S]*?)<\/channel>/g;
  var cm;
  while ((cm = chRe.exec(xmlText)) !== null) {
    var chIdM = cm[1].match(/\bid="([^"]*)"/);
    if (!chIdM) continue;
    var chId = chIdM[1];
    var dnM = cm[2].match(/<display-name[^>]*>([\s\S]*?)<\/display-name>/);
    if (dnM) channelIdToName[chId] = decodeXmlEntities(dnM[1]).trim();
  }

  var byId = {}, byName = {};
  var progCount = 0;
  var progRe = /<programme\s+([^>]*?)>([\s\S]*?)<\/programme>/g;
  var pm;
  while ((pm = progRe.exec(xmlText)) !== null) {
    var pAttrs = pm[1], pInner = pm[2];
    var chIdM2 = pAttrs.match(/\bchannel="([^"]*)"/);
    var startM = pAttrs.match(/\bstart="([^"]*)"/);
    if (!chIdM2 || !startM) continue;
    var chIdVal = chIdM2[1];
    var startMs = parseEPGDate(startM[1]);
    if (!startMs) continue;
    var stopM = pAttrs.match(/\bstop="([^"]*)"/);
    var endMs = stopM ? parseEPGDate(stopM[1]) : (startMs + 3600000);
    if (!endMs) continue;

    var titleM = pInner.match(/<title[^>]*>([\s\S]*?)<\/title>/);
    var descM  = pInner.match(/<desc[^>]*>([\s\S]*?)<\/desc>/);
    var iconM  = pInner.match(/<icon\s+[^>]*\bsrc="([^"]*)"/);

    var desc = descM ? decodeXmlEntities(descM[1]).trim() : '';
    if (desc.length > 300) desc = desc.substring(0, 300);

    var entry = {
      t: titleM ? decodeXmlEntities(titleM[1]).trim() : 'No title',
      d: desc, s: startMs, e: endMs,
      ic: iconM ? iconM[1] : ''
    };

    if (!byId[chIdVal]) byId[chIdVal] = [];
    byId[chIdVal].push(entry);
    progCount++;

    var chName = channelIdToName[chIdVal];
    if (chName) {
      var normKey = normalizeChannelName(chName);
      if (normKey) {
        if (!byName[normKey]) byName[normKey] = [];
        byName[normKey].push(entry);
      }
    }
  }

  for (var k1 in byId) if (byId.hasOwnProperty(k1)) byId[k1].sort(function(a,b){ return a.s - b.s; });
  for (var k2 in byName) if (byName.hasOwnProperty(k2)) byName[k2].sort(function(a,b){ return a.s - b.s; });

  /* Build byLoose — only unique loose keys */
  var looseToIds = {};
  for (var cid in channelIdToName) {
    if (!byId[cid]) continue;
    var loose = normalizeChannelNameLoose(channelIdToName[cid]);
    if (!loose) continue;
    if (!looseToIds[loose]) looseToIds[loose] = [];
    looseToIds[loose].push(cid);
  }
  var byLoose = {};
  for (var lk in looseToIds) {
    if (looseToIds[lk].length === 1) {
      byLoose[lk] = byId[looseToIds[lk][0]].slice();
    }
  }

  safeLog('[epg] ' + label + ' → ' + progCount + ' progs, ' +
          Object.keys(byId).length + ' ids, ' +
          Object.keys(byName).length + ' strict names, ' +
          Object.keys(byLoose).length + ' unique loose names in ' + (Date.now() - t0) + 'ms');

  return { byId: byId, byName: byName, byLoose: byLoose };
}

function fetchAndParseSingleEPG(source) {
  if (typeof pako === 'undefined') { safeWarn('[epg] pako missing'); return Promise.resolve(null); }
  var url = source.url, name = source.name, timeout = source.timeout || 60000;
  safeLog('[epg] fetching ' + url);
  var t0 = Date.now();

  return xhrFetchBuffer(url, { timeout: timeout })
    .then(function(buf) {
      if (!buf) throw new Error('Empty response');
      var bytes = new Uint8Array(buf);
      safeLog('[epg] ' + name + ' downloaded ' + bytes.length + ' bytes in ' + (Date.now()-t0) + 'ms');
      if (bytes.length < 500) throw new Error('Too small');
      if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
        return chunkedUngzip(bytes).then(function(xmlText) { return processXmlText(xmlText, name); });
      }
      return processXmlText(bytesToUtf8String(bytes), name);
    })
    .catch(function(e) {
      safeWarn('[epg] ' + name + ' failed: ' + e.message + ' — trying proxy');
      return xhrFetchBuffer(CORS_PROXY + url, { timeout: 180000 })
        .then(function(buf) {
          var bytes = new Uint8Array(buf);
          if (bytes.length < 500) throw new Error('Too small via proxy');
          if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
            return chunkedUngzip(bytes).then(function(x){ return processXmlText(x, name + ' (proxy)'); });
          }
          return processXmlText(bytesToUtf8String(bytes), name + ' (proxy)');
        })
        .catch(function(e2) { safeWarn('[epg] ' + name + ' proxy failed: ' + e2.message); return null; });
    });
}

/* ══════════════════════════════════════════════════════════════ Cache */
function loadCache() {
  try {
    var raw = localStorage.getItem(EPG_CACHE_KEY);
    if (!raw) return false;
    var c = JSON.parse(raw);
    if (!c || !c.data) return false;
    var fresh = (Date.now() - c.fetchedAt) < EPG_CACHE_TTL_MS;
    var n = 0;
    for (var id in c.data) {
      if (!c.data.hasOwnProperty(id)) continue;
      epgByChannelId[id] = c.data[id];
      n++;
    }
    epgLoaded = n > 0;
    safeLog('[cache] restored ' + n + ' channels (fresh=' + fresh + ')');
    return fresh && epgLoaded;
  } catch (e) { return false; }
}
function saveCache() {
  try {
    localStorage.setItem(EPG_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), data: epgByChannelId }));
    safeLog('[cache] saved');
  } catch (e) { safeWarn('[cache] save failed: ' + e.message); }
}

/* ══════════════════════════════════════════════════════════════
   Merge helpers
   ══════════════════════════════════════════════════════════════ */
function mergeIntoChannel(channelId, progs) {
  if (!progs || !progs.length) return 0;
  if (!epgByChannelId[channelId]) epgByChannelId[channelId] = [];
  var existing = epgByChannelId[channelId];
  var seen = {};
  for (var i = 0; i < existing.length; i++) seen[existing[i].s] = true;
  var added = 0;
  for (var j = 0; j < progs.length; j++) {
    if (!seen[progs[j].s]) { existing.push(progs[j]); added++; }
  }
  if (added) existing.sort(function(a,b){ return a.s - b.s; });
  return added;
}

/* ══════════════════════════════════════════════════════════════
   MERGE — always merge (never skip). Three passes:
     1. by-ID     — merge additional timestamps
     2. by-Strict name — exact + partial, always merge
     3. by-Loose  — only empty channels, only if unambiguous
                    in both JioTV and EPG
   ══════════════════════════════════════════════════════════════ */
function mergeSource(result, sourceLabel) {
  if (!result) return { byId: 0, strict: 0, loose: 0 };
  var stats = { byId: 0, strict: 0, loose: 0 };

  /* ── 1. By ID — always merge ── */
  var byId = result.byId;
  for (var id in byId) {
    if (!byId.hasOwnProperty(id)) continue;
    if (mergeIntoChannel(String(id), byId[id]) > 0) stats.byId++;
  }

  /* ── 2. By strict name — always merge ── */
  var byName = result.byName;
  var nameKeys = Object.keys(byName);
  for (var i = 0; i < allChannels.length; i++) {
    var ch = allChannels[i];
    var id2 = String(ch.id);
    var strictNorm = normalizeChannelName(ch.name);
    if (!strictNorm) continue;

    var progs = byName[strictNorm];
    if (!progs) {
      for (var nk = 0; nk < nameKeys.length; nk++) {
        var key = nameKeys[nk];
        if (key.indexOf(strictNorm) !== -1 || strictNorm.indexOf(key) !== -1) {
          progs = byName[key]; break;
        }
      }
    }
    if (progs && progs.length) {
      if (mergeIntoChannel(id2, progs) > 0) stats.strict++;
    }
  }

  /* ── 3. By loose name — only for empty channels, only if unambiguous ── */
  var byLoose = result.byLoose;
  if (byLoose) {
    for (var j = 0; j < allChannels.length; j++) {
      var ch2 = allChannels[j];
      var id3 = String(ch2.id);
      if (epgByChannelId[id3] && epgByChannelId[id3].length) continue;   /* has data already */
      var looseNorm = normalizeChannelNameLoose(ch2.name);
      if (!looseNorm) continue;
      if (looseNorm2Ambiguous[looseNorm]) continue;    /* shared by >1 JioTV channel → skip */
      var looseProgs = byLoose[looseNorm];
      if (looseProgs && looseProgs.length) {
        if (mergeIntoChannel(id3, looseProgs) > 0) stats.loose++;
      }
    }
  }

  safeLog('[merge:' + sourceLabel + '] byId=' + stats.byId +
          ' strict=' + stats.strict + ' loose=' + stats.loose +
          ' → totalChannels=' + Object.keys(epgByChannelId).length);
  return stats;
}

/* ══════════════════════════════════════════════════════════════ Load all EPG */
function loadAllEPG() {
  var idx = 0;
  var t0 = Date.now();
  var totalSources = EPG_SOURCES.length;
  var failed = [];

  function next() {
    if (idx >= totalSources) {
      epgLoaded = Object.keys(epgByChannelId).length > 0;
      saveCache();
      var elapsed = ((Date.now() - t0) / 1000).toFixed(1);
      var chCount = Object.keys(epgByChannelId).length;
      if (epgLoaded) {
        if (failed.length) setEpgStatus('Guide ready — ' + chCount + ' ch (' + failed.join(', ') + ' unavailable)', 'warn');
        else setEpgStatus('Guide ready — ' + chCount + ' ch (' + elapsed + 's)');
      } else {
        setEpgStatus('Guide unavailable — channels only', 'error');
      }
      setTimeout(function(){ setEpgStatus(''); }, 5000);
      refreshAllCardsEpg();
      safeLog('[epg] ALL DONE — ' + chCount + ' channels in ' + elapsed + 's');
      return;
    }
    var src = EPG_SOURCES[idx]; idx++;
    setEpgStatus('Guide ' + idx + '/' + totalSources + ': ' + src.name + '…');

    fetchAndParseSingleEPG(src).then(function(result) {
      if (result && Object.keys(result.byId).length) {
        mergeSource(result, src.name);
        epgLoaded = Object.keys(epgByChannelId).length > 0;
        refreshAllCardsEpg();
        saveCache();
      } else {
        failed.push(src.name);
        safeWarn('[epg] ' + src.name + ' returned no data');
      }
      setTimeout(next, 200);
    });
  }
  next();
}

/* ══════════════════════════════════════════════════════════════ EPG lookups */
function getCurrentProgram(progs) {
  if (!progs || !progs.length) return null;
  var now = Date.now();
  for (var i = 0; i < progs.length; i++) if (progs[i].s <= now && progs[i].e > now) return progs[i];
  return null;
}
function getNextProgram(progs, afterMs) {
  if (!progs || !progs.length) return null;
  var ref = afterMs || Date.now();
  for (var i = 0; i < progs.length; i++) if (progs[i].s > ref) return progs[i];
  return null;
}
function getChannelNumber(ch) {
  if (!ch) return null;
  var id = ch.id;
  if (typeof id === 'number') return id;
  if (typeof id === 'string') {
    var n = parseInt(id, 10);
    if (!isNaN(n) && String(n) === id) return n;
  }
  return null;
}

function buildEpgBlockHtml(ch) {
  if (!epgLoaded) return '<div class="card-epg"><div class="epg-empty">Loading guide…</div></div>';
  var progs = epgByChannelId[String(ch.id)];
  var current = getCurrentProgram(progs);
  var next = getNextProgram(progs, current ? current.s : Date.now());
  if (!current && !next) return '<div class="card-epg"><div class="epg-empty">No guide data</div></div>';
  var html = '<div class="card-epg">';
  if (current) {
    html += '<div class="epg-now-row"><span class="epg-now-label">NOW</span>' +
            '<span class="epg-now-time">' + formatRange(current.s, current.e) + '</span></div>' +
            '<div class="epg-now-title">' + escapeHtml(current.t || 'No Title') + '</div>' +
            (current.d ? '<div class="epg-now-desc">' + escapeHtml(truncate(current.d, 120)) + '</div>' : '');
    if (next) html += '<div class="epg-next-mini">Next: <b>' + escapeHtml(truncate(next.t, 40)) + '</b> at ' + formatTimeOnly(next.s) + '</div>';
  } else {
    html += '<div class="epg-now-row"><span class="epg-now-label next">NEXT</span>' +
            '<span class="epg-now-time">' + formatTimeOnly(next.s) + '</span></div>' +
            '<div class="epg-now-title">' + escapeHtml(next.t || 'No Title') + '</div>' +
            (next.d ? '<div class="epg-now-desc">' + escapeHtml(truncate(next.d, 120)) + '</div>' : '');
  }
  return html + '</div>';
}

function updateCardEpg(id) {
  var entry = cardMap[id];
  if (!entry) return;
  if (entry.el.classList.contains('hidden')) return;
  var html = buildEpgBlockHtml(entry.ch);
  if (html !== entry.lastEpg) { entry.epg.innerHTML = html; entry.lastEpg = html; }
}
function refreshAllCardsEpg() {
  var ids = Object.keys(cardMap);
  if (!ids.length) return;
  var i = 0, BATCH = 20;
  function step() {
    var end = Math.min(i + BATCH, ids.length);
    for (; i < end; i++) updateCardEpg(ids[i]);
    if (i < ids.length) rAF(step);
  }
  rAF(step);
}

/* ══════════════════════════════════════════════════════════════ Channel JSON */
function parseChannelJson(text) {
  var c = String(text).trim();
  if (c.charCodeAt(0) === 0xFEFF) c = c.slice(1);
  try { var p = JSON.parse(c); if (Array.isArray(p)) return p; if (p && Array.isArray(p.channels)) return p.channels; } catch(e){}
  try { var p2 = JSON.parse('[' + c.replace(/,\s*$/, '') + ']'); if (Array.isArray(p2)) return p2; } catch(e){}
  throw new Error('Invalid JSON');
}
function fetchChannelsFrom(idx) {
  if (idx >= CHANNELS_CANDIDATES.length) return Promise.reject(new Error('All failed'));
  return xhrFetch(CHANNELS_CANDIDATES[idx], { headers: { 'X-Requested-With': 'XMLHttpRequest' }, timeout: 20000 })
    .then(function(r){ return r.text(); })
    .then(function(t){ var p = parseChannelJson(t); if (p && p.length) return p; throw new Error('Empty'); })
    .catch(function(){ return fetchChannelsFrom(idx + 1); });
}

/* ══════════════════════════════════════════════════════════════ Render cards */
function buildCardHtml(ch, idx) {
  var cat = ch.category || ch.group || 'Other';
  var num = getChannelNumber(ch);
  var numHtml = num !== null ? '<span class="card-num">' + num + '</span>' : '';
  return '<div class="card" tabindex="0" data-idx="' + idx + '" data-chid="' + escapeHtml(String(ch.id)) + '">' +
    '<div class="card-top">' +
      '<img class="card-logo" src="' + escapeHtml(ch.logo || '') + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="card-meta">' +
        '<div class="card-name">' + numHtml + escapeHtml(ch.name || 'Unknown') + '</div>' +
        '<div class="card-cat">' + escapeHtml(cat) + '</div>' +
      '</div>' +
    '</div>' +
    buildEpgBlockHtml(ch) +
    '<div class="card-actions"><button class="card-btn" type="button">▶ Watch</button></div>' +
  '</div>';
}

function renderAllCards(onDone) {
  var batch = 25, i = 0;
  gridEl.innerHTML = '';
  function step() {
    var end = Math.min(i + batch, allChannels.length);
    var html = '';
    for (; i < end; i++) html += buildCardHtml(allChannels[i], i);
    gridEl.insertAdjacentHTML('beforeend', html);
    if (i < allChannels.length) rAF(step);
    else { buildCardMap(); if (onDone) onDone(); }
  }
  if (!allChannels.length) { if (onDone) onDone(); return; }
  rAF(step);
}

function buildCardMap() {
  cardMap = {};
  var cards = gridEl.querySelectorAll('.card');
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var idx = parseInt(card.getAttribute('data-idx'), 10);
    var ch = allChannels[idx];
    if (!ch) continue;
    var epgBox = card.querySelector('.card-epg');
    cardMap[String(ch.id)] = { el: card, epg: epgBox, ch: ch, lastEpg: '' };
    (function(cardEl, channel) {
      cardEl.addEventListener('click', function(e) {
        if (e.target.closest && e.target.closest('.card-btn')) return;
        openDetails(channel);
      });
      cardEl.addEventListener('keydown', function(ev) {
        if (ev.keyCode === 13) {
          var tgt = ev.target;
          if (tgt && tgt.classList && tgt.classList.contains('card-btn')) return;
          ev.preventDefault();
          openDetails(channel);
        }
      });
      var playBtn = cardEl.querySelector('.card-btn');
      if (playBtn) playBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        openPlayer(channel);
      });
    })(card, ch);
  }
}

function applyFilter() {
  var q = searchQuery, cat = selectedCategory;
  for (var i = 0; i < allChannels.length; i++) {
    var ch = allChannels[i];
    var chCat = ch.category || ch.group || 'Other';
    var match = true;
    if (cat !== 'all' && chCat !== cat) match = false;
    if (match && q) {
      var name = (ch.name || '').toLowerCase();
      var catLow = chCat.toLowerCase();
      if (name.indexOf(q) === -1 && catLow.indexOf(q) === -1) match = false;
    }
    var entry = cardMap[String(ch.id)];
    if (entry) {
      if (match) entry.el.classList.remove('hidden');
      else entry.el.classList.add('hidden');
    }
  }
}

function renderCategories() {
  var set = {};
  for (var i = 0; i < allChannels.length; i++) { var cat = allChannels[i].category || allChannels[i].group || 'Other'; set[cat] = true; }
  var cats = ['all'];
  for (var k in set) if (set.hasOwnProperty(k)) cats.push(k);
  cats.sort(function(a,b){ if(a==='all')return -1; if(b==='all')return 1; return a.toLowerCase().localeCompare(b.toLowerCase()); });
  var html = '';
  for (var j = 0; j < cats.length; j++) {
    var label = cats[j] === 'all' ? 'All' : cats[j];
    var activeCls = cats[j] === selectedCategory ? ' active' : '';
    html += '<button class="cat-chip' + activeCls + '" data-cat="' + escapeHtml(cats[j]) + '" type="button">' + escapeHtml(label) + '</button>';
  }
  categoriesEl.innerHTML = html;
  var chips = categoriesEl.querySelectorAll('.cat-chip');
  for (var c = 0; c < chips.length; c++) {
    (function(chip) {
      chip.addEventListener('click', function() {
        selectedCategory = chip.getAttribute('data-cat');
        renderCategories();
        applyFilter();
        wrapEl.scrollTop = 0;
      });
    })(chips[c]);
  }
}

function openDetails(ch) {
  currentDetailChannel = ch;
  var num = getChannelNumber(ch);
  dNum.textContent = num !== null ? 'CH ' + num : '';
  dName.textContent = ch.name || 'Unknown';
  dCat.textContent = ch.category || ch.group || 'Other';
  dLogo.src = ch.logo || '';
  dLogo.style.visibility = ch.logo ? 'visible' : 'hidden';

  var progs = epgByChannelId[String(ch.id)] || [];
  var current = getCurrentProgram(progs);
  var next = getNextProgram(progs, current ? current.s : Date.now());
  var body = '';

  if (current) {
    body += '<div class="detail-show now">' +
      '<div class="show-label">● NOW · ' + formatRange(current.s, current.e) + '</div>' +
      '<div class="show-title">' + escapeHtml(current.t || 'No Title') + '</div>';
    if (current.ic) body += '<div class="show-image"><img src="' + escapeHtml(current.ic) + '" alt="" onerror="this.parentNode.style.display=\'none\'"></div>';
    if (current.d) body += '<div class="show-desc">' + escapeHtml(current.d) + '</div>';
    body += '</div>';
  } else if (epgLoaded) {
    body += '<div class="detail-show none"><div class="show-label">● NOW</div><div class="show-title">No current programme</div></div>';
  } else {
    body += '<div class="detail-show none"><div class="show-label">● NOW</div><div class="show-title">Loading guide…</div></div>';
  }

  if (next) {
    body += '<div class="detail-show next">' +
      '<div class="show-label">○ NEXT · ' + formatRange(next.s, next.e) + '</div>' +
      '<div class="show-title">' + escapeHtml(next.t || 'No Title') + '</div>';
    if (next.ic) body += '<div class="show-image"><img src="' + escapeHtml(next.ic) + '" alt="" onerror="this.parentNode.style.display=\'none\'"></div>';
    if (next.d) body += '<div class="show-desc">' + escapeHtml(next.d) + '</div>';
    body += '</div>';
  } else if (epgLoaded) {
    body += '<div class="detail-show none"><div class="show-label">○ NEXT</div><div class="show-title">No upcoming programme</div></div>';
  }

  dBody.innerHTML = body;
  detailModal.classList.remove('hidden');
  dWatch.focus();
}
function closeDetails() {
  detailModal.classList.add('hidden');
  currentDetailChannel = null;
}

function openPlayer(ch) {
  try {
    localStorage.setItem('currentChannel', JSON.stringify(ch));
    localStorage.setItem('allChannels', JSON.stringify(allChannels));
    var progs = epgByChannelId[String(ch.id)];
    if (progs && progs.length) {
      var serializable = [];
      for (var i = 0; i < progs.length; i++) {
        serializable.push({
          title: progs[i].t, description: progs[i].d,
          start: progs[i].s, end: progs[i].e, icon: progs[i].ic || ''
        });
      }
      localStorage.setItem('channelPrograms', JSON.stringify(serializable));
    } else localStorage.removeItem('channelPrograms');
  } catch (e) {}
  var url = 'jplayer.html?id=' + encodeURIComponent(ch.id);
  try { var w = window.open(url, '_blank'); if (!w) window.location.href = url; }
  catch (e) { window.location.href = url; }
}

function showChNumOverlay() {
  chNumValue.textContent = chNumBuffer || '—';
  chNumOverlay.classList.add('visible');
}
function hideChNumOverlay() {
  chNumOverlay.classList.remove('visible');
}
function handleChNumDigit(digit) {
  if (chNumBuffer.length >= 4) chNumBuffer = '';
  chNumBuffer += digit;
  showChNumOverlay();
  clearTimeout(chNumTimer);
  chNumTimer = setTimeout(commitChNum, 1200);
}
function commitChNum() {
  var num = chNumBuffer;
  chNumBuffer = '';
  clearTimeout(chNumTimer);
  hideChNumOverlay();
  if (!num) return;
  var n = parseInt(num, 10);
  var found = null;
  for (var i = 0; i < allChannels.length; i++) {
    if (getChannelNumber(allChannels[i]) === n) { found = allChannels[i]; break; }
  }
  if (!found) { showToast('Channel ' + num + ' not found', true); return; }
  showToast('Tuning to CH ' + n + ' · ' + (found.name || ''));
  openPlayer(found);
}
function cancelChNum() {
  chNumBuffer = '';
  clearTimeout(chNumTimer);
  hideChNumOverlay();
}

/* Precompute which JioTV channels share a loose key */
function computeLooseAmbiguity() {
  var counts = {};
  for (var i = 0; i < allChannels.length; i++) {
    var lk = normalizeChannelNameLoose(allChannels[i].name);
    if (!lk) continue;
    counts[lk] = (counts[lk] || 0) + 1;
  }
  looseNorm2Ambiguous = {};
  for (var k in counts) {
    if (counts[k] > 1) looseNorm2Ambiguous[k] = true;
  }
  safeLog('[loose] ambiguous keys: ' + Object.keys(looseNorm2Ambiguous).length);
}

function loadChannels() {
  gridEl.innerHTML = '<div class="msg"><div class="spinner"></div><div>Loading channels…</div></div>';
  var last = CHANNELS_CANDIDATES[CHANNELS_CANDIDATES.length - 1];
  fetchChannelsFrom(0)
    .catch(function() {
      return xhrFetch(CORS_PROXY + last, { timeout: 25000 })
        .then(function(r){ return r.text(); })
        .then(function(t){ return parseChannelJson(t); });
    })
    .then(function(chs) {
      if (!chs || !chs.length) throw new Error('No channels');
      allChannels = chs;
      renderCategories();
      computeLooseAmbiguity();
      var cacheFresh = loadCache();
      renderAllCards(function() {
        if (cacheFresh) {
          refreshAllCardsEpg();
          setEpgStatus('Guide loaded from cache');
          setTimeout(function(){ setEpgStatus(''); }, 2500);
        } else {
          loadAllEPG();
        }
      });
    })
    .catch(function(e) {
      gridEl.innerHTML = '<div class="msg err">⚠️ Could not load channels.<br>' +
        '<div style="color:#888;font-size:12px;margin-top:10px">' +
        escapeHtml(e.message || '') + '</div><button id="retry">Retry</button></div>';
      var rb = document.getElementById('retry'); if (rb) rb.onclick = loadChannels;
    });
}

var searchTimer = null;
searchEl.addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    searchQuery = searchEl.value.trim().toLowerCase();
    applyFilter();
    wrapEl.scrollTop = 0;
  }, 120);
});

document.addEventListener('keydown', function(e) {
  var k = e.keyCode;
  var focused = document.activeElement;
  var inModal = !detailModal.classList.contains('hidden');

  if (inModal) {
    if (k === 27 || k === 8 || k === 10009) { e.preventDefault(); closeDetails(); return; }
    if (k === 13) {
      if (focused === dWatch) { e.preventDefault(); if (currentDetailChannel) openPlayer(currentDetailChannel); return; }
      if (focused === dCancel || focused === dClose) { e.preventDefault(); closeDetails(); return; }
    }
    if (k === 37 && focused === dWatch) { e.preventDefault(); dCancel.focus(); return; }
    if (k === 39 && focused === dCancel) { e.preventDefault(); dWatch.focus(); return; }
    return;
  }

  var isNumKey = (k >= 48 && k <= 57) || (k >= 96 && k <= 105);
  if (isNumKey && focused !== searchEl) {
    e.preventDefault();
    var digit = String.fromCharCode(k >= 96 ? k - 48 : k);
    handleChNumDigit(digit);
    return;
  }
  if (k === 13 && chNumBuffer) { e.preventDefault(); clearTimeout(chNumTimer); commitChNum(); return; }
  if ((k === 27 || k === 8 || k === 10009) && chNumBuffer) { e.preventDefault(); cancelChNum(); return; }

  if (focused && focused.classList && focused.classList.contains('cat-chip')) {
    var chips = categoriesEl.querySelectorAll('.cat-chip:not(.hidden)');
    var cidx = Array.prototype.indexOf.call(chips, focused);
    if (k === 37 && cidx > 0) { chips[cidx - 1].focus(); e.preventDefault(); }
    else if (k === 39 && cidx < chips.length - 1) { chips[cidx + 1].focus(); e.preventDefault(); }
    else if (k === 40) { var vc = gridEl.querySelector('.card:not(.hidden)'); if (vc) { vc.focus(); e.preventDefault(); } }
    return;
  }
  if (focused === searchEl) {
    if (k === 40) { var vc2 = gridEl.querySelector('.card:not(.hidden)'); if (vc2) { vc2.focus(); e.preventDefault(); } }
    return;
  }
  if (focused && focused.classList && focused.classList.contains('card')) {
    var visible = gridEl.querySelectorAll('.card:not(.hidden)');
    var cardIdx = Array.prototype.indexOf.call(visible, focused);
    var colCount = 1;
    if (visible.length) {
      var firstTop = visible[0].getBoundingClientRect().top, n = 1;
      for (var ci = 1; ci < visible.length; ci++) {
        if (Math.abs(visible[ci].getBoundingClientRect().top - firstTop) < 4) n++;
        else break;
      }
      colCount = n;
    }
    if (k === 37) { if (cardIdx > 0) { visible[cardIdx - 1].focus(); e.preventDefault(); } }
    else if (k === 39) { if (cardIdx < visible.length - 1) { visible[cardIdx + 1].focus(); e.preventDefault(); } }
    else if (k === 38) {
      if (cardIdx - colCount >= 0) { visible[cardIdx - colCount].focus(); e.preventDefault(); }
      else {
        var activeChip = categoriesEl.querySelector('.cat-chip.active') || categoriesEl.querySelector('.cat-chip');
        if (activeChip) { activeChip.focus(); e.preventDefault(); }
      }
    }
    else if (k === 40) { if (cardIdx + colCount < visible.length) { visible[cardIdx + colCount].focus(); e.preventDefault(); } }
    else if (k === 13) {
      e.preventDefault();
      var idx = parseInt(focused.getAttribute('data-idx'), 10);
      var ch = allChannels[idx];
      if (ch) openDetails(ch);
    }
    return;
  }
  if (k === 40 || k === 39) {
    var anyChip = categoriesEl.querySelector('.cat-chip');
    if (anyChip) { anyChip.focus(); e.preventDefault(); }
  }
});

dClose.addEventListener('click', function(e){ e.preventDefault(); closeDetails(); });
dCancel.addEventListener('click', function(e){ e.preventDefault(); closeDetails(); });
dWatch.addEventListener('click', function(e){ e.preventDefault(); if (currentDetailChannel) openPlayer(currentDetailChannel); });
detailModal.addEventListener('click', function(e){ if (e.target === detailModal) closeDetails(); });

function boot() { loadChannels(); }
if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 0);
else document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
