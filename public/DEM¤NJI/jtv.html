<script>
if (typeof Promise === 'undefined') {

function xhrFetch(url, opts) {
  opts = opts || {};
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(opts.method || 'GET', url, true);
    xhr.timeout = opts.timeout || 20000;
    if (opts.headers) for (var k in opts.headers) if (opts.headers.hasOwnProperty(k)) { try { xhr.setRequestHeader(k, opts.headers[k]); } catch(e){} }
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) resolve({ ok:true, status:xhr.status, text: function(){ return Promise.resolve(xhr.responseText); }, json: function(){ return Promise.resolve(JSON.parse(xhr.responseText)); } });
      else reject(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = function(){ reject(new Error('Network error')); };
    xhr.ontimeout = function(){ reject(new Error('Timeout')); };
    try { xhr.send(opts.body || null); } catch(e){ reject(e); }
  });
}
function xhrFetchBuffer(url, opts) {
  opts = opts || {};
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(opts.method || 'GET', url, true);
    xhr.responseType = 'arraybuffer';
    xhr.timeout = opts.timeout || 120000;
    xhr.onload = function() { if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.response); else reject(new Error('HTTP ' + xhr.status)); };
    xhr.onerror = function(){ reject(new Error('Network error')); };
    xhr.ontimeout = function(){ reject(new Error('Timeout')); };
    try { xhr.send(null); } catch(e){ reject(e); }
  });
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function truncate(s, n) { if (!s) return ''; return s.length > n ? s.substring(0, n - 1) + '…' : s; }
function formatTimeOnly(ms) { var d = new Date(ms), h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap; }
function formatRange(s, e) { return formatTimeOnly(s) + ' - ' + formatTimeOnly(e); }
function setEpgStatus(text, isError) {

function decodeXmlEntities(s) {
  return s
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'").replace(/&#x27;/g, "'")
    .replace(/&#10;/g, '\n').replace(/&#13;/g, '\r')
    .replace(/&amp;/g, '&');
}

function parseEPGDate(dateStr) {
  if (!dateStr) return null;
  var parts = String(dateStr).trim().split(' ');
  var datetime = parts[0], tz = parts[1] || '+0000';
  var year = parseInt(datetime.slice(0,4),10), month = parseInt(datetime.slice(4,6),10)-1,
      day = parseInt(datetime.slice(6,8),10), hour = parseInt(datetime.slice(8,10),10)||0,
      minute = parseInt(datetime.slice(10,12),10)||0, second = parseInt(datetime.slice(12,14),10)||0;
  if (isNaN(year) || isNaN(month) || isNaN(day)) return null;
  var ms = Date.UTC(year, month, day, hour, minute, second);
  var sign = tz.charAt(0) === '-' ? -1 : 1;
  var tzh = parseInt(tz.slice(1,3),10)||0, tzm = parseInt(tz.slice(3,5),10)||0;
  return ms - sign * (tzh*3600 + tzm*60) * 1000;
}

function normalizeChannelName(name) {
  if (!name) return '';
  var cleaned = String(name).toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
  return cleaned.replace(/\b(hd|sd|fhd|4k|plus|movies|music|news|tv|channel)\b/g, '').trim();
}

function bytesToUtf8String(bytes) {
  if (typeof TextDecoder !== 'undefined') { try { return new TextDecoder('utf-8').decode(bytes); } catch (e) {} }
  var result = '', i = 0;
  while (i < bytes.length) {
    var b = bytes[i++];
    if (b < 0x80) result += String.fromCharCode(b);
    else if (b < 0xE0) result += String.fromCharCode(((b & 0x1F) << 6) | (bytes[i++] & 0x3F));
    else if (b < 0xF0) result += String.fromCharCode(((b & 0x0F) << 12) | ((bytes[i++] & 0x3F) << 6) | (bytes[i++] & 0x3F));
    else { var cp = ((b & 0x07) << 18) | ((bytes[i++] & 0x3F) << 12) | ((bytes[i++] & 0x3F) << 6) | (bytes[i++] & 0x3F); cp -= 0x10000; result += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 0x3FF)); }
  }
  return result;
}

/* ══════════════════════════════════════════════════════════════
   CHUNKED XML PARSER — regex based, yields every 25 ms via rAF.
   No DOMParser → no freezing on TV.
   ══════════════════════════════════════════════════════════════ */
function parseXmltvChunked(xmlText, onProgress, onDone) {
  var channelNames = {};
  var channelRe = /<channel\s+id="([^"]+)"[^>]*>([\s\S]*?)<\/channel>/g;
  var cm;
  while ((cm = channelRe.exec(xmlText)) !== null) {
    var dnM = cm[2].match(/<display-name[^>]*>([^<]*)<\/display-name>/);
    if (dnM) channelNames[cm[1]] = decodeXmlEntities(dnM[1].trim());
  }

  var byId = {};
  var programmeRe = /<programme\s+([^>]*)>([\s\S]*?)<\/programme>/g;
  var lastProgressTime = 0;

  function step() {
    var t0 = Date.now();
    var m;
    while ((m = programmeRe.exec(xmlText)) !== null) {
      try {
        var attrs = m[1], body = m[2];
        var startM = attrs.match(/start="([^"]+)"/);
        if (!startM) continue;
        var stopM = attrs.match(/stop="([^"]+)"/);
        var chM = attrs.match(/channel="([^"]+)"/);
        if (!chM) continue;

        var startMs = parseEPGDate(startM[1]);
        if (!startMs) continue;
        var endMs = stopM ? parseEPGDate(stopM[1]) : (startMs + 3600000);
        if (!endMs) continue;

        var titleM = body.match(/<title[^>]*>([\s\S]*?)<\/title>/);
        var descM = body.match(/<desc[^>]*>([\s\S]*?)<\/desc>/);
        var iconM = body.match(/<icon\s+src="([^"]+)"/);

        var id = chM[1];
        if (!byId[id]) byId[id] = [];
        byId[id].push({
          t: titleM ? decodeXmlEntities(titleM[1]).trim() : 'No title',
          d: descM ? decodeXmlEntities(descM[1]).trim().substring(0, 300) : '',
          s: startMs,
          e: endMs,
          ic: iconM ? iconM[1] : ''
        });
      } catch (e) { /* skip malformed */ }

      if (Date.now() - t0 > PARSE_CHUNK_MS) {
        if (onProgress) onProgress(byId);
        setTimeout(step, 0);
        return;
      }
    }
    for (var id2 in byId) if (byId.hasOwnProperty(id2)) byId[id2].sort(function(a,b){ return a.s - b.s; });
    onDone(byId, channelNames);
  }
  step();
}

function parseBufferChunked(buf) {
  return new Promise(function(resolve) {
    var bytes = new Uint8Array(buf);
    if (bytes.length < 500) { resolve(null); return; }
    var isGzip = bytes[0] === 0x1f && bytes[1] === 0x8b;

    function continueWithXmlText(xmlText) {
      parseXmltvChunked(xmlText,
        function(partial) { applyPartialEpg(partial); },
        function(byId, channelNames) { resolve({ byId: byId, channelNames: channelNames }); }
      );
    }

    if (isGzip) {
      if (typeof pako === 'undefined') { resolve(null); return; }
      var inflator = new pako.Inflate({ to: 'string' });
      var chunks = [];
      inflator.onData = function(chunk) { chunks.push(chunk); };
      inflator.onEnd = function(status) {
        if (status !== 0) { resolve(null); return; }
        continueWithXmlText(chunks.join(''));
      };
      var offset = 0, CHUNK = 65536;
      function pushNext() {
        if (offset >= bytes.length) return;
        var end = Math.min(offset + CHUNK, bytes.length);
        inflator.push(bytes.subarray(offset, end), end >= bytes.length);
        offset = end;
        if (offset < bytes.length) rAF(pushNext);
      }
      pushNext();
    } else {
      continueWithXmlText(bytesToUtf8String(bytes));
    }
  });
}

function applyPartialEpg(partial) {
  /* As parsing progresses, refresh cards in batches so users see data appear. */
  var touched = 0;
  for (var id in partial) {
    if (!partial.hasOwnProperty(id)) continue;
    if (epgByChannelId[id] && epgByChannelId[id].length >= partial[id].length) continue;
    epgByChannelId[id] = partial[id];
    touched++;
    if (touched >= 30) break;
  }
  if (touched) {
    epgLoaded = true;
    refreshAllCardsEpg();
  }
}

function fetchEpgSourceChunked(src) {
  return xhrFetchBuffer(src.url, { timeout: src.timeout || 180000 })
    .then(function(buf) { return parseBufferChunked(buf); })
    .catch(function() {
      return xhrFetchBuffer(CORS_PROXY + src.url, { timeout: 180000 })
        .then(function(buf) { return parseBufferChunked(buf); })
        .catch(function() { return null; });
    });
}

/* ══════════════════════════════════════════════════════════════ Cache */
function loadCache() {
  try {
    var raw = localStorage.getItem(EPG_CACHE_KEY); if (!raw) return false;
    var c = JSON.parse(raw); if (!c || !c.data) return false;
    var fresh = (Date.now() - c.fetchedAt) < EPG_CACHE_TTL_MS, n = 0;
    for (var id in c.data) if (c.data.hasOwnProperty(id)) { epgByChannelId[id] = c.data[id]; n++; }
    epgLoaded = n > 0;
    return fresh && epgLoaded;
  } catch (e) { return false; }
}
function saveCache() {
  try { localStorage.setItem(EPG_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), data: epgByChannelId })); }
  catch (e) { /* quota error — ignore */ }
}

function mergeIntoEpg(parsed) {
  if (!parsed || !parsed.byId) return;
  for (var id in parsed.byId) {
    if (!parsed.byId.hasOwnProperty(id)) continue;
    if (!epgByChannelId[id]) epgByChannelId[id] = [];
    var existing = epgByChannelId[id], seen = {};
    for (var i = 0; i < existing.length; i++) seen[existing[i].s] = true;
    var added = 0;
    for (var j = 0; j < parsed.byId[id].length; j++) {
      if (!seen[parsed.byId[id][j].s]) { existing.push(parsed.byId[id][j]); added++; }
    }
    if (added) existing.sort(function(a,b){ return a.s - b.s; });
  }
  /* Name-based fallback for channels without id match */
  for (var i2 = 0; i2 < allChannels.length; i2++) {
    var ch = allChannels[i2], id2 = String(ch.id);
    if (epgByChannelId[id2] && epgByChannelId[id2].length) continue;
    var norm = normalizeChannelName(ch.name); if (!norm) continue;
    for (var cn in parsed.channelNames) {
      if (!parsed.channelNames.hasOwnProperty(cn)) continue;
      if (normalizeChannelName(parsed.channelNames[cn]) === norm && parsed.byId[cn]) {
        epgByChannelId[id2] = parsed.byId[cn].slice();
        break;
      }
    }
  }
}

function loadAllEPG() {
  var idx = 0;
  function next() {
    if (idx >= EPG_SOURCES.length) {
      epgLoaded = Object.keys(epgByChannelId).length > 0;
      saveCache();
      setEpgStatus(epgLoaded ? 'Guide ready' : 'Guide unavailable', !epgLoaded);
      setTimeout(function(){ setEpgStatus(''); }, 4000);
      refreshAllCardsEpg();
      return;
    }
    var src = EPG_SOURCES[idx++];
    setEpgStatus('Loading guide ' + idx + '/' + EPG_SOURCES.length + '…');
    fetchEpgSourceChunked(src).then(function(parsed) {
      if (parsed) { mergeIntoEpg(parsed); epgLoaded = Object.keys(epgByChannelId).length > 0; refreshAllCardsEpg(); }
      next();
    });
  }
  next();
}

/* ══════════════════════════════════════════════════════════════ EPG helpers */
function getCurrentProgram(progs) { if (!progs || !progs.length) return null; var now = Date.now(); for (var i = 0; i < progs.length; i++) if (progs[i].s <= now && progs[i].e > now) return progs[i]; return null; }
function getNextProgram(progs, after) { if (!progs || !progs.length) return null; var ref = after || Date.now(); for (var i = 0; i < progs.length; i++) if (progs[i].s > ref) return progs[i]; return null; }
function getChannelNumber(ch) {
  if (!ch) return null;
  if (typeof ch.id === 'number') return ch.id;
  if (typeof ch.id === 'string') { var n = parseInt(ch.id, 10); if (!isNaN(n) && String(n) === ch.id) return n; }
  return null;
}
function buildEpgBlockHtml(ch) {
  if (!epgLoaded) return '<div class="card-epg"><div class="epg-empty">Loading guide…</div></div>';
  var progs = epgByChannelId[String(ch.id)];
  var current = getCurrentProgram(progs), next = getNextProgram(progs, current ? current.s : Date.now());
  if (!current && !next) return '<div class="card-epg"><div class="epg-empty">No guide data</div></div>';
  var html = '<div class="card-epg">';
  if (current) {
    html += '<div class="epg-now-row"><span class="epg-now-label">NOW</span><span class="epg-now-time">' + formatRange(current.s, current.e) + '</span></div>' +
            '<div class="epg-now-title">' + escapeHtml(current.t || 'No Title') + '</div>' +
            (current.d ? '<div class="epg-now-desc">' + escapeHtml(truncate(current.d, 120)) + '</div>' : '');
    if (next) html += '<div class="epg-next-mini">Next: <b>' + escapeHtml(truncate(next.t, 40)) + '</b> at ' + formatTimeOnly(next.s) + '</div>';
  } else {
    html += '<div class="epg-now-row"><span class="epg-now-label next">NEXT</span><span class="epg-now-time">' + formatTimeOnly(next.s) + '</span></div>' +
            '<div class="epg-now-title">' + escapeHtml(next.t || 'No Title') + '</div>' +
            (next.d ? '<div class="epg-now-desc">' + escapeHtml(truncate(next.d, 120)) + '</div>' : '');
  }
  return html + '</div>';
}
function updateCardEpg(id) {
  var entry = cardMap[id]; if (!entry) return;
  if (entry.el.classList.contains('hidden')) return;
  var html = buildEpgBlockHtml(entry.ch);
  if (html !== entry.lastEpg) { entry.epg.innerHTML = html; entry.lastEpg = html; }
}
function refreshAllCardsEpg() {
  var ids = Object.keys(cardMap); if (!ids.length) return;
  var i = 0, BATCH = 20;
  function step() { var end = Math.min(i + BATCH, ids.length); for (; i < end; i++) updateCardEpg(ids[i]); if (i < ids.length) rAF(step); }
  rAF(step);
}

/* ══════════════════════════════════════════════════════════════ Channels */
function parseChannelJson(text) {
  var c = String(text).trim(); if (c.charCodeAt(0) === 0xFEFF) c = c.slice(1);
  try { var p = JSON.parse(c); if (Array.isArray(p)) return p; if (p && Array.isArray(p.channels)) return p.channels; } catch(e){}
  try { var p2 = JSON.parse('[' + c.replace(/,\s*$/, '') + ']'); if (Array.isArray(p2)) return p2; } catch(e){}
  throw new Error('Invalid JSON');
}
function fetchChannelsFrom(idx) {
  if (idx >= CHANNELS_CANDIDATES.length) return Promise.reject(new Error('All failed'));
  return xhrFetch(CHANNELS_CANDIDATES[idx], { timeout: 20000 })
    .then(function(r){ return r.text(); })
    .then(function(t){ var p = parseChannelJson(t); if (p && p.length) return p; throw new Error('Empty'); })
    .catch(function(){ return fetchChannelsFrom(idx + 1); });
}
function buildCardHtml(ch, idx) {
  var cat = ch.category || ch.group || 'Other';
  var num = getChannelNumber(ch);
  var numHtml = num !== null ? '<span class="card-num">' + num + '</span>' : '';
  return '<div class="card" tabindex="0" data-idx="' + idx + '" data-chid="' + escapeHtml(String(ch.id)) + '">' +
    '<div class="card-top">' +
      '<img class="card-logo" src="' + escapeHtml(ch.logo || '') + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="card-meta">' +
        '<div class="card-name">' + numHtml + escapeHtml(ch.name || 'Unknown') + '</div>' +
        '<div class="card-cat">' + escapeHtml(cat) + '</div>' +
      '</div>' +
    '</div>' + buildEpgBlockHtml(ch) +
    '<div class="card-actions"><button class="card-btn" type="button">▶ Watch</button></div>' +
  '</div>';
}
function renderAllCards(onDone) {
  var batch = 25, i = 0;
  gridEl.innerHTML = '';
  function step() {
    var end = Math.min(i + batch, allChannels.length), html = '';
    for (; i < end; i++) html += buildCardHtml(allChannels[i], i);
    gridEl.insertAdjacentHTML('beforeend', html);
    if (i < allChannels.length) rAF(step);
    else { buildCardMap(); if (onDone) onDone(); }
  }
  if (!allChannels.length) { if (onDone) onDone(); return; }
  rAF(step);
}
function buildCardMap() {
  cardMap = {};
  var cards = gridEl.querySelectorAll('.card');
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var idx = parseInt(card.getAttribute('data-idx'), 10);
    var ch = allChannels[idx]; if (!ch) continue;
    cardMap[String(ch.id)] = { el: card, epg: card.querySelector('.card-epg'), ch: ch, lastEpg: '' };
    (function(cardEl, channel) {
      cardEl.addEventListener('click', function(e) { if (e.target.closest && e.target.closest('.card-btn')) return; openDetails(channel); });
      cardEl.addEventListener('keydown', function(ev) { if (ev.keyCode === 13 && !(ev.target.classList && ev.target.classList.contains('card-btn'))) { ev.preventDefault(); openDetails(channel); } });
      var pb = cardEl.querySelector('.card-btn');
      if (pb) pb.addEventListener('click', function(e){ e.stopPropagation(); openPlayer(channel); });
    })(card, ch);
  }
}
function applyFilter() {
  for (var i = 0; i < allChannels.length; i++) {
    var ch = allChannels[i], chCat = ch.category || ch.group || 'Other', match = true;
    if (selectedCategory !== 'all' && chCat !== selectedCategory) match = false;
    if (match && searchQuery) {
      var name = (ch.name || '').toLowerCase(), catL = chCat.toLowerCase();
      if (name.indexOf(searchQuery) === -1 && catL.indexOf(searchQuery) === -1) match = false;
    }
    var entry = cardMap[String(ch.id)];
    if (entry) entry.el.classList[match ? 'remove' : 'add']('hidden');
  }
}
function renderCategories() {
  var set = {};
  for (var i = 0; i < allChannels.length; i++) { var c = allChannels[i].category || allChannels[i].group || 'Other'; set[c] = true; }
  var cats = ['all'];
  for (var k in set) if (set.hasOwnProperty(k)) cats.push(k);
  cats.sort(function(a,b){ if(a==='all')return -1; if(b==='all')return 1; return a.toLowerCase().localeCompare(b.toLowerCase()); });
  var html = '';
  for (var j = 0; j < cats.length; j++) {
    html += '<button class="cat-chip' + (cats[j] === selectedCategory ? ' active' : '') + '" data-cat="' + escapeHtml(cats[j]) + '" type="button">' + escapeHtml(cats[j] === 'all' ? 'All' : cats[j]) + '</button>';
  }
  categoriesEl.innerHTML = html;
  var chips = categoriesEl.querySelectorAll('.cat-chip');
  for (var c2 = 0; c2 < chips.length; c2++) (function(chip) {
    chip.addEventListener('click', function() { selectedCategory = chip.getAttribute('data-cat'); renderCategories(); applyFilter(); wrapEl.scrollTop = 0; });
  })(chips[c2]);
}

function openDetails(ch) {
  currentDetailChannel = ch;
  var num = getChannelNumber(ch);
  dNum.textContent = num !== null ? 'CH ' + num : '';
  dName.textContent = ch.name || 'Unknown';
  dCat.textContent = ch.category || ch.group || 'Other';
  dLogo.src = ch.logo || ''; dLogo.style.visibility = ch.logo ? 'visible' : 'hidden';

  var progs = epgByChannelId[String(ch.id)] || [];
  var current = getCurrentProgram(progs), next = getNextProgram(progs, current ? current.s : Date.now());
  var body = '';

  if (current) {
    body += '<div class="detail-show now"><div class="show-label">● NOW · ' + formatRange(current.s, current.e) + '</div>' +
      '<div class="show-title">' + escapeHtml(current.t || 'No Title') + '</div>';
    if (current.ic) body += '<div class="show-image"><img src="' + escapeHtml(current.ic) + '" onerror="this.parentNode.style.display=\'none\'"></div>';
    if (current.d) body += '<div class="show-desc">' + escapeHtml(current.d) + '</div>';
    body += '</div>';
  } else body += '<div class="detail-show none"><div class="show-label">● NOW</div><div class="show-title">' + (epgLoaded ? 'No current programme' : 'Loading guide…') + '</div></div>';

  if (next) {
    body += '<div class="detail-show next"><div class="show-label">○ NEXT · ' + formatRange(next.s, next.e) + '</div>' +
      '<div class="show-title">' + escapeHtml(next.t || 'No Title') + '</div>';
    if (next.ic) body += '<div class="show-image"><img src="' + escapeHtml(next.ic) + '" onerror="this.parentNode.style.display=\'none\'"></div>';
    if (next.d) body += '<div class="show-desc">' + escapeHtml(next.d) + '</div>';
    body += '</div>';
  } else if (epgLoaded) body += '<div class="detail-show none"><div class="show-label">○ NEXT</div><div class="show-title">No upcoming programme</div></div>';

  dBody.innerHTML = body;
  detailModal.classList.remove('hidden');
  dWatch.focus();
}
function closeDetails() { detailModal.classList.add('hidden'); currentDetailChannel = null; }

function openPlayer(ch) {
  try {
    localStorage.setItem('currentChannel', JSON.stringify(ch));
    localStorage.setItem('allChannels', JSON.stringify(allChannels));
  } catch (e) {}
  var url = 'jplayer.html?id=' + encodeURIComponent(ch.id);
  try { var w = window.open(url, '_blank'); if (!w) window.location.href = url; }
  catch (e) { window.location.href = url; }
}

/* ══════════════════════════════════════════════════════════════ Channel number typing */
function showChNumOverlay() { chNumValue.textContent = chNumBuffer || '—'; chNumOverlay.classList.add('visible'); }
function hideChNumOverlay() { chNumOverlay.classList.remove('visible'); }
function handleChNumDigit(digit) {
  if (chNumBuffer.length >= 4) chNumBuffer = '';
  chNumBuffer += digit;
  showChNumOverlay();
  clearTimeout(chNumTimer);
  chNumTimer = setTimeout(autoPlayByNumber, 1500);
}
function autoPlayByNumber() {
  var num = chNumBuffer; chNumBuffer = ''; clearTimeout(chNumTimer); hideChNumOverlay();
  if (!num) return;
  var n = parseInt(num, 10);
  var found = null;
  for (var i = 0; i < allChannels.length; i++) if (getChannelNumber(allChannels[i]) === n) { found = allChannels[i]; break; }
  if (!found) { showToast('Channel ' + num + ' not found', true); return; }
  showToast('Tuning to CH ' + n + ' · ' + (found.name || ''));
  try { localStorage.setItem('currentChannel', JSON.stringify(found)); localStorage.setItem('allChannels', JSON.stringify(allChannels)); } catch (e) {}
  var url = 'jplayer.html?id=' + encodeURIComponent(found.id);
  var isTV = /Tizen|Web0S|webOS|SMART-TV|SmartTV|HbbTV|NetCast|BRAVIA|Android TV|AFT|FireTV|Hisense|Panasonic|Philips|Kepler/i.test(navigator.userAgent);
  if (isTV) { window.location.href = url; return; }
  try { var w = window.open(url, '_blank'); if (w && !w.closed) { try { w.focus(); } catch (e) {} return; } } catch (e) {}
  window.location.href = url;
}

function loadChannels() {
  gridEl.innerHTML = '<div class="msg"><div class="spinner"></div><div>Loading channels…</div></div>';
  var last = CHANNELS_CANDIDATES[CHANNELS_CANDIDATES.length - 1];
  fetchChannelsFrom(0)
    .catch(function() {
      return xhrFetch(CORS_PROXY + last, { timeout: 25000 }).then(function(r){ return r.text(); }).then(function(t){ return parseChannelJson(t); });
    })
    .then(function(chs) {
      if (!chs || !chs.length) throw new Error('No channels');
      allChannels = chs;
      renderCategories();
      var cacheFresh = loadCache();
      renderAllCards(function() {
        if (cacheFresh) { refreshAllCardsEpg(); setEpgStatus('Guide from cache'); setTimeout(function(){ setEpgStatus(''); }, 2500); }
        else loadAllEPG();
      });
    })
    .catch(function(e) {
      gridEl.innerHTML = '<div class="msg err">⚠️ Could not load channels.<br><div style="color:#888;font-size:12px;margin-top:10px">' + escapeHtml(e.message || '') + '</div><button id="retry">Retry</button></div>';
      var rb = document.getElementById('retry'); if (rb) rb.onclick = loadChannels;
    });
}

var searchTimer = null;
searchEl.addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() { searchQuery = searchEl.value.trim().toLowerCase(); applyFilter(); wrapEl.scrollTop = 0; }, 120);
});

document.addEventListener('keydown', function(e) {
  var k = e.keyCode, focused = document.activeElement;
  var inModal = !detailModal.classList.contains('hidden');

  if (inModal) {
    if (k === 27 || k === 8 || k === 10009) { e.preventDefault(); closeDetails(); return; }
    if (k === 13) {
      if (focused === dWatch) { e.preventDefault(); if (currentDetailChannel) openPlayer(currentDetailChannel); return; }
      if (focused === dCancel || focused === dClose) { e.preventDefault(); closeDetails(); return; }
    }
    if (k === 37 && focused === dWatch) { e.preventDefault(); dCancel.focus(); return; }
    if (k === 39 && focused === dCancel) { e.preventDefault(); dWatch.focus(); return; }
    return;
  }

  var isNum = (k >= 48 && k <= 57) || (k >= 96 && k <= 105);
  if (isNum && focused !== searchEl) {
    e.preventDefault();
    handleChNumDigit(String.fromCharCode(k >= 96 ? k - 48 : k));
    return;
  }

  if (focused && focused.classList && focused.classList.contains('cat-chip')) {
    var chips = categoriesEl.querySelectorAll('.cat-chip');
    var cidx = Array.prototype.indexOf.call(chips, focused);
    if (k === 37 && cidx > 0) { chips[cidx - 1].focus(); e.preventDefault(); }
    else if (k === 39 && cidx < chips.length - 1) { chips[cidx + 1].focus(); e.preventDefault(); }
    else if (k === 40) { var vc = gridEl.querySelector('.card:not(.hidden)'); if (vc) { vc.focus(); e.preventDefault(); } }
    return;
  }
  if (focused === searchEl) { if (k === 40) { var vc2 = gridEl.querySelector('.card:not(.hidden)'); if (vc2) { vc2.focus(); e.preventDefault(); } } return; }
  if (focused && focused.classList && focused.classList.contains('card')) {
    var visible = gridEl.querySelectorAll('.card:not(.hidden)');
    var cIdx = Array.prototype.indexOf.call(visible, focused);
    var cols = 1;
    if (visible.length) { var ft = visible[0].getBoundingClientRect().top, n = 1; for (var ci = 1; ci < visible.length; ci++) { if (Math.abs(visible[ci].getBoundingClientRect().top - ft) < 4) n++; else break; } cols = n; }
    if (k === 37 && cIdx > 0) { visible[cIdx - 1].focus(); e.preventDefault(); }
    else if (k === 39 && cIdx < visible.length - 1) { visible[cIdx + 1].focus(); e.preventDefault(); }
    else if (k === 38) {
      if (cIdx - cols >= 0) { visible[cIdx - cols].focus(); e.preventDefault(); }
      else { var ac = categoriesEl.querySelector('.cat-chip.active') || categoriesEl.querySelector('.cat-chip'); if (ac) { ac.focus(); e.preventDefault(); } }
    }
    else if (k === 40 && cIdx + cols < visible.length) { visible[cIdx + cols].focus(); e.preventDefault(); }
    else if (k === 13) { e.preventDefault(); var ch = allChannels[parseInt(focused.getAttribute('data-idx'), 10)]; if (ch) openDetails(ch); }
    return;
  }
  if (k === 40 || k === 39) { var anyChip = categoriesEl.querySelector('.cat-chip'); if (anyChip) { anyChip.focus(); e.preventDefault(); } }
});

dClose.addEventListener('click', function(e){ e.preventDefault(); closeDetails(); });
dCancel.addEventListener('click', function(e){ e.preventDefault(); closeDetails(); });
dWatch.addEventListener('click', function(e){ e.preventDefault(); if (currentDetailChannel) openPlayer(currentDetailChannel); });
detailModal.addEventListener('click', function(e){ if (e.target === detailModal) closeDetails(); });

function boot() { loadChannels(); }
if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 0);
else document.addEventListener('DOMContentLoaded', boot);
</script>
