<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<title>Channels</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  background: #0a0a0a;
  color: #eee;
  font-family: Arial, Helvetica, sans-serif;
  width: 100%;
  height: 100%;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: 100%;
}

/* ── HEADER ── */
#header {
  background: #111;
  border-bottom: 1px solid #222;
  padding: 14px 20px;
  padding-top: calc(14px + env(safe-area-inset-top));
  padding-left: calc(20px + env(safe-area-inset-left));
  padding-right: calc(20px + env(safe-area-inset-right));
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
#header h1 {
  font-size: 20px;
  font-weight: bold;
  color: #4fc3f7;
  white-space: nowrap;
}
#searchWrap {
  flex: 1;
  min-width: 200px;
  position: relative;
}
#search {
  width: 100%;
  padding: 12px 16px;
  font-size: 16px;
  background: #1a1a1a;
  border: 1px solid #333;
  color: #eee;
  border-radius: 6px;
  outline: none;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
}
#search:focus {
  border-color: #4fc3f7;
  background: #202020;
}
#search::-webkit-search-cancel-button { -webkit-appearance: none; }

/* ── SCROLL AREA ── */
#wrap {
  height: calc(100% - 73px);
  height: calc(100vh - 73px);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 14px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: #333 transparent;
}
#wrap::-webkit-scrollbar { width: 8px; }
#wrap::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
#wrap::-webkit-scrollbar-track { background: transparent; }

/* ── CARD GRID (flexbox: works on Chrome 38+) ── */
#grid {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-wrap: wrap;
  flex-wrap: wrap;
  margin: -6px;
}

.card {
  box-sizing: border-box;
  -webkit-box-sizing: border-box;
  padding: 12px;
  margin: 6px;
  width: calc(50% - 12px);
  background: #161616;
  border: 2px solid transparent;
  border-radius: 8px;
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  outline: none;
  min-height: 68px;
  -webkit-transition: background .15s, border-color .15s, transform .1s;
  transition: background .15s, border-color .15s, transform .1s;
  text-align: left;
}
.card:hover {
  background: #1e2a35;
  border-color: #35506b;
}
.card:active {
  -webkit-transform: scale(0.98);
  transform: scale(0.98);
}
.card:focus {
  background: #1e2a35;
  border-color: #4fc3f7;
  box-shadow: 0 0 0 2px rgba(79,195,247,0.35);
}
.card img {
  width: 44px;
  height: 44px;
  border-radius: 6px;
  -o-object-fit: contain;
  object-fit: contain;
  background: #222;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
.card-info {
  -webkit-box-flex: 1;
  -webkit-flex: 1;
  flex: 1;
  min-width: 0;
}
.card-name {
  font-size: 14px;
  font-weight: bold;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-cat {
  font-size: 11px;
  color: #888;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── MESSAGES ── */
.msg {
  width: 100%;
  padding: 60px 20px;
  text-align: center;
  font-size: 15px;
  color: #888;
}
.msg.err { color: #ef5350; }
.msg button {
  margin-top: 16px;
  background: #2a2a2a;
  border: none;
  color: #eee;
  padding: 12px 24px;
  border-radius: 6px;
  font-size: 15px;
  cursor: pointer;
  font-family: inherit;
}
.msg button:hover { background: #3a3a3a; }

/* ── SPINNER ── */
.spinner {
  display: inline-block;
  width: 28px;
  height: 28px;
  border: 3px solid #333;
  border-top-color: #4fc3f7;
  border-radius: 50%;
  -webkit-animation: spin 0.8s linear infinite;
  animation: spin 0.8s linear infinite;
  margin-bottom: 14px;
}
@-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════════════════════════
   RESPONSIVE BREAKPOINTS
   ══════════════════════════════════════════════════════════════ */

/* Phones (portrait) — compact header, 2 columns */
@media (max-width: 480px) {
  #header { padding: 12px 14px; }
  #header h1 { font-size: 17px; width: 100%; }
  #searchWrap { min-width: 100%; }
  #search { padding: 12px 14px; font-size: 16px; }
  #wrap { padding: 10px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  #grid { margin: -5px; }
  .card { width: calc(50% - 10px); margin: 5px; padding: 10px; min-height: 62px; gap: 8px; }
  .card img { width: 40px; height: 40px; }
  .card-name { font-size: 13px; }
  .card-cat { font-size: 10px; }
}

/* Small phones (very narrow) — 1 column */
@media (max-width: 340px) {
  .card { width: calc(100% - 10px); }
}

/* Tablets (portrait) — 3 columns */
@media (min-width: 600px) {
  .card { width: calc(33.333% - 12px); }
}

/* Tablets (landscape) / small laptops — 3 columns */
@media (min-width: 800px) {
  .card { width: calc(33.333% - 12px); }
}

/* Desktop — 4 columns */
@media (min-width: 1100px) {
  .card { width: calc(25% - 12px); }
}

/* Large desktop / TV (1280 / 1920) — 5 columns + larger everything */
@media (min-width: 1400px) {
  #header h1 { font-size: 24px; }
  #search { font-size: 18px; padding: 14px 18px; }
  #wrap { padding: 22px; }
  .card { width: calc(20% - 12px); min-height: 84px; padding: 16px; gap: 14px; }
  .card img { width: 56px; height: 56px; }
  .card-name { font-size: 17px; }
  .card-cat { font-size: 13px; }
}

/* TV — even bigger text and focus ring (assumes 1080p/4K) */
@media (min-width: 1800px) {
  #header h1 { font-size: 28px; }
  .card-name { font-size: 19px; }
  .card-cat { font-size: 14px; }
  .card { min-height: 96px; }
}

/* Coarse pointer / touch — kill hover-only effects */
@media (hover: none) {
  .card:hover { background: #161616; border-color: transparent; }
  .card:focus  { background: #1e2a35; border-color: #4fc3f7; }
}
</style>
</head>
<body>

<div id="header">
  <h1>📺 Channels</h1>
  <div id="searchWrap">
    <input id="search" type="search" placeholder="Search channels…" autocomplete="off" spellcheck="false">
  </div>
</div>

<div id="wrap">
  <div id="grid">
    <div class="msg">
      <div class="spinner"></div>
      <div>Loading channels…</div>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   ES5 SHIMS (Chrome 38+)
   ══════════════════════════════════════════════════════════════ */
if (!Array.prototype.includes) {
  Array.prototype.includes = function(x){ return this.indexOf(x) !== -1; };
}
if (!Array.prototype.filter) {
  Array.prototype.filter = function(fn) {
    var out = [], i;
    for (i = 0; i < this.length; i++) if (fn(this[i], i, this)) out.push(this[i]);
    return out;
  };
}

/* ══════════════════════════════════════════════════════════════
   XHR FETCH
   ══════════════════════════════════════════════════════════════ */
function xhrFetch(url, opts) {
  opts = opts || {};
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(opts.method || 'GET', url, true);
    xhr.timeout = opts.timeout || 20000;
    if (opts.headers) {
      for (var k in opts.headers) {
        if (opts.headers.hasOwnProperty(k)) {
          try { xhr.setRequestHeader(k, opts.headers[k]); } catch(e){}
        }
      }
    }
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve({
          ok: true, status: xhr.status,
          text: function(){ return Promise.resolve(xhr.responseText); },
          json: function(){ return Promise.resolve(JSON.parse(xhr.responseText)); }
        });
      } else reject(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror   = function(){ reject(new Error('Network error')); };
    xhr.ontimeout = function(){ reject(new Error('Timeout')); };
    try { xhr.send(opts.body || null); } catch(e){ reject(e); }
  });
}

/* ══════════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════════ */
var CHANNELS_CANDIDATES = [
  '/jstr4web.json',
  'https://jjtvxweb.pages.dev/jstr4web.json'
];
var CORS_PROXY = 'https://demonji.onrender.com/cors-proxy.php/';

/* ══════════════════════════════════════════════════════════════
   DOM
   ══════════════════════════════════════════════════════════════ */
var gridEl   = document.getElementById('grid');
var searchEl = document.getElementById('search');
var allChannels      = [];
var filteredChannels = [];

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function parseChannelJson(text) {
  var c = String(text).trim();
  if (c.charCodeAt(0) === 0xFEFF) c = c.slice(1);
  try {
    var p = JSON.parse(c);
    if (Array.isArray(p)) return p;
    if (p && Array.isArray(p.channels)) return p.channels;
  } catch(e){}
  try {
    var p2 = JSON.parse('[' + c.replace(/,\s*$/, '') + ']');
    if (Array.isArray(p2)) return p2;
  } catch(e){}
  try {
    var p3 = JSON.parse(c.replace(/,\s*([\]}])/g, '$1'));
    if (Array.isArray(p3)) return p3;
    if (p3 && Array.isArray(p3.channels)) return p3.channels;
  } catch(e){}
  throw new Error('Invalid JSON');
}

function fetchChannelsFrom(idx) {
  if (idx >= CHANNELS_CANDIDATES.length) return Promise.reject(new Error('All failed'));
  var url = CHANNELS_CANDIDATES[idx];
  console.log('[channels] try', url);
  return xhrFetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' }, timeout: 20000 })
    .then(function(r){ return r.text(); })
    .then(function(t){
      var p = parseChannelJson(t);
      if (p && p.length) return p;
      throw new Error('Empty list');
    })
    .catch(function(e){
      console.warn('[channels] fail', url, e.message);
      return fetchChannelsFrom(idx + 1);
    });
}

/* ══════════════════════════════════════════════════════════════
   LOAD + RENDER
   ══════════════════════════════════════════════════════════════ */
function loadChannels() {
  gridEl.innerHTML = '<div class="msg"><div class="spinner"></div><div>Loading channels…</div></div>';
  var last = CHANNELS_CANDIDATES[CHANNELS_CANDIDATES.length - 1];

  fetchChannelsFrom(0)
    .catch(function() {
      console.log('[channels] trying proxy');
      return xhrFetch(CORS_PROXY + last, { timeout: 25000 })
        .then(function(r){ return r.text(); })
        .then(function(t){ return parseChannelJson(t); });
    })
    .then(function(chs) {
      if (!chs || !chs.length) throw new Error('No channels');
      allChannels = chs;
      filteredChannels = allChannels.slice();
      render();
      /* Auto-focus first card only if pointer is not touch (PC/TV) */
      if (!isTouchDevice()) {
        var first = gridEl.querySelector('.card');
        if (first) first.focus();
      }
    })
    .catch(function(e) {
      gridEl.innerHTML =
        '<div class="msg err">⚠️ Could not load channels.' +
        '<div style="color:#888;font-size:12px;margin-top:10px;word-break:break-all">' +
        escapeHtml(e.message || '') + '</div>' +
        '<button id="retry">Retry</button></div>';
      var rb = document.getElementById('retry');
      if (rb) rb.onclick = loadChannels;
    });
}

function render() {
  if (!filteredChannels.length) {
    gridEl.innerHTML = '<div class="msg">No channels found.</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < filteredChannels.length; i++) {
    var ch = filteredChannels[i];
    html +=
      '<div class="card" tabindex="0" data-idx="' + i + '" data-id="' + escapeHtml(ch.id) + '">' +
        '<img src="' + escapeHtml(ch.logo || '') + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="card-info">' +
          '<div class="card-name">' + escapeHtml(ch.name || 'Unknown') + '</div>' +
          '<div class="card-cat">' + escapeHtml(ch.category || '') + '</div>' +
        '</div>' +
      '</div>';
  }
  gridEl.innerHTML = html;

  var cards = gridEl.querySelectorAll('.card');
  for (var j = 0; j < cards.length; j++) {
    (function(el, idx) {
      /* Tap / click */
      el.addEventListener('click', function(e) {
        e.preventDefault();
        openChannel(idx);
      });
      /* Enter / OK on TV remote */
      el.addEventListener('keydown', function(ev) {
        if (ev.keyCode === 13) { ev.preventDefault(); openChannel(idx); }
      });
      /* Show overlay metadata on hover (desktop) */
      el.addEventListener('mouseenter', function() {
        el.setAttribute('data-hover', '1');
      });
    })(cards[j], j);
  }
}

/* ══════════════════════════════════════════════════════════════
   OPEN CHANNEL
   ══════════════════════════════════════════════════════════════ */
function openChannel(idx) {
  var ch = filteredChannels[idx];
  if (!ch) return;
  try {
    sessionStorage.setItem('currentChannel', JSON.stringify(ch));
    sessionStorage.setItem('allChannels', JSON.stringify(allChannels));
  } catch (e) {}
  window.location.href = 'jplayer.html?id=' + encodeURIComponent(ch.id);
}

/* ══════════════════════════════════════════════════════════════
   DEVICE DETECTION
   ══════════════════════════════════════════════════════════════ */
function isTouchDevice() {
  return ('ontouchstart' in window) ||
         (navigator.maxTouchPoints > 0) ||
         (navigator.msMaxTouchPoints > 0);
}

/* ══════════════════════════════════════════════════════════════
   SEARCH
   ══════════════════════════════════════════════════════════════ */
var searchTimer = null;
searchEl.addEventListener('input', function() {
  /* Debounce so TV on-screen keyboards don't re-render on each key */
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    var q = searchEl.value.trim().toLowerCase();
    filteredChannels = !q ? allChannels.slice() : allChannels.filter(function(ch) {
      return (ch.name && ch.name.toLowerCase().indexOf(q) !== -1) ||
             (ch.category && ch.category.toLowerCase().indexOf(q) !== -1);
    });
    render();
  }, 120);
});

/* ══════════════════════════════════════════════════════════════
   REMOTE / KEYBOARD NAVIGATION
   ══════════════════════════════════════════════════════════════ */
function getColumnCount() {
  var card = gridEl.querySelector('.card');
  if (!card) return 1;
  var cardW = card.offsetWidth;
  if (!cardW) return 1;
  var gridW = gridEl.offsetWidth;
  return Math.max(1, Math.round(gridW / cardW));
}

document.addEventListener('keydown', function(e) {
  var k = e.keyCode;
  var focused = document.activeElement;

  /* Esc / Backspace → clear search or exit */
  if (k === 27 || k === 8) {
    if (document.activeElement === searchEl) return; /* let search handle it */
    if (k === 8) return; /* don't hijack backspace in inputs */
  }

  /* TV back keys */
  if (k === 461 || k === 10009 || k === 10033) {
    e.preventDefault();
    window.history.back();
    return;
  }

  /* Search box focused */
  if (focused === searchEl) {
    if (k === 40) { /* Down → enter grid */
      var first = gridEl.querySelector('.card');
      if (first) { first.focus(); e.preventDefault(); }
    }
    return;
  }

  /* Card focused */
  if (focused && focused.classList && focused.classList.contains('card')) {
    var idx   = parseInt(focused.getAttribute('data-idx'), 10);
    var cards = gridEl.querySelectorAll('.card');
    var cols  = getColumnCount();

    if (k === 37) {              /* LEFT */
      if (idx > 0) { cards[idx - 1].focus(); e.preventDefault(); }
    } else if (k === 39) {       /* RIGHT */
      if (idx < cards.length - 1) { cards[idx + 1].focus(); e.preventDefault(); }
    } else if (k === 38) {       /* UP */
      if (idx - cols >= 0) { cards[idx - cols].focus(); e.preventDefault(); }
      else if (searchEl) { searchEl.focus(); e.preventDefault(); }
    } else if (k === 40) {       /* DOWN */
      if (idx + cols < cards.length) { cards[idx + cols].focus(); e.preventDefault(); }
    } else if (k === 13) {       /* ENTER */
      e.preventDefault();
      openChannel(idx);
    }
    return;
  }

  /* Nothing focused → move into grid */
  if (k === 40 || k === 39) {
    var f = gridEl.querySelector('.card');
    if (f) { f.focus(); e.preventDefault(); }
  }
});

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
function boot() {
  loadChannels();

  /* Re-render on orientation change / resize so keyboard column count
     stays accurate and grid reflows */
  var resizeTimer = null;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      /* nothing to do — CSS handles layout; just refresh column cache */
    }, 200);
  });
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(boot, 0);
} else {
  document.addEventListener('DOMContentLoaded', boot);
}
</script>

</body>
</html>
