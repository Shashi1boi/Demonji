function parseEPGDate(dateStr) {
  if (!dateStr) return null;
  var s = String(dateStr).trim();
  if (!s) return null;
  if (/Z$/.test(s)) { try { var dZ = new Date(s).getTime(); if (!isNaN(dZ)) return dZ; } catch(e){} }
  var m = s.match(/^(\d{14})/);
  if (m) {
    var dt = m[1], rest = s.substring(14).trim(), tz = '+0530';
    if (rest) {
      var tzm = rest.match(/([+-])(\d{1,2}):?(\d{2})?/);
      if (tzm) { var sg = tzm[1] === '-' ? -1 : 1; var th = parseInt(tzm[2], 10) || 0; var tm = parseInt(tzm[3] || '0', 10) || 0; tz = (sg < 0 ? '-' : '+') + (th < 10 ? '0' : '') + th + (tm < 10 ? '0' : '') + tm; }
      else if (/IST/i.test(rest)) tz = '+0530';
      else if (/UTC|GMT/i.test(rest)) tz = '+0000';
    }
    var year = parseInt(dt.slice(0,4), 10), month = parseInt(dt.slice(4,6), 10) - 1, day = parseInt(dt.slice(6,8), 10);
    var hour = parseInt(dt.slice(8,10), 10), minute = parseInt(dt.slice(10,12), 10), second = parseInt(dt.slice(12,14), 10) || 0;
    if (isNaN(year) || isNaN(month) || isNaN(day) || isNaN(hour) || isNaN(minute)) return null;
    var ms = Date.UTC(year, month, day, hour, minute, second);
    var sg2 = tz.charAt(0) === '-' ? -1 : 1;
    var th2 = parseInt(tz.substr(1,2), 10) || 0, tm2 = parseInt(tz.substr(3,2), 10) || 0;
    return ms - (th2 * 3600 + tm2 * 60) * 1000 * sg2;
  }
  var m12 = s.match(/^(\d{12})/);
  if (m12) return parseEPGDate(m12[1] + '00' + s.substring(12));
  try { var d = new Date(s).getTime(); if (!isNaN(d)) return d; } catch(e){}
  return null;
}
function bytesToUtf8String(bytes) {

  while (i < bytes.length) {

    else if (b < 0xE0) result += String.fromCharCode(((b & 0x1F) << 6) | (bytes[i++] & 0x3F));
    else if (b < 0xF0) result += String.fromCharCode(((b & 0x0F) << 12) | ((bytes[i++] & 0x3F) << 6) | (bytes[i++] & 0x3F));
    else { var cp = ((b & 0x07) << 18) | ((bytes[i++] & 0x3F) << 12) | ((bytes[i++] & 0x3F) << 6) | (bytes[i++] & 0x3F); cp -= 0x10000; result += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 0x3FF)); }

}

function decodeXmlEntities(s) {

  return s.replace(/&(#x?[0-9a-fA-F]+|amp|lt|gt|quot|apos);/g, function(m, e) {
    if (e === 'amp') return '&'; if (e === 'lt') return '<'; if (e === 'gt') return '>';
    if (e === 'quot') return '"'; if (e === 'apos') return "'";

}

function processXmlText(xmlText, label) {
  if (!xmlText || xmlText.length < 500) throw new Error('XML too small');
  var t0 = Date.now(), idToName = {};

    var chMatch = attrs.match(/\bchannel="([^"]*)"/);

    if (!chMatch || !startMatch) continue;
    var rawId = chMatch[1];
    var pdcMatch = attrs.match(/\bpdc-start="([^"]*)"/);
    var startMs = null;
    if (pdcMatch) startMs = parseEPGDate(pdcMatch[1]);
    if (!startMs) startMs = parseEPGDate(startMatch[1]);
    if (!startMs) { badStart++; continue; }
    var stopMatch = attrs.match(/\bstop="([^"]*)"/);
    var endMs = null;
    if (stopMatch) endMs = parseEPGDate(stopMatch[1]);
    if (!endMs || endMs <= startMs) { badStop++; endMs = startMs + 3600000; }
    var titleM = inner.match(/<title[^>]*>([\s\S]*?)<\/title>/);
    var descM = inner.match(/<desc[^>]*>([\s\S]*?)<\/desc>/);
    var iconM = inner.match(/<icon\s+[^>]*\bsrc="([^"]*)"/);
    var catM = inner.match(/<category[^>]*>([\s\S]*?)<\/category>/);
    var seasonM = inner.match(/<episode-num\s+system="xmltv_ns"[^>]*>([\s\S]*?)<\/episode-num>/);
    var epM = inner.match(/<episode-num[^>]*>([\s\S]*?)<\/episode-num>/);
    var desc = descM ? decodeXmlEntities(descM[1]).trim() : ''; if (desc.length > 400) desc = desc.substring(0, 400);
    var epStr = '';
    if (seasonM) { var sp = seasonM[1].split('/'); epStr = 'S' + ((parseInt(sp[0],10)||0)+1) + ' E' + ((parseInt(sp[1],10)||0)+1); }
    else if (epM) epStr = decodeXmlEntities(epM[1]).trim();
    var entry = { t: titleM ? decodeXmlEntities(titleM[1]).trim() : 'No title', d: desc, s: startMs, e: endMs, ic: iconM ? iconM[1] : '', ep: epStr, g: catM ? decodeXmlEntities(catM[1]).trim() : '' };

    if (!rawByChannel.hasOwnProperty(rawId)) continue;
    var progs = rawByChannel[rawId], dispName = idToName[rawId] || '';
    var ch = findMatchingChannel(lookup, rawId, dispName);
    if (!ch) { unmatched++; continue; }
    var key = String(ch.id);
    if (!result[key]) result[key] = [];
    for (var p = 0; p < progs.length; p++) result[key].push(progs[p]);

  }
  safeLog('[epg] ' + label + ': ' + progCount + ' progs, badStart=' + badStart + ' badStop=' + badStop + ', matched=' + matched + ' → ' + Object.keys(result).length + ' ch, unmatched=' + unmatched);

}
function fetchAndParseEPG() {
  if (typeof pako === 'undefined') return Promise.resolve(null);
  return xhrFetchBuffer(EPG_URL, { timeout: 180000 })
    .then(function(buf) {
      if (!buf) throw new Error('Empty');
      var bytes = new Uint8Array(buf);
      if (bytes.length < 500) throw new Error('Too small');
      if (bytes[0] === 0x1f && bytes[1] === 0x8b) return chunkedUngzip(bytes).then(function(x){ return processXmlText(x, 'jioepg'); });
      return processXmlText(bytesToUtf8String(bytes), 'jioepg');
    })
    .catch(function() {
      return xhrFetchBuffer(CORS_PROXY + EPG_URL, { timeout: 180000 }).then(function(buf) {
        var bytes = new Uint8Array(buf);
        if (bytes.length < 500) throw new Error('Too small');
        if (bytes[0] === 0x1f && bytes[1] === 0x8b) return chunkedUngzip(bytes).then(function(x){ return processXmlText(x, 'jioepg (proxy)'); });
        return processXmlText(bytesToUtf8String(bytes), 'jioepg (proxy)');

/* ════════ Cache: 6h past + up to 72h future ════════ */
function buildCacheForWindow(now, beforeH, afterH, stripAfterH) {
  var cfgMin = now - beforeH * 3600000;
  var cfgMax = now + afterH * 3600000;
  var nearCutoff = now + stripAfterH * 3600000;
  var out = {}, cnt = 0;
  for (var key in epgByChannelId) {
    if (!epgByChannelId.hasOwnProperty(key)) continue;
    var filt = [], arr = epgByChannelId[key];
    for (var i = 0; i < arr.length; i++) {
      var p = arr[i];
      if (p.e < cfgMin || p.s >= cfgMax) continue;
      if (p.s > nearCutoff) filt.push({ t: p.t, s: p.s, e: p.e, ep: p.ep || '', g: p.g || '' });
      else filt.push({ t: p.t, d: p.d || '', s: p.s, e: p.e, ic: p.ic || '', ep: p.ep || '', g: p.g || '' });
    }
    if (filt.length) { out[key] = filt; cnt += filt.length; }
  }
  return { data: out, channelCount: Object.keys(out).length, progCount: cnt };
}
function saveCache() {
  var now = Date.now();

    { before: 6, after: 60, strip: 6, label: '6h/60h full' },
    { before: 6, after: 48, strip: 6, label: '6h/48h · strip>6h' },
    { before: 6, after: 36, strip: 6, label: '6h/36h · strip>6h' },
    { before: 4, after: 30, strip: 4, label: '4h/30h · strip>4h' },
    { before: 2, after: 24, strip: 2, label: '2h/24h · strip>2h' }
  ];
  for (var a = 0; a < plans.length; a++) {
    var pl = plans[a];
    var built = buildCacheForWindow(now, pl.before, pl.after, pl.strip);
    if (!built.channelCount) continue;
    try {
      localStorage.setItem(EPG_CACHE_KEY, JSON.stringify({ v: 20, fetchedAt: now, plan: pl.label, data: built.data }));
      safeLog('[cache] saved ' + built.channelCount + ' ch / ' + built.progCount + ' progs · ' + pl.label);
      return;
    } catch (e) { safeLog('[cache] save failed at ' + pl.label); }
  }
}
function loadCache() {
  try {
    var raw = localStorage.getItem(EPG_CACHE_KEY);
    if (!raw) return false;
    var c = JSON.parse(raw);
    if (!c || !c.data || c.v !== 20) return false;
    var timeFresh = (Date.now() - c.fetchedAt) < EPG_CACHE_TTL_MS;
    var n = 0, newestEnd = 0, oldestStart = Infinity;
    for (var id in c.data) {
      if (!c.data.hasOwnProperty(id)) continue;
      epgByChannelId[id] = c.data[id];
      for (var i = 0; i < c.data[id].length; i++) {
        if (c.data[id][i].e > newestEnd) newestEnd = c.data[id][i].e;
        if (c.data[id][i].s < oldestStart) oldestStart = c.data[id][i].s;
      }
      n++;
    }
    if (!n) return false;
    var contentFresh = newestEnd > Date.now() + 6 * 3600000;
    var spanH = ((newestEnd - oldestStart) / 3600000).toFixed(1);
    var aheadH = ((newestEnd - Date.now()) / 3600000).toFixed(1);
    safeLog('[cache] ' + n + ' ch · ' + spanH + 'h span · ' + aheadH + 'h ahead · plan=' + (c.plan || '?'));
    epgLoaded = true;
    if (!timeFresh || !contentFresh) { safeLog('[cache] stale — refetch'); return false; }
    return true;
  } catch (e) { return false; }
}
function clearCacheAndRefresh() {

  epgByChannelId = {}; epgLoaded = false;

/* ════════ ⭐ THREE-STATE PROGRAM LOOKUP ════════
   live      — strict window or ≤45 min overrun grace
   upcoming  — next program is in the future
   stale     — nothing live, nothing upcoming; last program ended long ago */
function getProgramState(progs, now) {
  if (!progs || !progs.length) return null;
  now = now || Date.now();

  var strict = null;
  for (var i = 0; i < progs.length; i++) { var p = progs[i]; if (p.s <= now && p.e > now) { if (!strict || p.s > strict.s) strict = p; } }
  if (strict) return { p: strict, s: strict.s, e: strict.e, state: 'live', stale: false };

  var grace = null;
  for (var g = 0; g < progs.length; g++) { var pg = progs[g]; if (pg.s <= now && pg.e <= now && (now - pg.e) < OVERRUN_GRACE_MS) { if (!grace || pg.e > grace.e) grace = pg; } }
  if (grace) return { p: grace, s: grace.s, e: grace.e, state: 'live', stale: false };

  var upcoming = null;
  for (var u = 0; u < progs.length; u++) {
    var pu = progs[u];
    if (pu.s > now && (!upcoming || pu.s < upcoming.s)) upcoming = pu;
  }
  if (upcoming) return { p: upcoming, s: upcoming.s, e: upcoming.e, state: 'upcoming', stale: false };

  var last = progs[progs.length - 1];
  return { p: last, s: last.s, e: last.e, state: 'stale', stale: true };
}
function getNextProgram(progs, current, now) {

  now = now || Date.now();
  var best = null;
  for (var i = 0; i < progs.length; i++) { var p = progs[i]; if (current && p === current) continue; if (p.s > now && (!best || p.s < best.s)) best = p; }
  return best;
}

  var id = ch.id;

  if (typeof id === 'string') { var n = parseInt(id, 10); if (!isNaN(n) && String(n) === id) return n; }

}
function progProgress(st) {
  if (!st || st.state !== 'live') return null;
  if (!(st.p.s <= Date.now() && st.p.e > Date.now())) return null;
  var total = st.e - st.s;
  if (total <= 0) return null;
  return Math.max(0, Math.min(100, ((Date.now() - st.s) / total) * 100));
}

function parseChannelJson(text) {

function channelMatches(ch, q, cat) {

/* ════════ FULL GUIDE — starts from today, falls back to all data only when today is empty ════════ */
function renderGuideTab(ch) {
  var progs = epgByChannelId[String(ch.id)] || [];
  if (!progs.length) { dBody.innerHTML = '<div class="msg" style="padding:30px">No guide data for this channel.</div>'; return; }
  var now = Date.now();
  var st = getProgramState(progs);
  var actualLive = st && st.state === 'live' ? st.p : null;

  var todayStart = new Date(); todayStart.setHours(0,0,0,0);
  var todayStartMs = todayStart.getTime();

  /* does this channel have ANY data today? */
  var hasToday = false;
  for (var h = 0; h < progs.length; h++) {
    if (progs[h].e > todayStartMs && progs[h].s < todayStartMs + 86400000) { hasToday = true; break; }
  }

  var rangeStartMs = hasToday ? todayStartMs : progs[0].s;
  var rangeEndMs = Math.max(todayStartMs + 3 * 86400000, progs[progs.length - 1].e + 86400000);

  var filtered = progs.filter(function(p){ return p.e > rangeStartMs && p.s < rangeEndMs; });
  if (!filtered.length) filtered = progs.slice(0, 60);

  var body = '';
  if (!hasToday) {
    var lastDate = formatDayLabel(progs[progs.length - 1].s);
    body += '<div class="stale-banner">⚠ No guide data for today — showing last known programs from ' + lastDate + '. Source is stale for this channel.</div>';
  }

  var lastDayKey = '';
  for (var i = 0; i < filtered.length; i++) {
    var p = filtered[i];
    var dayKey = new Date(p.s).toDateString();
    if (dayKey !== lastDayKey) { body += '<div class="timeline-day-header">' + formatDayLabel(p.s) + '</div>'; lastDayKey = dayKey; }
    var isLive = actualLive && actualLive === p;
    var isPast = p.e <= now;
    var cls = isLive ? ' live' : (isPast ? ' past' : '');
    var badge = isLive ? ' <span class="airing-tag">● AIRING</span>' : '';
    body += '<div class="timeline-row' + cls + '"><div class="timeline-time">' + formatRange(p.s, p.e) + '</div><div class="timeline-title">' + escapeHtml(p.t || 'No Title') + (p.ep ? ' <span style="color:#7cd0f5;font-size:11px">' + escapeHtml(p.ep) + '</span>' : '') + badge + '</div></div>';
  }
  dBody.innerHTML = body;
}

function computeEpgRange() {
  var oldest = Infinity, newest = 0;
  for (var id in epgByChannelId) {
    if (!epgByChannelId.hasOwnProperty(id)) continue;
    var progs = epgByChannelId[id];
    for (var i = 0; i < progs.length; i++) { if (progs[i].s < oldest) oldest = progs[i].s; if (progs[i].e > newest) newest = progs[i].e; }
  }
  return { oldest: oldest, newest: newest };
}
function countWithData() {
  var c = 0;

}
function countLive() {

}
function scheduleMidnightRefresh() {
  if (midnightTimer) clearTimeout(midnightTimer);
  var now = new Date();
  var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 2, 0);
  var delay = Math.max(60000, next.getTime() - now.getTime());
  midnightTimer = setTimeout(function() {
    safeLog('[epg] midnight rollover — refreshing');
    clearCacheAndRefresh();
    if (exhaustRetryTimer) clearTimeout(exhaustRetryTimer);
    exhaustRetryTimer = setTimeout(function checkStale() {
      var r = computeEpgRange();
      if (r.newest < Date.now() + 6 * 3600000) { clearCacheAndRefresh(); exhaustRetryTimer = setTimeout(checkStale, 30 * 60 * 1000); }
      else { scheduleMidnightRefresh(); }
    }, 30 * 60 * 1000);
  }, delay);
}
function loadEPG() {
  var t0 = Date.now();
  setEpgStatus('Loading guide (jioepg)…');
  fetchAndParseEPG().then(function(result) {
    if (result && Object.keys(result.data).length) {
      epgByChannelId = result.data; epgLoaded = true; saveCache();
      var range = computeEpgRange(), now = Date.now();
      var hoursTotal = ((range.newest - range.oldest) / 3600000).toFixed(1);
      var hoursAhead = ((range.newest - now) / 3600000).toFixed(1);
      safeLog('[epg] range: ' + new Date(range.oldest).toLocaleString() + ' → ' + new Date(range.newest).toLocaleString());
      safeLog('[epg] ' + hoursTotal + 'h span · ' + hoursAhead + 'h ahead');
      var elapsed = ((Date.now() - t0) / 1000).toFixed(1);
      var withData = countWithData(), live = countLive(), total = allChannels.length;
      var pct = Math.round((withData / total) * 100);
      var kind = pct >= 60 ? 'ok' : (pct >= 30 ? 'warn' : 'error');
      var endStr = new Date(range.newest).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
      setEpgStatus('Guide: ' + withData + '/' + total + ' ch (' + pct + '%) · ' + live + ' live · ends ' + endStr, kind);
      setTimeout(function(){ setEpgStatus(''); }, 12000);
      refreshAllCardsEpg();
      if (range.newest < now + 6 * 3600000) {
        if (exhaustRetryTimer) clearTimeout(exhaustRetryTimer);
        exhaustRetryTimer = setTimeout(function(){ clearCacheAndRefresh(); }, 15 * 60 * 1000);
      }
      scheduleMidnightRefresh();
    } else {
      setEpgStatus('Guide unavailable — channels only', 'error');
      setTimeout(function(){ setEpgStatus(''); }, 5000);
    }
  });
}

function loadChannels() {
  gridEl.innerHTML = '<div class="msg"><div class="spinner"></div><div>Loading channels & catalog…</div></div>';
  Promise.all([fetchStreamChannels(), fetchCatalogMeta()])
    .then(function(results) {
      var streams = results[0], catalog = results[1] || [];
      if (!streams || !streams.length) throw new Error('No channels');
      allChannels = mergeChannelMetadata(streams, catalog);
      displayedChannels = allChannels.slice();
      loadPrefs(); renderCategories();
      var cacheFresh = loadCache();
      renderAllCards(function() {
        if (cacheFresh) {
          refreshAllCardsEpg();
          var withData = countWithData(), live = countLive(), range = computeEpgRange();
          var hoursAhead = ((range.newest - Date.now()) / 3600000).toFixed(1);
          setEpgStatus('Cache: ' + withData + '/' + allChannels.length + ' ch · ' + live + ' live · ' + hoursAhead + 'h ahead');
          setTimeout(function(){ setEpgStatus(''); }, 6000);
          scheduleMidnightRefresh();
        } else loadEPG();
      });
      if (progressUpdateTimer) clearInterval(progressUpdateTimer);
      progressUpdateTimer = setInterval(function(){ refreshAllCardsEpg(); }, 30000);
    })
    .catch(function(e) {
      gridEl.innerHTML = '<div class="msg err">⚠️ Could not load channels.<br><div style="color:#888;font-size:12px;margin-top:10px">' + escapeHtml(e.message || '') + '</div><button onclick="location.reload()">Retry</button></div>';
    });
}

var searchTimer = null;
searchEl.addEventListener('input', function() { clearTimeout(searchTimer); searchTimer = setTimeout(function() { searchQuery = searchEl.value.trim().toLowerCase(); applyFilter(); wrapEl.scrollTop = 0; }, 150); });
sortSelect.addEventListener('change', function() { sortMode = sortSelect.value; savePrefs(); applyFilter(); });
viewBtn.addEventListener('click', function() { viewMode = viewMode === 'grid' ? 'compact' : 'grid'; updateViewBtn(); savePrefs(); var cards = gridEl.querySelectorAll('.card'); for (var i = 0; i < cards.length; i++) { if (viewMode === 'compact') cards[i].classList.add('compact'); else cards[i].classList.remove('compact'); } });
refreshBtn.addEventListener('click', function() { showToast('Refreshing guide…'); clearCacheAndRefresh(); });
helpBtn.addEventListener('click', function() { helpModal.classList.remove('hidden'); });
helpClose.addEventListener('click', function() { helpModal.classList.add('hidden'); });
dTabInfo.addEventListener('click', function(){ currentDetailTab = 'info'; dTabInfo.classList.add('active'); dTabGuide.classList.remove('active'); renderDetailBody(); });
dTabGuide.addEventListener('click', function(){ currentDetailTab = 'guide'; dTabGuide.classList.add('active'); dTabInfo.classList.remove('active'); renderDetailBody(); });
dClose.addEventListener('click', function(e){ e.preventDefault(); closeDetails(); });
dCancel.addEventListener('click', function(e){ e.preventDefault(); closeDetails(); });
dWatch.addEventListener('click', function(e){ e.preventDefault(); if (currentDetailChannel) openPlayer(currentDetailChannel); });
detailModal.addEventListener('click', function(e){ if (e.target === detailModal) closeDetails(); });

document.addEventListener('keydown', function(e) {
  var k = e.keyCode, focused = document.activeElement;
  var inDetail = !detailModal.classList.contains('hidden'), inHelp = !helpModal.classList.contains('hidden'), inSearch = focused === searchEl;
  if (inHelp) { if (k === 27 || k === 13) { e.preventDefault(); helpModal.classList.add('hidden'); } return; }
  if (inDetail) { if (k === 27 || k === 8) { e.preventDefault(); closeDetails(); } return; }
  if (k === 191 && !inSearch) { e.preventDefault(); helpModal.classList.remove('hidden'); return; }
  if (k === 82 && !inSearch && !chNumBuffer) { e.preventDefault(); refreshBtn.click(); return; }
  if (k === 83 && !inSearch && !chNumBuffer) { e.preventDefault(); searchEl.focus(); return; }
  if (k === 70 && focused && focused.classList && focused.classList.contains('card')) { e.preventDefault(); var favId = focused.getAttribute('data-chid'); if (favId) toggleFavorite(favId); return; }
  var isNumKey = (k >= 48 && k <= 57) || (k >= 96 && k <= 105);
  if (isNumKey && !inSearch) { e.preventDefault(); handleChNumDigit(String.fromCharCode(k >= 96 ? k - 48 : k)); return; }
  if (k === 13 && chNumBuffer) { e.preventDefault(); clearTimeout(chNumTimer); commitChNum(); return; }
  if ((k === 27 || k === 8) && chNumBuffer) { e.preventDefault(); cancelChNum(); return; }
  if (focused && focused.classList && focused.classList.contains('card')) {
    var visible = gridEl.querySelectorAll('.card'), cardIdx = Array.prototype.indexOf.call(visible, focused);
    if (k === 37 && cardIdx > 0) { visible[cardIdx - 1].focus(); e.preventDefault(); }
    else if (k === 39 && cardIdx < visible.length - 1) { visible[cardIdx + 1].focus(); e.preventDefault(); }
    else if (k === 13) { e.preventDefault(); var chid = focused.getAttribute('data-chid'); for (var fi = 0; fi < displayedChannels.length; fi++) if (String(displayedChannels[fi].id) === chid) { openDetails(displayedChannels[fi]); return; } }
  }
});

function boot() { loadChannels(); }
if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 0);
else document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
