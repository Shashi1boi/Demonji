<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>flexji · player</title>
  
  <!-- Aggressively preconnect to the streaming provider -->
  <link rel="preconnect" href="https://vidsync.pro" crossorigin />
  <link rel="dns-prefetch" href="https://vidsync.pro" />

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,system-ui,sans-serif; }
    html, body { height:100%; background:#000; overflow:hidden; color:#fff; width:100%; }

    #shell {
      position:fixed; inset:0; background:#000;
      user-select:none; outline:none; overflow:hidden;
    }

    /* Hardware acceleration for older Tizen (2015-2017) */
    #embedFrame {
      position:absolute; inset:0;
      width:100%; height:100%;
      border:0; background:#000;
      z-index:1;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      will-change: transform;
    }

    /* ---- Top overlay ---- */
    .top-bar {
      position:absolute; top:0; left:0; right:0;
      padding:18px 24px 40px;
      display:flex; align-items:flex-start; justify-content:space-between;
      background:linear-gradient(180deg, rgba(0,0,0,.9) 0%, transparent 100%);
      z-index:10;
      transition:opacity .3s ease, transform .3s ease;
      pointer-events:none;
    }
    .top-bar > * { pointer-events:auto; }
    #shell.hide-ui .top-bar { opacity:0; transform:translateY(-8px); pointer-events:none; }

    .info { max-width:70%; flex:1; }
    .brand { color:#e50914; font-weight:800; font-size:1.15rem; letter-spacing:-0.4px; margin-bottom:6px; }
    .info h1 { font-size:1.7rem; font-weight:700; line-height:1.2; margin-bottom:3px; text-shadow:0 2px 14px rgba(0,0,0,.9); }
    .info p { color:#bbb; font-size:.88rem; }

    .icon-btn {
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
      color:#fff; border-radius:8px; cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center;
      width:42px; height:42px; flex-shrink:0;
      transition:background .15s, transform .1s;
    }
    .icon-btn:hover, .icon-btn:focus { background:rgba(255,255,255,.22); outline:2px solid #e50914; }
    .icon-btn svg { width:20px; height:20px; fill:currentColor; }

    .close-btn { width:46px; height:46px; border-radius:50%; background:rgba(0,0,0,.55); margin-left:14px; }
    .close-btn:hover, .close-btn:focus { background:#e50914; border-color:#e50914; }

    /* ---- Loading state (Optimized for speed) ---- */
    .loading-screen {
      position:absolute; inset:0; z-index:20;
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; text-align:center; padding:24px;
      background:rgba(10,10,10,0.9); /* Semi-transparent to reveal player faster */
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      transition:opacity .2s ease;
    }
    .loading-screen.hidden { opacity:0; pointer-events:none; }
    .spinner {
      width:56px; height:56px; border:4px solid rgba(255,255,255,.15);
      border-top-color:#e50914; border-radius:50%;
      -webkit-animation:spin 1s linear infinite;
      animation:spin 1s linear infinite;
    }
    .loading-screen p { margin-top:20px; color:#bbb; font-size:.95rem; }
    
    @-webkit-keyframes spin { to { -webkit-transform:rotate(360deg); } }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ---- Error state ---- */
    .error-screen {
      position:absolute; inset:0; z-index:21;
      display:none; align-items:center; justify-content:center;
      flex-direction:column; background:#0a0a0a; text-align:center; padding:24px;
    }
    .error-screen.active { display:flex; }
    .retry-btn { background:#e50914; border:none; color:#fff; padding:11px 26px; border-radius:8px; font-weight:600; cursor:pointer; }
    .retry-btn:hover, .retry-btn:focus { background:#f6121d; outline:2px solid #fff; }

    .toast {
      position:absolute; left:50%; bottom:100px;
      transform:translateX(-50%) translateY(10px);
      background:rgba(0,0,0,.88); color:#fff; padding:10px 20px; border-radius:24px;
      font-size:.85rem; font-weight:600; opacity:0; pointer-events:none; z-index:18;
      transition:opacity .22s, transform .22s;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    @media (max-width:640px) {
      .top-bar { padding:12px 14px 30px; }
      .info h1 { font-size:1.15rem; }
      .close-btn { width:40px; height:40px; }
    }
  </style>
</head>
<body>

<div id="shell" tabindex="0">
  <iframe
    id="embedFrame"
    src="about:blank"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    allowtransparency="true"
    referrerpolicy="origin"
    scrolling="no"
    frameborder="0"
  ></iframe>

  <div class="top-bar" id="topBar">
    <div class="info">
      <div class="brand">flexji</div>
      <h1 id="title">Loading…</h1>
      <p id="subtitle"></p>
    </div>
    <button class="icon-btn close-btn" id="closeBtn" title="Close (Esc/Return)" aria-label="Close player">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <p id="loadingText">Connecting to stream…</p>
  </div>

  <div class="error-screen" id="errorScreen">
    <p id="errorText">The player could not be loaded.</p>
    <button class="retry-btn" id="retryBtn">Retry</button>
  </div>
  <div class="toast" id="toast"><span id="toastText"></span></div>
</div>

<script>
(function() {
  'use strict';
  
  // Tizen 2015-2017 specific TV Key Codes
  var TIZEN_KEYS = {
    RETURN: 10009,
    PLAY: 415,
    PAUSE: 19,
    STOP: 413,
    FF: 417,
    RW: 412,
    ENTER: 13
  };

  // ===================== PARAMS =====================
  function getQueryParam(name) {
    var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
    var results = regex.exec(window.location.href);
    if (!results || !results[2]) return '';
    return decodeURIComponent(results[2].replace(/\+/g, ' '));
  }

  var type = getQueryParam('type') || 'movie';
  var tmdbId = getQueryParam('id');
  var season = parseInt(getQueryParam('season') || '1', 10);
  var episode = parseInt(getQueryParam('episode') || '1', 10);
  var title = getQueryParam('title') || 'Untitled';
  var year = getQueryParam('year') || '';
  var savedTime = parseFloat(getQueryParam('t') || '0');

  // ===================== DOM =====================
  var shell = document.getElementById('shell');
  var embedFrame = document.getElementById('embedFrame');
  var titleEl = document.getElementById('title');
  var subtitleEl = document.getElementById('subtitle');
  var loadingScreen = document.getElementById('loadingScreen');
  var errorScreen = document.getElementById('errorScreen');
  var closeBtn = document.getElementById('closeBtn');
  var toastEl = document.getElementById('toast');
  var toastText = document.getElementById('toastText');

  var hideTimer = null, toastTimer = null, loadWatchdog = null;

  titleEl.textContent = title.replace(/\s*[·•\-]\s*S\d+\s*E\d+\s*$/i, '').trim();
  subtitleEl.textContent = year;
  document.title = title + ' · flexji';

  function showToast(msg) {
    toastText.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 2500);
  }

  function hideLoading() {
    loadingScreen.classList.add('hidden');
    clearTimeout(loadWatchdog);
  }

  // ===================== LOAD PLAYER =====================
  function loadPlayer() {
    errorScreen.classList.remove('active');
    loadingScreen.classList.remove('hidden');

    var base = type === 'tv' 
      ? 'https://vidsync.pro/embed/tv/' + tmdbId + '/' + season + '/' + episode
      : 'https://vidsync.pro/embed/movie/' + tmdbId;

    var params = ['primarycolor=e50914', 'secondarycolor=f6121d', 'autoplay=1'];
    if (savedTime > 0) params.push('t=' + Math.floor(savedTime));
    
    embedFrame.src = base + '?' + params.join('&');

    // Watchdog for entirely dead connections
    clearTimeout(loadWatchdog);
    loadWatchdog = setTimeout(function() {
      if (!loadingScreen.classList.contains('hidden')) {
        errorScreen.classList.add('active');
      }
    }, 25000); // Reduced from 45s to 25s
  }

  // OPTIMIZATION: Hide our loading screen IMMEDIATELY when the iframe network request finishes.
  // This lets the user see VidSync's native UI instantly rather than waiting an arbitrary 4-6 seconds.
  embedFrame.addEventListener('load', function() {
    hideLoading();
  });

  embedFrame.addEventListener('error', function() {
    hideLoading();
    errorScreen.classList.add('active');
  });

  // ===================== IFRAME MESSAGES =====================
  window.addEventListener('message', function(ev) {
    if (!ev || !ev.data) return;
    var data = typeof ev.data === 'string' ? (function(){ try { return JSON.parse(ev.data); } catch(e){ return {}; } })() : ev.data;
    var evtType = (data.type || data.event || '').toString().toLowerCase();

    if (evtType === 'playing' || evtType === 'ready') hideLoading();

    // Save progress locally (Compatible with ES5 JSON parsing)
    if (evtType === 'timeupdate' || evtType === 'progress') {
      var cur = parseFloat(data.currentTime || 0), dur = parseFloat(data.duration || 0);
      if (cur > 5 && dur > 0) {
        try {
          var store = JSON.parse(localStorage.getItem('flexji_progress') || '{}');
          var key = type === 'tv' ? (tmdbId + '_' + season + '_' + episode) : String(tmdbId);
          store[key] = { tmdbId: tmdbId, type: type, season: season, episode: episode, currentTime: cur, duration: dur, timestamp: Date.now() };
          localStorage.setItem('flexji_progress', JSON.stringify(store));
        } catch(e) {}
      }
    }
  }, false);

  // ===================== UI / CONTROLS =====================
  function showControls() {
    shell.classList.remove('hide-ui');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function() { shell.classList.add('hide-ui'); }, 3000);
  }

  // Throttle mousemove slightly for older TVs
  var lastMove = 0;
  document.addEventListener('mousemove', function() {
    var now = Date.now();
    if (now - lastMove > 100) { showControls(); lastMove = now; }
  });
  document.addEventListener('touchstart', showControls, { passive: true });

  function closePlayer() {
    window.close();
    setTimeout(function() { if (!window.closed) location.href = 'flexji.html'; }, 100);
  }
  closeBtn.addEventListener('click', closePlayer);
  document.getElementById('retryBtn').addEventListener('click', loadPlayer);

  // ===================== REMOTE / KEYBOARD =====================
  document.addEventListener('keydown', function(e) {
    showControls();
    var k = e.keyCode;

    // Esc (PC) or Return/Back (Tizen TV)
    if (k === 27 || k === TIZEN_KEYS.RETURN) {
      e.preventDefault();
      closePlayer();
    }
    
    // Tizen TV Media Remote Buttons 
    if (k === TIZEN_KEYS.PLAY || k === TIZEN_KEYS.PAUSE) {
      try { embedFrame.contentWindow.postMessage({ type: k === TIZEN_KEYS.PLAY ? 'play' : 'pause' }, '*'); } catch(err){}
    }
    
    // Tizen D-Pad navigation for UI overlays
    if (k === TIZEN_KEYS.ENTER && document.activeElement && document.activeElement.tagName === 'BUTTON') {
      document.activeElement.click();
    }
  });

  if (tmdbId) loadPlayer();
  else { hideLoading(); errorScreen.classList.add('active'); }
  
  shell.focus();

})();
</script>
</body>
</html>
