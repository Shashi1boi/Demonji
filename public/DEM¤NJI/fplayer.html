<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>flexji · player</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<script>
  (function() {
    var q = window.location.search || '';
    var um = q.match(/[?&]url=([^&]+)/);
    window.__flexjiUrl = um ? decodeURIComponent(um[1]) : null;
    window.__flexjiIsTizen = /Tizen|SMART-TV|SamsungBrowser/i.test(navigator.userAgent);
    var probe = document.createElement('video');
    window.__flexjiHasNativeHls = !!probe.canPlayType('application/vnd.apple.mpegurl');
    if (!window.__flexjiHasNativeHls) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
      s.async = true;
      document.head.appendChild(s);
    }
  })();
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,system-ui,sans-serif}
  html,body{height:100%;background:#000;overflow:hidden;color:#fff;width:100%}
  #shell{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;user-select:none;outline:none}
  #shell.hide-ui{cursor:none}
  #video{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:#000;object-fit:contain}

  .grad{position:absolute;left:0;right:0;pointer-events:none;z-index:5;transition:opacity .25s}
  .grad.top{top:0;height:180px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent)}
  .grad.bottom{bottom:0;height:220px;background:linear-gradient(0deg,rgba(0,0,0,.90),transparent)}
  #shell.hide-ui .grad{opacity:0}

  .top-bar{position:absolute;top:0;left:0;right:0;width:100%;padding:22px 32px;display:flex;justify-content:space-between;align-items:flex-start;z-index:10;transition:opacity .25s}
  #shell.hide-ui .top-bar{opacity:0;pointer-events:none}
  .top-bar .info{max-width:70%;flex:1}
  .top-bar .brand{color:#e50914;font-weight:800;font-size:1.3rem;letter-spacing:-.5px;margin-bottom:8px}
  .top-bar h1{font-size:1.8rem;font-weight:700;line-height:1.2;margin-bottom:4px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .top-bar p{color:#ccc;font-size:.9rem}

  .icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s,transform .12s;padding:0}
  .icon-btn:hover,.icon-btn:focus{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4);outline:none}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn svg{width:22px;height:22px;fill:currentColor;display:block}
  .close-btn{width:46px;height:46px;border-radius:50%;flex-shrink:0;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);margin-left:15px}
  .close-btn svg{width:22px;height:22px}
  .close-btn:hover{background:#e50914;border-color:#e50914}

  .paused-screen{position:absolute;inset:0;display:none;z-index:8;overflow:hidden}
  .paused-screen.active{display:block}
  .ps-bg{position:absolute;top:-60px;left:-60px;right:-60px;bottom:-60px;background-size:cover;background-position:center;filter:blur(50px) brightness(.35) saturate(1.2);transform:scale(1.15)}
  .ps-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 15%,rgba(0,0,0,.75) 100%)}
  .ps-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:60px 24px 120px}
  .ps-poster-wrap{display:flex;justify-content:center}
  .ps-poster-wrap.hidden{display:none}
  .ps-poster{max-height:44vh;max-width:min(70vw,340px);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08);object-fit:contain;display:block;background:#111}
  .ps-meta{max-width:80vw}
  .ps-title{font-size:2.4rem;font-weight:800;line-height:1.15;letter-spacing:-.5px;text-shadow:0 4px 24px rgba(0,0,0,.9);margin-bottom:8px}
  .ps-sub{color:#ccc;font-size:1.05rem;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  .ps-play-btn{width:88px;height:88px;border-radius:50%;background:#e50914;border:none;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(229,9,20,.55),0 8px 24px rgba(0,0,0,.5);transition:transform .15s,box-shadow .15s,background .15s}
  .ps-play-btn:hover{background:#f6121d;transform:scale(1.06);box-shadow:0 0 60px rgba(229,9,20,.85),0 8px 24px rgba(0,0,0,.6)}
  .ps-play-btn svg{width:38px;height:38px;fill:#fff;margin-left:5px}
  .ps-hint{color:#888;font-size:.85rem;margin-top:6px;letter-spacing:.3px}

  .buffering{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:9}
  .buffering.show{display:flex}
  .spinner{width:52px;height:52px;border:4px solid rgba(255,255,255,.15);border-top-color:#e50914;border-radius:50%;animation:spin 1s linear infinite}
  .spinner.big{width:64px;height:64px;border-width:5px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .loading-screen,.error-screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0a0a0a;z-index:22;text-align:center;padding:24px}
  .loading-screen{display:flex}
  .loading-screen p{margin-top:20px;color:#bbb;font-size:1rem}
  .error-screen .err-icon{width:64px;height:64px;color:#e50914;margin-bottom:20px}
  .error-screen .err-icon svg{width:100%;height:100%;fill:currentColor}
  .error-screen p{color:#ddd;margin-bottom:24px;font-size:1.05rem;max-width:500px}
  .error-screen .retry-btn{background:#e50914;border:none;color:#fff;padding:11px 26px;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s}
  .error-screen .retry-btn:hover{background:#f6121d}
  .error-screen .retry-btn svg{width:18px;height:18px;fill:currentColor}

  .bottom-controls{position:absolute;left:0;right:0;bottom:0;width:100%;padding:0 32px 22px;z-index:10;transition:opacity .25s,transform .25s}
  #shell.hide-ui .bottom-controls{opacity:0;transform:translateY(20px);pointer-events:none}
  .progress-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .seekbar-wrap{position:relative;flex:1;height:16px;display:flex;align-items:center;cursor:pointer}
  .seekbar-bg,.seekbar-buffered,.seekbar-played{position:absolute;left:0;height:4px;border-radius:2px;pointer-events:none;top:50%;transform:translateY(-50%)}
  .seekbar-bg{right:0;background:rgba(255,255,255,.22)}
  .seekbar-buffered{width:0;background:#fff;opacity:.6;z-index:1}
  .seekbar-played{width:0;background:#e50914;z-index:2}
  .seekbar{position:relative;z-index:3;width:100%;height:16px;-webkit-appearance:none;appearance:none;background:transparent;outline:none;cursor:pointer;margin:0;padding:0}
  .seekbar::-webkit-slider-runnable-track{height:16px;background:transparent}
  .seekbar::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#e50914;box-shadow:0 0 0 3px rgba(0,0,0,.4);margin-top:1px;transition:transform .12s}
  .seekbar:hover::-webkit-slider-thumb,.seekbar:focus::-webkit-slider-thumb{transform:scale(1.4)}
  .time{font-size:.85rem;color:#ddd;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:100px;text-align:right}
  .buttons-row{display:flex;align-items:center;gap:6px}
  .buttons-row .icon-btn{width:42px;height:42px;background:transparent;border:none}
  .buttons-row .icon-btn:hover,.buttons-row .icon-btn:focus{background:rgba(255,255,255,.14)}
  .buttons-row .icon-btn.play-pause{width:46px;height:46px}
  .buttons-row .icon-btn.play-pause svg{width:26px;height:26px}
  .buttons-row .icon-btn.small svg{width:20px;height:20px}
  .volume-slider{-webkit-appearance:none;appearance:none;width:90px;height:4px;background:rgba(255,255,255,.28);border-radius:2px;outline:none;margin:0 8px 0 4px}
  .volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer}
  .spacer{flex:1}

  .toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:24px;font-size:.88rem;font-weight:600;border:1px solid rgba(255,255,255,.12);opacity:0;pointer-events:none;z-index:18;transition:opacity .22s,transform .22s;backdrop-filter:blur(8px);letter-spacing:.2px;display:inline-flex;align-items:center;gap:8px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .tick{color:#4ade80;font-weight:800;font-size:1rem}

  @media(max-width:640px){
    .top-bar{padding:14px 16px}
    .top-bar h1{font-size:1.15rem}
    .top-bar .brand{font-size:1rem;margin-bottom:4px}
    .top-bar p{font-size:.78rem}
    .ps-title{font-size:1.55rem}
    .ps-sub{font-size:.9rem}
    .ps-poster{max-height:32vh}
    .ps-play-btn{width:72px;height:72px}
    .ps-play-btn svg{width:30px;height:30px}
    .ps-hint{display:none}
    .bottom-controls{padding:0 14px 16px}
    .volume-slider{width:0;display:none}
    .time{min-width:auto;font-size:.78rem}
    .buttons-row .icon-btn{width:38px;height:38px}
    .buttons-row .icon-btn.play-pause{width:42px;height:42px}
    .buttons-row .icon-btn.small{display:none}
    .close-btn{width:40px;height:40px}
    .toast{bottom:100px;font-size:.8rem;padding:8px 16px}
  }
</style>
</head>
<body>

<div id="shell" tabindex="0">
  <video id="video" playsinline preload="auto"></video>
  <div class="grad top"></div>
  <div class="grad bottom"></div>

  <div class="top-bar">
    <div class="info">
      <div class="brand">flexji</div>
      <h1 id="title">Loading…</h1>
      <p id="subtitle"></p>
    </div>
    <button class="icon-btn close-btn" id="closeBtn" title="Close (Esc)">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div class="paused-screen" id="pausedScreen">
    <div class="ps-bg" id="psBg"></div>
    <div class="ps-vignette"></div>
    <div class="ps-content">
      <div class="ps-poster-wrap" id="psPosterWrap">
        <img id="psPoster" class="ps-poster" alt="" />
      </div>
      <div class="ps-meta">
        <h2 class="ps-title" id="psTitle"></h2>
        <p class="ps-sub" id="psSub"></p>
      </div>
      <button class="ps-play-btn" id="psPlayBtn" title="Resume (Space)">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <p class="ps-hint">Press Space to resume</p>
    </div>
  </div>

  <div class="buffering" id="buffering">
    <div class="spinner"></div>
  </div>

  <div class="loading-screen" id="loadingScreen">
    <div class="spinner big"></div>
    <p id="loadingText">Loading stream…</p>
  </div>
  <div class="error-screen" id="errorScreen">
    <div class="err-icon">
      <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
    </div>
    <p id="errorText">Playback error</p>
    <button class="retry-btn" id="retryBtn">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Retry
    </button>
  </div>

  <div class="toast" id="toast"><span class="tick">✓</span><span id="toastText"></span></div>

  <div class="bottom-controls">
    <div class="progress-row">
      <div class="seekbar-wrap">
        <div class="seekbar-bg"></div>
        <div class="seekbar-buffered" id="seekBuffered"></div>
        <div class="seekbar-played" id="seekPlayed"></div>
        <input type="range" id="seekbar" class="seekbar" min="0" max="1000" value="0" step="1" />
      </div>
      <div class="time"><span id="currentTime">0:00</span> / <span id="duration">0:00</span></div>
    </div>
    <div class="buttons-row">
      <button class="icon-btn play-pause" id="playPause" title="Play / Pause (Space)">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn small" id="rewindBtn" title="Rewind 10s (←)">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
      <button class="icon-btn small" id="forwardBtn" title="Forward 10s (→)">
        <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
      </button>
      <button class="icon-btn" id="volBtn" title="Mute (M)">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <input type="range" class="volume-slider" id="volume" min="0" max="100" value="100" />
      <div class="spacer"></div>
      <button class="icon-btn" id="fullscreenBtn" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  function getQueryParam(name) {
    var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
    var results = regex.exec(window.location.href);
    if (!results) return null;
    if (!results[2]) return '';
    return decodeURIComponent(results[2].replace(/\+/g, ' '));
  }

  var streamUrl = getQueryParam('url');
  var type = getQueryParam('type') || 'movie';
  var itemId = getQueryParam('id') || '';
  var season = parseInt(getQueryParam('season') || '0', 10);
  var episode = parseInt(getQueryParam('episode') || '0', 10);
  var title = getQueryParam('title') || '';
  var year = getQueryParam('year') || '';
  var posterUrl = getQueryParam('poster') || '';
  var bgUrl = getQueryParam('bg') || '';
  var savedTime = parseFloat(getQueryParam('t') || '0');
  var streamTitle = getQueryParam('streamTitle') || '';

  var isTizen = window.__flexjiIsTizen || /Tizen|SMART-TV|SamsungBrowser/i.test(navigator.userAgent);

  var shell = document.getElementById('shell');
  var video = document.getElementById('video');
  var titleEl = document.getElementById('title');
  var subtitleEl = document.getElementById('subtitle');
  var pausedScreen = document.getElementById('pausedScreen');
  var psBg = document.getElementById('psBg');
  var psPosterWrap = document.getElementById('psPosterWrap');
  var psPoster = document.getElementById('psPoster');
  var psTitle = document.getElementById('psTitle');
  var psSub = document.getElementById('psSub');
  var psPlayBtn = document.getElementById('psPlayBtn');
  var buffering = document.getElementById('buffering');
  var loadingScreen = document.getElementById('loadingScreen');
  var loadingText = document.getElementById('loadingText');
  var errorScreen = document.getElementById('errorScreen');
  var errorText = document.getElementById('errorText');
  var retryBtn = document.getElementById('retryBtn');
  var toastEl = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var playPauseBtn = document.getElementById('playPause');
  var rewindBtn = document.getElementById('rewindBtn');
  var forwardBtn = document.getElementById('forwardBtn');
  var seekbar = document.getElementById('seekbar');
  var seekPlayed = document.getElementById('seekPlayed');
  var seekBuffered = document.getElementById('seekBuffered');
  var currentTimeEl = document.getElementById('currentTime');
  var durationEl = document.getElementById('duration');
  var volBtn = document.getElementById('volBtn');
  var volumeSlider = document.getElementById('volume');
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var closeBtn = document.getElementById('closeBtn');

  var displayTitle = title || 'Untitled';
  var displaySub = streamTitle || (year || '');
  if (type === 'series' && season > 0 && episode > 0) {
    displayTitle = title.replace(/\s*·\s*S\d+E\d+\s*$/i, '');
    displaySub = 'S' + pad2(season) + 'E' + pad2(episode) + (streamTitle ? ' · ' + streamTitle : '');
  }

  titleEl.textContent = displayTitle;
  subtitleEl.textContent = displaySub;
  psTitle.textContent = displayTitle;
  psSub.textContent = displaySub;
  document.title = displayTitle + ' · flexji';

  if (posterUrl) {
    psBg.style.backgroundImage = 'url("' + (bgUrl || posterUrl) + '")';
    psPoster.src = posterUrl;
    psPoster.onerror = function() { psPosterWrap.classList.add('hidden'); };
  } else {
    psPosterWrap.classList.add('hidden');
    psBg.style.background = 'radial-gradient(ellipse at center,#1a1a1a 0%,#000 100%)';
  }

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  var hlsInstance = null;
  var hideTimer = null;
  var toastTimer = null;
  var userInitiatedPause = false;
  var timeRestored = false;
  var firstPlaybackStarted = false;
  var stallWatchTimer = null;
  var stallLastTime = 0;
  var stallTicks = 0;
  var stallSuppressed = false;

  function showToast(msg) {
    toastText.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 1800);
  }

  function progressKey() {
    return 'flexji_progress_' + type + '_' + itemId + (type === 'series' && season ? '_' + season + '_' + episode : '');
  }
  function saveProgress() {
    if (!video.duration || video.currentTime < 5) return;
    try {
      localStorage.setItem(progressKey(), JSON.stringify({
        id: itemId, type: type, season: season, episode: episode,
        currentTime: video.currentTime, duration: video.duration,
        title: title, timestamp: Date.now()
      }));
    } catch(e) {}
  }

  function startPlayback() {
    if (!streamUrl) {
      showError('No stream URL provided.');
      return;
    }
    if (hlsInstance) { try { hlsInstance.destroy(); } catch(e) {} hlsInstance = null; }
    try { video.pause(); video.removeAttribute('src'); video.load(); } catch(e) {}

    showLoading('Loading stream…');
    hideError();

    var isHls = /\.m3u8(\?|$)/i.test(streamUrl) || streamUrl.indexOf('.m3u8') !== -1;
    var canNative = video.canPlayType('application/vnd.apple.mpegurl');

    if (isHls && canNative) {
      video.src = streamUrl;
      tryPlay();
      return;
    }

    if (isHls) {
      waitForHls(function(ok) {
        if (!ok || !Hls.isSupported()) {
          if (canNative) { video.src = streamUrl; tryPlay(); return; }
          showError('HLS player not available.');
          return;
        }
        startHlsJs(streamUrl);
      });
      return;
    }

    // Non-HLS (MP4, etc.)
    video.src = streamUrl;
    tryPlay();
  }

  function waitForHls(callback) {
    if (typeof Hls !== 'undefined') return callback(true);
    var start = Date.now();
    var timer = setInterval(function() {
      if (typeof Hls !== 'undefined') { clearInterval(timer); callback(true); }
      else if (Date.now() - start > 8000) { clearInterval(timer); callback(false); }
    }, 100);
  }

  function startHlsJs(url) {
    var hlsConfig = {
      autoStartLoad: true,
      startLevel: -1,
      testBandwidth: false,
      abrEwmaDefaultEstimate: isTizen ? 1000000 : 800000,
      maxBufferLength: isTizen ? 60 : 45,
      maxMaxBufferLength: isTizen ? 120 : 90,
      maxBufferSize: isTizen ? (60 * 1000 * 1000) : (90 * 1000 * 1000),
      backBufferLength: isTizen ? -1 : 30,
      manifestLoadingTimeOut: isTizen ? 30000 : 20000,
      manifestLoadingMaxRetry: isTizen ? 6 : 4,
      levelLoadingTimeOut: isTizen ? 20000 : 15000,
      levelLoadingMaxRetry: isTizen ? 4 : 3,
      fragLoadingTimeOut: isTizen ? 30000 : 25000,
      fragLoadingMaxRetry: isTizen ? 8 : 6,
      highBufferWatchdogPeriod: 3,
      nudgeMaxRetry: 6,
      enableWorker: !isTizen,
      lowLatencyMode: false
    };

    hlsInstance = new Hls(hlsConfig);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() { tryPlay(); });
    hlsInstance.on(Hls.Events.ERROR, function(evt, data) {
      if (!data || !data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        hlsInstance.startLoad();
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hlsInstance.recoverMediaError();
      } else {
        try { hlsInstance.destroy(); } catch(e) {}
        hlsInstance = null;
        showError('Stream error. Try another stream.');
      }
    });
    try {
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(video);
    } catch (e) {
      showError('Could not initialise player.');
    }
  }

  function tryPlay() {
    var attempts = 0;
    var playingFired = false;
    var finalWatchdog = null;

    function onPlaying() {
      playingFired = true;
      if (finalWatchdog) { clearTimeout(finalWatchdog); finalWatchdog = null; }
      video.removeEventListener('playing', onPlaying);
    }
    video.addEventListener('playing', onPlaying);

    finalWatchdog = setTimeout(function() {
      if (playingFired || firstPlaybackStarted) return;
      video.removeEventListener('playing', onPlaying);
      hideLoading();
      buffering.classList.remove('show');
      showError('Stream is taking too long. Please retry.');
    }, 60000);

    function cleanup() {
      video.removeEventListener('playing', onPlaying);
      if (finalWatchdog) { clearTimeout(finalWatchdog); finalWatchdog = null; }
    }

    function doPlay() {
      if (playingFired) { cleanup(); return; }
      attempts++;
      var p = video.play();
      if (!p || !p.then) return;
      p.then(function() {
        setTimeout(function() {
          if (playingFired || video.paused) return;
          if (attempts < 150) doPlay();
        }, 5000);
      }).catch(function(e) {
        if (playingFired) { cleanup(); return; }
        if (e && e.name === 'AbortError') { cleanup(); return; }
        if (attempts < 150) { setTimeout(doPlay, 400); return; }
        cleanup();
        hideLoading();
        buffering.classList.remove('show');
        if (e && e.name === 'NotAllowedError') showPausedScreen();
        else showError('Playback failed. ' + (e && e.name || ''));
      });
    }
    doPlay();
  }

  function startStallWatch() {
    stopStallWatch();
    if (!firstPlaybackStarted) return;
    stallLastTime = video.currentTime;
    stallTicks = 0;
    stallWatchTimer = setInterval(function() {
      if (stallSuppressed) return;
      if (video.paused || video.ended) { stallLastTime = video.currentTime; stallTicks = 0; buffering.classList.remove('show'); return; }
      if (video.currentTime > stallLastTime + 0.1) { stallLastTime = video.currentTime; stallTicks = 0; buffering.classList.remove('show'); return; }
      stallTicks++;
      buffering.classList.add('show');
      if (stallTicks === 4) { try { video.currentTime = video.currentTime + 0.8; } catch(e) {} video.play().catch(function(){}); }
      if (stallTicks === 8) { reloadInPlace(); }
      if (stallTicks >= 60) { stopStallWatch(); showError('Playback stuck. Please retry.'); }
    }, 500);
  }

  function stopStallWatch() {
    if (stallWatchTimer) { clearInterval(stallWatchTimer); stallWatchTimer = null; }
    buffering.classList.remove('show');
  }

  function reloadInPlace() {
    var t = video.currentTime;
    var src = video.currentSrc || video.src;
    if (!src || !isFinite(t) || t < 0) return;
    showToast('Recovering…');
    stallSuppressed = true;
    stopStallWatch();
    savedTime = 0;
    timeRestored = true;
    firstPlaybackStarted = false;
    try { video.pause(); } catch(e) {}
    try { video.removeAttribute('src'); video.load(); } catch(e) {}
    var recovered = false;
    var onMeta = function() {
      if (recovered) return;
      recovered = true;
      video.removeEventListener('loadedmetadata', onMeta);
      try { video.currentTime = t; } catch(e) {}
      setTimeout(function() { stallSuppressed = false; stallLastTime = t; stallTicks = 0; tryPlay(); }, 200);
    };
    video.addEventListener('loadedmetadata', onMeta);
    video.src = src;
    setTimeout(function() {
      if (!recovered) {
        recovered = true;
        video.removeEventListener('loadedmetadata', onMeta);
        stallSuppressed = false;
        stopStallWatch();
        showError('Playback stuck. Please retry.');
      }
    }, 30000);
  }

  function togglePlay() {
    if (video.paused || video.ended) {
      if (video.ended) video.currentTime = 0;
      userInitiatedPause = false;
      tryPlay();
    } else {
      userInitiatedPause = true;
      video.pause();
    }
  }
  function userPlay() {
    if (video.ended) video.currentTime = 0;
    userInitiatedPause = false;
    tryPlay();
  }

  function updatePlayPauseBtn() {
    if (video.paused || video.ended) {
      playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
      playPauseBtn.title = 'Play (Space)';
    } else {
      playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
      playPauseBtn.title = 'Pause (Space)';
    }
  }

  function showPausedScreen() {
    buffering.classList.remove('show');
    pausedScreen.classList.add('active');
    showControls();
  }
  function hidePausedScreen() { pausedScreen.classList.remove('active'); }

  video.addEventListener('play', function() { hidePausedScreen(); updatePlayPauseBtn(); scheduleHide(); });
  video.addEventListener('pause', function() {
    if (!video.ended && userInitiatedPause) showPausedScreen();
    userInitiatedPause = false;
    updatePlayPauseBtn();
    showControls();
    stopStallWatch();
  });
  video.addEventListener('ended', function() { showPausedScreen(); updatePlayPauseBtn(); showControls(); stopStallWatch(); });
  video.addEventListener('waiting', function() { if (firstPlaybackStarted) buffering.classList.add('show'); });
  video.addEventListener('playing', function() {
    buffering.classList.remove('show');
    if (!firstPlaybackStarted) { firstPlaybackStarted = true; hideLoading(); }
    startStallWatch();
  });
  video.addEventListener('canplay', function() { buffering.classList.remove('show'); });
  video.addEventListener('timeupdate', function() {
    if (!firstPlaybackStarted && video.currentTime > 0 && !video.paused) {
      firstPlaybackStarted = true;
      hideLoading();
      buffering.classList.remove('show');
      startStallWatch();
    }
    updateProgress();
    saveProgress();
  });
  video.addEventListener('loadedmetadata', function() {
    if (savedTime > 0 && !timeRestored && video.duration > savedTime) {
      video.currentTime = savedTime;
      timeRestored = true;
    }
    updateProgress();
    updateVolume();
  });
  video.addEventListener('progress', function() {
    if (!video.duration || !video.buffered.length) return;
    var end = video.buffered.end(video.buffered.length - 1);
    var pct = Math.min(100, (end / video.duration) * 100);
    seekBuffered.style.width = pct + '%';
  });

  function updateProgress() {
    if (!video.duration) return;
    var pct = (video.currentTime / video.duration) * 100;
    seekbar.value = Math.round(pct * 10);
    seekPlayed.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(video.currentTime);
    durationEl.textContent = formatTime(video.duration);
  }

  function formatTime(s) {
    if (!s || !isFinite(s)) return '0:00';
    s = Math.floor(s);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    if (h > 0) return h + ':' + pad2(m) + ':' + pad2(sec);
    return m + ':' + pad2(sec);
  }

  seekbar.addEventListener('input', function() {
    if (!video.duration) return;
    var pct = parseFloat(seekbar.value) / 10;
    seekPlayed.style.width = pct + '%';
    video.currentTime = (pct / 100) * video.duration;
    currentTimeEl.textContent = formatTime(video.currentTime);
  });

  volumeSlider.addEventListener('input', function() {
    var v = parseFloat(volumeSlider.value) / 100;
    video.volume = v; video.muted = v === 0; updateVolume();
  });
  volBtn.addEventListener('click', function(e) { e.stopPropagation(); video.muted = !video.muted; updateVolume(); });
  video.addEventListener('volumechange', updateVolume);

  function updateVolume() {
    var pct = Math.round(video.volume * 100);
    volumeSlider.value = video.muted ? 0 : pct;
    if (video.muted || video.volume === 0) volBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
    else if (video.volume < 0.5) volBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>';
    else volBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
  }

  function showLoading(msg) {
    loadingText.textContent = msg || 'Loading…';
    loadingScreen.style.display = 'flex';
  }
  function hideLoading() { loadingScreen.style.display = 'none'; }
  function showError(msg) {
    errorText.textContent = msg || 'Playback error';
    errorScreen.style.display = 'flex';
    hideLoading();
    buffering.classList.remove('show');
    stopStallWatch();
  }
  function hideError() { errorScreen.style.display = 'none'; }

  function showControls() {
    shell.classList.remove('hide-ui');
    clearTimeout(hideTimer);
    if (!video.paused && !video.ended) scheduleHide();
  }
  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function() {
      if (!video.paused && !video.ended) shell.classList.add('hide-ui');
    }, 2800);
  }
  document.addEventListener('mousemove', showControls);
  document.addEventListener('touchstart', showControls, { passive: true });

  shell.addEventListener('click', function(e) {
    if (e.target.closest('.top-bar,.bottom-controls,.error-screen,.loading-screen,.paused-screen')) return;
    togglePlay();
  });
  playPauseBtn.addEventListener('click', function(e) { e.stopPropagation(); togglePlay(); showControls(); });
  psPlayBtn.addEventListener('click', function(e) { e.stopPropagation(); userPlay(); });
  rewindBtn.addEventListener('click', function(e) { e.stopPropagation(); video.currentTime = Math.max(0, video.currentTime - 10); showControls(); });
  forwardBtn.addEventListener('click', function(e) { e.stopPropagation(); video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); showControls(); });

  function toggleFullscreen() {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl) {
      if (shell.requestFullscreen) shell.requestFullscreen().catch(function(){});
      else if (shell.webkitRequestFullscreen) shell.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }
  fullscreenBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleFullscreen(); });
  function updateFullscreenIcon() {
    var isFs = document.fullscreenElement || document.webkitFullscreenElement;
    fullscreenBtn.innerHTML = isFs
      ? '<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>';
  }
  document.addEventListener('fullscreenchange', updateFullscreenIcon);
  document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

  closeBtn.addEventListener('click', function() {
    window.close();
    setTimeout(function() { if (!window.closed) location.href = 'flexji.html'; }, 120);
  });

  document.addEventListener('keydown', function(e) {
    var k = e.keyCode;
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    var isForm = tag === 'INPUT' || tag === 'BUTTON' || tag === 'SELECT';
    if (k === 32 || k === 13 || k === 415 || k === 179) {
      if (!isForm) { togglePlay(); e.preventDefault(); }
      showControls();
    } else if (k === 37) { video.currentTime = Math.max(0, video.currentTime - 10); e.preventDefault(); showControls(); }
    else if (k === 39) { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); e.preventDefault(); showControls(); }
    else if (k === 38) { video.volume = Math.min(1, video.volume + 0.1); e.preventDefault(); showControls(); }
    else if (k === 40) { video.volume = Math.max(0, video.volume - 0.1); e.preventDefault(); showControls(); }
    else if (k === 70 || k === 102) { toggleFullscreen(); e.preventDefault(); }
    else if (k === 77 || k === 109) { video.muted = !video.muted; updateVolume(); }
    else if (k === 27 || k === 10009) {
      if (document.fullscreenElement) document.exitFullscreen().catch(function(){});
      else closeBtn.click();
    }
  });

  retryBtn.addEventListener('click', function() {
    hideError();
    startPlayback();
  });

  playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  volBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
  fullscreenBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>';

  try { video.volume = 1; } catch (e) {}
  updateVolume();
  updatePlayPauseBtn();

  showLoading('Starting…');
  startPlayback();
})();
</script>
</body>
</html>
