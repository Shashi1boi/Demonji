<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>flexji · player</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,system-ui,sans-serif; }
    html, body { height:100%; background:#000; overflow:hidden; color:#fff; width: 100%; }

    #shell {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:#000; user-select:none; outline:none;
    }
    #shell.hide-ui { cursor:none; }
    
    #video {
      position:absolute; top:0; left:0; right:0; bottom:0;
      width:100%; height:100%; background:#000;
      object-fit:contain; z-index:1;
    }

    .grad {
      position:absolute; left:0; right:0;
      pointer-events:none; z-index:5;
      transition:opacity .25s;
    }
    .grad.top    { top:0; height:180px; background:linear-gradient(180deg, rgba(0,0,0,.85), transparent); }
    .grad.bottom { bottom:0; height:220px; background:linear-gradient(0deg, rgba(0,0,0,.90), transparent); }
    #shell.hide-ui .grad { opacity:0; }

    .top-bar {
      position:absolute; top:0; left:0; right:0; width: 100%;
      padding:22px 32px;
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-pack:justify; -webkit-justify-content:space-between; justify-content:space-between;
      -webkit-box-align:start; -webkit-align-items:flex-start; align-items:flex-start;
      z-index:10; transition:opacity .25s;
    }
    #shell.hide-ui .top-bar { opacity:0; pointer-events:none; }
    
    .top-bar .info { max-width:70%; -webkit-box-flex:1; -webkit-flex:1; flex:1; }
    .top-bar .brand { color:#e50914; font-weight:800; font-size:1.3rem; letter-spacing:-0.5px; margin-bottom:8px; }
    .top-bar h1 { font-size:1.8rem; font-weight:700; line-height:1.2; margin-bottom:4px; text-shadow:0 2px 12px rgba(0,0,0,.8); }
    .top-bar p { color:#ccc; font-size:.9rem; }

    .icon-btn {
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#fff; border-radius:8px;
      cursor:pointer; display:-webkit-inline-box; display:-webkit-inline-flex; display:inline-flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
      transition:background .15s, border-color .15s, transform .12s; padding:0;
    }
    .icon-btn:hover, .icon-btn:focus { background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.4); outline:none; }
    .icon-btn:active { transform:scale(0.96); }
    .icon-btn svg { width:22px; height:22px; fill:currentColor; display:block; }

    .close-btn { width:46px; height:46px; border-radius:50%; flex-shrink:0; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.2); margin-left: 15px; }
    .close-btn:hover { background:#e50914; border-color:#e50914; }

    .loading-screen, .error-screen {
      position:absolute; top:0; left:0; right:0; bottom:0;
      display:none; -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
      -webkit-box-orient:vertical; -webkit-box-direction:normal; -webkit-flex-direction:column; flex-direction:column;
      background:#0a0a0a; z-index:22; text-align:center; padding:24px;
    }
    .loading-screen.active { display:-webkit-box; display:-webkit-flex; display:flex; }
    .spinner { width:56px; height:56px; border:4px solid rgba(255,255,255,.15); border-top-color:#e50914; border-radius:50%; -webkit-animation:spin 1s linear infinite; animation:spin 1s linear infinite; }
    .loading-screen p { margin-top:20px; color:#bbb; font-size:1rem; }
    @-webkit-keyframes spin { to { -webkit-transform:rotate(360deg); transform:rotate(360deg); } }
    @keyframes spin { to { -webkit-transform:rotate(360deg); transform:rotate(360deg); } }

    .error-screen.active { display:-webkit-box; display:-webkit-flex; display:flex; }
    .error-screen .err-icon { width:64px; height:64px; color:#e50914; margin-bottom:20px; }
    .error-screen .err-icon svg { width:100%; height:100%; fill:currentColor; }
    .error-screen p { color:#ddd; margin-bottom:24px; font-size:1.05rem; max-width:500px; }
    .retry-btn {
      background:#e50914; border:none; color:#fff; padding:11px 26px; border-radius:8px;
      font-size:.95rem; font-weight:600; cursor:pointer;
      display:-webkit-inline-box; display:-webkit-inline-flex; display:inline-flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center; gap:8px; transition:background .15s;
    }
    .retry-btn:hover { background:#f6121d; }
    .retry-btn svg { width:18px; height:18px; fill:currentColor; }

    .buffering {
      position:absolute; top:50%; left:50%; margin-top:-28px; margin-left:-28px;
      display:none; pointer-events:none; z-index:9;
    }
    .buffering.show { display:block; }

    .bottom-controls {
      position:absolute; left:0; right:0; bottom:0; width: 100%;
      padding:0 32px 22px; z-index:10;
      transition:opacity .25s, transform .25s;
    }
    #shell.hide-ui .bottom-controls { opacity:0; -webkit-transform:translateY(20px); transform:translateY(20px); pointer-events:none; }

    .progress-row {
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center; gap:14px;
      margin-bottom:12px;
    }
    .seekbar-wrap {
      position:relative; -webkit-box-flex:1; -webkit-flex:1; flex:1; height:20px;
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center; cursor:pointer;
    }
    .seekbar-bg, .seekbar-buffered, .seekbar-played {
      position:absolute; left:0; height:4px; border-radius:2px; pointer-events:none;
      top:50%; margin-top:-2px; transition: width 0.1s linear;
    }
    .seekbar-bg       { right:0; background:rgba(255,255,255,.22); }
    /* YouTube Style White Buffer Bar */
    .seekbar-buffered { width:0; background:rgba(255,255,255,0.7); z-index:1; }
    .seekbar-played   { width:0; background:#e50914; z-index:2; }
    
    .seekbar {
      position:relative; z-index:3; width:100%; height:20px;
      -webkit-appearance:none; appearance:none;
      background:transparent; outline:none; cursor:pointer; margin:0; padding:0;
    }
    .seekbar::-webkit-slider-runnable-track { height:20px; background:transparent; }
    .seekbar::-webkit-slider-thumb {
      -webkit-appearance:none; appearance:none;
      width:14px; height:14px; border-radius:50%; background:#e50914;
      box-shadow:0 0 0 3px rgba(0,0,0,.4); margin-top:3px; transition:transform .12s;
    }
    .seekbar:hover::-webkit-slider-thumb, .seekbar:focus::-webkit-slider-thumb { transform:scale(1.4); }

    .time { font-size:.85rem; color:#ddd; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:90px; text-align:right; }

    .buttons-row {
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center; gap:8px;
    }
    .buttons-row .icon-btn { width:42px; height:42px; background:transparent; border:none; }
    .buttons-row .icon-btn:hover, .buttons-row .icon-btn:focus { background:rgba(255,255,255,.14); }
    .buttons-row .icon-btn.play-pause { width:46px; height:46px; }
    .buttons-row .icon-btn.play-pause svg { width:26px; height:26px; }
    .buttons-row .icon-btn.small svg { width:20px; height:20px; }

    .volume-slider {
      -webkit-appearance:none; appearance:none; width:90px; height:4px;
      background:rgba(255,255,255,.28); border-radius:2px; outline:none; margin:0 8px 0 4px;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
      background:#fff; cursor:pointer;
    }

    .spacer { -webkit-box-flex:1; -webkit-flex:1; flex:1; }

    @media (max-width:640px) {
      .top-bar { padding:14px 16px; }
      .top-bar h1 { font-size:1.15rem; }
      .top-bar .brand { font-size:1rem; margin-bottom:4px; }
      .bottom-controls { padding:0 14px 16px; }
      .volume-slider { display:none; }
      .time { min-width:auto; font-size:.78rem; }
      .buttons-row .icon-btn { width:38px; height:38px; }
      .buttons-row .icon-btn.play-pause { width:42px; height:42px; }
      .close-btn { width:40px; height:40px; }
    }
  </style>
</head>
<body>

<div id="shell" tabindex="0">
  <video id="video" playsinline></video>
  <div class="grad top"></div>
  <div class="grad bottom"></div>

  <div class="top-bar" id="topBar">
    <div class="info">
      <div class="brand">flexji</div>
      <h1 id="title">Loading…</h1>
      <p id="subtitle"></p>
    </div>
    <button class="icon-btn close-btn" id="closeBtn" title="Close (Esc)">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div class="buffering" id="buffering"><div class="spinner"></div></div>

  <div class="loading-screen active" id="loadingScreen">
    <div class="spinner"></div>
    <p id="loadingText">Finding best stream…</p>
  </div>
  
  <div class="error-screen" id="errorScreen">
    <div class="err-icon"><svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg></div>
    <p id="errorText">Playback error</p>
    <button class="retry-btn" id="retryBtn"><svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg> Retry</button>
  </div>

  <div class="bottom-controls">
    <div class="progress-row">
      <div class="seekbar-wrap">
        <div class="seekbar-bg"></div>
        <div class="seekbar-buffered" id="seekBuffered"></div>
        <div class="seekbar-played" id="seekPlayed"></div>
        <input type="range" id="seekbar" class="seekbar" min="0" max="1000" value="0" step="1" />
      </div>
      <div class="time"><span id="currentTime">0:00</span> / <span id="duration">0:00</span></div>
    </div>
    
    <div class="buttons-row">
      <button class="icon-btn play-pause" id="playPauseBtn" title="Play / Pause (Space)">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn small" id="rewindBtn" title="Rewind 10s (←)">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
      <button class="icon-btn small" id="forwardBtn" title="Forward 10s (→)">
        <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
      </button>
      <!-- NEXT EPISODE BUTTON -->
      <button class="icon-btn small" id="nextEpBtn" title="Next Episode (N)" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      
      <button class="icon-btn" id="volBtn" title="Mute (M)">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <input type="range" class="volume-slider" id="volume" min="0" max="100" value="100" />
      <div class="spacer"></div>
      <button class="icon-btn" id="fullscreenBtn" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var ICONS = {
    play:       '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause:      '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    volHigh:    '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>',
    volLow:     '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>',
    mute:       '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>',
    fullscreen: '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>',
    exitFs:     '<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>'
  };

  function getQueryParam(name) {
    var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
    var results = regex.exec(window.location.href);
    if (!results || !results[2]) return '';
    return decodeURIComponent(results[2].replace(/\+/g, ' '));
  }

  var type      = getQueryParam('type') || 'movie';
  var tmdbId    = getQueryParam('id');
  var season    = parseInt(getQueryParam('season') || '1', 10);
  var episode   = parseInt(getQueryParam('episode') || '1', 10);
  var title     = getQueryParam('title') || 'Untitled';
  var year      = getQueryParam('year') || '';
  var savedTime = parseFloat(getQueryParam('t') || '0');

  var shell         = document.getElementById('shell');
  var video         = document.getElementById('video');
  var titleEl       = document.getElementById('title');
  var subtitleEl    = document.getElementById('subtitle');
  var loadingScreen = document.getElementById('loadingScreen');
  var loadingText   = document.getElementById('loadingText');
  var errorScreen   = document.getElementById('errorScreen');
  var errorText     = document.getElementById('errorText');
  var retryBtn      = document.getElementById('retryBtn');
  var buffering     = document.getElementById('buffering');

  var playPauseBtn  = document.getElementById('playPauseBtn');
  var rewindBtn     = document.getElementById('rewindBtn');
  var forwardBtn    = document.getElementById('forwardBtn');
  var nextEpBtn     = document.getElementById('nextEpBtn');
  var seekbar       = document.getElementById('seekbar');
  var seekPlayed    = document.getElementById('seekPlayed');
  var seekBuffered  = document.getElementById('seekBuffered');
  var currentTimeEl = document.getElementById('currentTime');
  var durationEl    = document.getElementById('duration');
  var volBtn        = document.getElementById('volBtn');
  var volumeSlider  = document.getElementById('volume');
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var closeBtn      = document.getElementById('closeBtn');

  var hideTimer = null;
  var timeRestored = false;

  titleEl.textContent = title;
  var displaySub = year;
  if (type === 'tv') {
    displaySub = (year ? year + ' · ' : '') + 'Season ' + (season<10?'0'+season:season) + ', Episode ' + (episode<10?'0'+episode:episode);
    nextEpBtn.style.display = 'inline-flex';
    nextEpBtn.onclick = function(e) {
      e.stopPropagation();
      window.location.href = 'fplayer.html?type=tv&id=' + tmdbId + '&season=' + season + '&episode=' + (episode + 1) + '&title=' + encodeURIComponent(title) + '&year=' + year;
    };
  }
  subtitleEl.textContent = displaySub;

  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function formatTime(s) {
    if (!s || !isFinite(s)) return '0:00';
    s = Math.floor(s);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    return (h > 0 ? h + ':' + pad2(m) : m) + ':' + pad2(sec);
  }

  function showControls() {
    shell.classList.remove('hide-ui');
    clearTimeout(hideTimer);
    if (!video.paused && !video.ended) {
      hideTimer = setTimeout(function() { shell.classList.add('hide-ui'); }, 3000);
    }
  }
  document.addEventListener('mousemove', showControls);
  document.addEventListener('touchstart', showControls, { passive: true });

  function togglePlay() {
    if (video.paused || video.ended) video.play(); else video.pause();
  }
  playPauseBtn.onclick = function(e) { e.stopPropagation(); togglePlay(); };
  shell.onclick = function(e) {
    if (!e.target.closest('.top-bar, .bottom-controls, .error-screen')) togglePlay();
  };

  video.addEventListener('play', function() { playPauseBtn.innerHTML = ICONS.pause; showControls(); });
  video.addEventListener('pause', function() { playPauseBtn.innerHTML = ICONS.play; showControls(); });
  video.addEventListener('waiting', function() { buffering.classList.add('show'); });
  video.addEventListener('playing', function() { buffering.classList.remove('show'); loadingScreen.classList.remove('active'); });

  function saveProgress() {
    if (!video.duration || video.currentTime < 5) return;
    try {
      var store = JSON.parse(localStorage.getItem('flexji_progress') || '{}');
      var key = type === 'tv' ? (tmdbId + '_' + season + '_' + episode) : tmdbId;
      store[key] = { tmdbId: tmdbId, type: type, season: season, episode: episode, currentTime: video.currentTime, duration: video.duration, title: title, year: year, timestamp: Date.now() };
      localStorage.setItem('flexji_progress', JSON.stringify(store));
    } catch(e){}
  }

  video.addEventListener('timeupdate', function() {
    if (!video.duration) return;
    if (savedTime > 0 && !timeRestored && video.currentTime < 1) {
      video.currentTime = savedTime;
      timeRestored = true;
    }
    var pct = (video.currentTime / video.duration) * 100;
    seekbar.value = Math.round(pct * 10);
    seekPlayed.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(video.currentTime);
    durationEl.textContent = formatTime(video.duration);
    saveProgress();
  });

  video.addEventListener('progress', function() {
    if (!video.duration || !video.buffered.length) return;
    var end = video.buffered.end(video.buffered.length - 1);
    seekBuffered.style.width = Math.min(100, (end / video.duration) * 100) + '%';
  });

  seekbar.addEventListener('input', function() {
    if (!video.duration) return;
    var pct = parseFloat(seekbar.value) / 10;
    seekPlayed.style.width = pct + '%';
    video.currentTime = (pct / 100) * video.duration;
  });

  rewindBtn.onclick = function(e) { e.stopPropagation(); video.currentTime = Math.max(0, video.currentTime - 10); };
  forwardBtn.onclick = function(e) { e.stopPropagation(); video.currentTime = Math.min(video.duration||0, video.currentTime + 10); };

  function updateVolume() {
    volumeSlider.value = video.muted ? 0 : Math.round(video.volume * 100);
    volBtn.innerHTML = video.muted || video.volume === 0 ? ICONS.mute : (video.volume < 0.5 ? ICONS.volLow : ICONS.volHigh);
  }
  volumeSlider.addEventListener('input', function() {
    var v = parseFloat(volumeSlider.value) / 100;
    video.volume = v; video.muted = v === 0; updateVolume();
  });
  volBtn.onclick = function(e) { e.stopPropagation(); video.muted = !video.muted; updateVolume(); };

  function toggleFullscreen() {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl) {
      if (shell.requestFullscreen) shell.requestFullscreen();
      else if (shell.webkitRequestFullscreen) shell.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }
  fullscreenBtn.onclick = function(e) { e.stopPropagation(); toggleFullscreen(); };
  function updateFsIcon() { fullscreenBtn.innerHTML = (document.fullscreenElement || document.webkitFullscreenElement) ? ICONS.exitFs : ICONS.fullscreen; }
  document.addEventListener('fullscreenchange', updateFsIcon);
  document.addEventListener('webkitfullscreenchange', updateFsIcon);

  closeBtn.onclick = function(e) {
    e.stopPropagation(); window.close(); setTimeout(function() { if (!window.closed) location.href = 'flexji.html'; }, 100);
  };

  // Samsung Tizen Remote & Keyboard Support
  document.addEventListener('keydown', function(e) {
    var k = e.keyCode;
    if (k === 32 || k === 13 || k === 415) { togglePlay(); e.preventDefault(); } // Space/Enter/Play
    else if (k === 19) { video.pause(); e.preventDefault(); } // Pause
    else if (k === 37 || k === 412) { video.currentTime = Math.max(0, video.currentTime - 10); e.preventDefault(); } // Left/Rewind
    else if (k === 39 || k === 417) { video.currentTime = Math.min(video.duration||0, video.currentTime + 10); e.preventDefault(); } // Right/FF
    else if (k === 38) { video.volume = Math.min(1, video.volume + 0.1); e.preventDefault(); } // Up
    else if (k === 40) { video.volume = Math.max(0, video.volume - 0.1); e.preventDefault(); } // Down
    else if (k === 70) { toggleFullscreen(); e.preventDefault(); } // F
    else if (k === 78 && type === 'tv') { nextEpBtn.click(); e.preventDefault(); } // N
    else if (k === 77) { video.muted = !video.muted; updateVolume(); } // M
    else if (k === 27 || k === 10009) { // Esc or Samsung Return Key
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if(document.exitFullscreen) document.exitFullscreen(); else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else closeBtn.click();
      e.preventDefault();
    }
    showControls();
  });

  // Fast Native Fetch for Streams (Bypasses heavy iframes for Tizen speed)
  function fetchStream() {
    if (!tmdbId) { showError('Invalid Request.'); return; }
    loadingScreen.classList.add('active');
    errorScreen.classList.remove('active');
    loadingText.textContent = 'Finding best stream…';

    var url = 'https://vidsync.pro/api/core/streams?type=' + type + '&id=' + tmdbId;
    if (type === 'tv') url += '&season=' + season + '&episode=' + episode;

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (!data || !data.sources || !data.sources.length) throw new Error();
            // Get best quality source
            var bestSource = data.sources[0];
            for (var i = 1; i < data.sources.length; i++) {
              var q1 = parseInt((bestSource.quality||'').replace(/\D/g,''))||0;
              var q2 = parseInt((data.sources[i].quality||'').replace(/\D/g,''))||0;
              if (q2 > q1 && q2 <= 1080) bestSource = data.sources[i];
            }
            var streamUrl = bestSource.url;
            if (streamUrl && streamUrl.charAt(0) === '/') streamUrl = 'https://vidsync.pro' + streamUrl;
            initPlayer(streamUrl || bestSource.rawUrl || bestSource.directUrl);
          } catch (e) { showError('No playable stream found.'); }
        } else showError('Failed to load stream (Network Error).');
      }
    };
    xhr.onerror = function() { showError('Connection lost.'); };
    xhr.send();
  }

  function initPlayer(url) {
    if (!url) { showError('Invalid Stream URL.'); return; }
    
    // Check if Tizen/Safari Native HLS is supported (extremely fast on smart TVs)
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.load();
      video.play().catch(function(){});
    } else {
      // PC Chrome/Firefox/Edge Fallback using hls.js
      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
      script.onload = function() {
        if (Hls.isSupported()) {
          var hls = new Hls({ capLevelToPlayerSize: true, maxBufferLength: 30 });
          hls.loadSource(url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play().catch(function(){}); });
          hls.on(Hls.Events.ERROR, function(e, d) { if(d.fatal) hls.recoverMediaError(); });
        } else showError('Your browser is completely unsupported.');
      };
      script.onerror = function() { showError('Could not load HLS dependency.'); };
      document.head.appendChild(script);
    }
  }

  function showError(msg) {
    errorText.textContent = msg; errorScreen.classList.add('active'); loadingScreen.classList.remove('active'); buffering.classList.remove('show');
  }
  retryBtn.onclick = fetchStream;

  playPauseBtn.innerHTML = ICONS.play; volBtn.innerHTML = ICONS.volHigh; fullscreenBtn.innerHTML = ICONS.fullscreen;
  video.volume = 1; fetchStream();
})();
</script>
