<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>flexji · player</title>
  <link rel="preconnect" href="https://vidsync.pro" crossorigin />
  <link rel="dns-prefetch" href="https://vidsync.pro" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,system-ui,sans-serif; }
    html, body { height:100%; background:#000; overflow:hidden; color:#fff; width: 100%; }

    #shell {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:#000;
      user-select:none; outline:none;
    }
    #shell.hide-ui { cursor:none; }
    #video {
      position:absolute; top:0; left:0; right:0; bottom:0;
      width:100%; height:100%;
      background:#000; object-fit:contain;
    }

    .grad {
      position:absolute; left:0; right:0;
      pointer-events:none; z-index:5;
      transition:opacity .25s;
    }
    .grad.top    { top:0; height:180px; background:linear-gradient(180deg, rgba(0,0,0,.85), transparent); }
    .grad.bottom { bottom:0; height:220px; background:linear-gradient(0deg, rgba(0,0,0,.90), transparent); }
    #shell.hide-ui .grad { opacity:0; }

    .top-bar {
      position:absolute; top:0; left:0; right:0; width: 100%;
      padding:22px 32px;
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-pack:justify; -webkit-justify-content:space-between; justify-content:space-between;
      -webkit-box-align:start; -webkit-align-items:flex-start; align-items:flex-start;
      z-index:10;
      transition:opacity .25s;
    }
    #shell.hide-ui .top-bar { opacity:0; pointer-events:none; }
    .top-bar .info { 
      max-width:70%; 
      -webkit-box-flex:1; -webkit-flex:1; flex:1; 
    }
    .top-bar .brand {
      color:#e50914; font-weight:800; font-size:1.3rem;
      letter-spacing:-0.5px; margin-bottom:8px;
    }
    .top-bar h1 {
      font-size:1.8rem; font-weight:700; line-height:1.2;
      margin-bottom:4px; text-shadow:0 2px 12px rgba(0,0,0,.8);
    }
    .top-bar p { color:#ccc; font-size:.9rem; }

    /* ===== QUALITY HUD (source vs decoded) ===== */
    .quality-hud {
      display:none; align-items:center; gap:6px;
      margin-top:10px; font-size:.72rem;
      background:rgba(0,0,0,.55); padding:4px 11px; border-radius:12px;
      color:#999; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      border:1px solid rgba(255,255,255,.06);
      width:fit-content;
    }
    .quality-hud.show { display:inline-flex; }
    .quality-hud strong { color:#fff; font-weight:700; margin-left:4px; }
    .quality-hud .qh-sep { color:#444; margin:0 2px; }
    .quality-hud.match   #qhAct { color:#4ade80; }
    .quality-hud.mismatch #qhAct { color:#f87171; }

    .icon-btn {
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.15);
      color:#fff; border-radius:8px;
      cursor:pointer;
      display:-webkit-inline-box; display:-webkit-inline-flex; display:inline-flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
      transition:background .15s, border-color .15s, transform .12s;
      padding:0;
    }
    .icon-btn:hover, .icon-btn:focus { background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.4); outline:none; }
    .icon-btn:active { transform:scale(0.96); }
    .icon-btn svg { width:22px; height:22px; fill:currentColor; display:block; }

    .close-btn {
      width:46px; height:46px; border-radius:50%; flex-shrink:0;
      background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.2);
      margin-left: 15px;
    }
    .close-btn svg { width:22px; height:22px; }
    .close-btn:hover { background:#e50914; border-color:#e50914; }

    .paused-screen {
      position:absolute; top:0; left:0; right:0; bottom:0;
      display:none; z-index:8; overflow:hidden;
    }
    .paused-screen.active { display:block; }
    .ps-bg {
      position:absolute; top:-60px; left:-60px; right:-60px; bottom:-60px;
      background-size:cover; background-position:center;
      filter:blur(50px) brightness(0.35) saturate(1.2);
      transform:scale(1.15);
    }
    .ps-vignette {
      position:absolute; top:0; left:0; right:0; bottom:0;
      background:radial-gradient(ellipse at center, transparent 15%, rgba(0,0,0,.75) 100%);
    }
    .ps-content {
      position:relative; z-index:2; height:100%;
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-orient:vertical; -webkit-box-direction:normal; -webkit-flex-direction:column; flex-direction:column;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
      gap:24px; text-align:center; padding:60px 24px 120px;
    }
    .ps-poster-wrap { display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center; }
    .ps-poster-wrap.hidden { display:none; }
    .ps-poster {
      max-height:44vh; max-width:min(70vw, 340px);
      border-radius:14px; box-shadow:0 30px 80px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.08);
      object-fit:contain; display:block; background:#111;
    }
    .ps-meta { max-width:80vw; }
    .ps-title { font-size:2.4rem; font-weight:800; line-height:1.15; letter-spacing:-0.5px; text-shadow:0 4px 24px rgba(0,0,0,.9); margin-bottom:8px; }
    .ps-sub { color:#ccc; font-size:1.05rem; text-shadow:0 2px 10px rgba(0,0,0,.8); }
    .ps-play-btn {
      width:88px; height:88px; border-radius:50%; background:#e50914; border:none; color:#fff; cursor:pointer;
      display:-webkit-inline-box; display:-webkit-inline-flex; display:inline-flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
      box-shadow:0 0 40px rgba(229,9,20,.55), 0 8px 24px rgba(0,0,0,.5);
      transition:transform .15s, box-shadow .15s, background .15s;
    }
    .ps-play-btn:hover { background:#f6121d; transform:scale(1.06); box-shadow:0 0 60px rgba(229,9,20,.85), 0 8px 24px rgba(0,0,0,.6); }
    .ps-play-btn svg { width:38px; height:38px; fill:#fff; margin-left:5px; }
    .ps-hint { color:#888; font-size:.85rem; margin-top:6px; letter-spacing:.3px; }

    .buffering {
      position:absolute; top:0; left:0; right:0; bottom:0;
      display:none; 
      -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
      pointer-events:none; z-index:9;
    }
    .buffering.show { display:-webkit-box; display:-webkit-flex; display:flex; }
    .spinner {
      width:52px; height:52px; border:4px solid rgba(255,255,255,.15);
      border-top-color:#e50914; border-radius:50%;
      -webkit-animation:spin 1s linear infinite; animation:spin 1s linear infinite;
    }
    .spinner.big { width:64px; height:64px; border-width:5px; }
    @-webkit-keyframes spin { to { -webkit-transform:rotate(360deg); transform:rotate(360deg); } }
    @keyframes spin { to { -webkit-transform:rotate(360deg); transform:rotate(360deg); } }

    .loading-screen, .error-screen {
      position:absolute; top:0; left:0; right:0; bottom:0;
      display:none;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
      -webkit-box-orient:vertical; -webkit-box-direction:normal; -webkit-flex-direction:column; flex-direction:column;
      background:#0a0a0a; z-index:22; text-align:center; padding:24px;
    }
    .loading-screen { display:-webkit-box; display:-webkit-flex; display:flex; }
    .loading-screen p { margin-top:20px; color:#bbb; font-size:1rem; }
    .error-screen .err-icon { width:64px; height:64px; color:#e50914; margin-bottom:20px; }
    .error-screen .err-icon svg { width:100%; height:100%; fill:currentColor; }
    .error-screen p { color:#ddd; margin-bottom:24px; font-size:1.05rem; max-width:500px; }
    .error-screen .retry-btn {
      background:#e50914; border:none; color:#fff; padding:11px 26px; border-radius:8px;
      font-size:.95rem; font-weight:600; cursor:pointer;
      display:-webkit-inline-box; display:-webkit-inline-flex; display:inline-flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center; gap:8px;
      transition:background .15s;
    }
    .error-screen .retry-btn:hover { background:#f6121d; }
    .error-screen .retry-btn svg { width:18px; height:18px; fill:currentColor; }

    .bottom-controls {
      position:absolute; left:0; right:0; bottom:0; width: 100%;
      padding:0 32px 22px; z-index:10;
      transition:opacity .25s, transform .25s;
    }
    #shell.hide-ui .bottom-controls { opacity:0; -webkit-transform:translateY(20px); transform:translateY(20px); pointer-events:none; }

    .progress-row {
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center; gap:14px;
      margin-bottom:12px;
    }
    .seekbar-wrap {
      position:relative; -webkit-box-flex:1; -webkit-flex:1; flex:1; height:16px;
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center; cursor:pointer;
    }
    .seekbar-bg, .seekbar-buffered, .seekbar-played {
      position:absolute; left:0; height:4px; border-radius:2px; pointer-events:none;
      top:50%; -webkit-transform:translateY(-50%); transform:translateY(-50%);
    }
    .seekbar-bg        { right:0; background:rgba(255,255,255,.22); }
    .seekbar-buffered { width:0; background:#ffffff; opacity:0.6; z-index:1; }
    .seekbar-played   { width:0; background:#e50914; z-index:2; }
    
    .seekbar {
      position:relative; z-index:3; width:100%; height:16px;
      -webkit-appearance:none; appearance:none;
      background:transparent; outline:none; cursor:pointer; margin:0; padding:0;
    }
    .seekbar::-webkit-slider-runnable-track { height:16px; background:transparent; }
    .seekbar::-webkit-slider-thumb {
      -webkit-appearance:none; appearance:none;
      width:14px; height:14px; border-radius:50%; background:#e50914;
      box-shadow:0 0 0 3px rgba(0,0,0,.4); margin-top:1px;
      transition:transform .12s;
    }
    .seekbar:hover::-webkit-slider-thumb, .seekbar:focus::-webkit-slider-thumb { transform:scale(1.4); }

    .time {
      font-size:.85rem; color:#ddd; font-variant-numeric:tabular-nums;
      white-space:nowrap; min-width:100px; text-align:right;
    }

    .buttons-row {
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center; gap:6px;
    }
    .buttons-row .icon-btn { width:42px; height:42px; background:transparent; border:none; }
    .buttons-row .icon-btn:hover, .buttons-row .icon-btn:focus { background:rgba(255,255,255,.14); }
    .buttons-row .icon-btn.play-pause { width:46px; height:46px; }
    .buttons-row .icon-btn.play-pause svg { width:26px; height:26px; }
    .buttons-row .icon-btn.small svg { width:20px; height:20px; }

    .volume-slider {
      -webkit-appearance:none; appearance:none;
      width:90px; height:4px; background:rgba(255,255,255,.28);
      border-radius:2px; outline:none; margin:0 8px 0 4px;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
      background:#fff; cursor:pointer;
    }

    .spacer { -webkit-box-flex:1; -webkit-flex:1; flex:1; }

    .settings-backdrop {
      position:absolute; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      display:none; z-index:28; opacity:0; transition:opacity .2s;
    }
    .settings-backdrop.open { display:block; opacity:1; }

    .settings-panel {
      position:absolute; top:50%; left:50%;
      -webkit-transform:translate(-50%, -48%) scale(0.96); transform:translate(-50%, -48%) scale(0.96);
      width:90%; max-width:460px; max-height:72vh;
      background:rgba(20,20,22,.99); border-radius:16px;
      border:1px solid rgba(255,255,255,.09); box-shadow:0 30px 80px rgba(0,0,0,.85);
      display:none; -webkit-box-orient:vertical; -webkit-box-direction:normal; -webkit-flex-direction:column; flex-direction:column;
      z-index:30; overflow:hidden; opacity:0;
      transition:opacity .2s, transform .2s;
    }
    .settings-panel.open { display:-webkit-box; display:-webkit-flex; display:flex; opacity:1; -webkit-transform:translate(-50%, -50%) scale(1); transform:translate(-50%, -50%) scale(1); }
    .settings-head {
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:justify; -webkit-justify-content:space-between; justify-content:space-between;
      padding:18px 20px; border-bottom:1px solid rgba(255,255,255,.07); flex-shrink:0;
    }
    .settings-head .sh-title { display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-align:center; -webkit-align-items:center; align-items:center; gap:10px; font-size:1rem; font-weight:700; }
    .settings-head .sh-title svg { width:20px; height:20px; fill:#e50914; }
    .settings-close {
      width:36px; height:36px; border-radius:8px; background:transparent; border:none; color:#bbb; cursor:pointer;
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
      transition:background .15s, color .15s;
    }
    .settings-close:hover { background:rgba(255,255,255,.1); color:#fff; }
    .settings-close svg { width:20px; height:20px; fill:currentColor; }

    .settings-body { overflow-y:auto; padding:8px 0 14px; -webkit-box-flex:1; -webkit-flex:1; flex:1; }
    .settings-body::-webkit-scrollbar { width:6px; }
    .settings-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,.2); border-radius:4px; }
    .settings-section { padding:8px 0; }
    .settings-section + .settings-section { border-top:1px solid rgba(255,255,255,.05); margin-top:6px; }
    .settings-label { padding:8px 20px 4px; font-size:.7rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#888; }
    .settings-options { display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-orient:vertical; -webkit-box-direction:normal; -webkit-flex-direction:column; flex-direction:column; }
    .opt-btn {
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:justify; -webkit-justify-content:space-between; justify-content:space-between;
      gap:12px; width:100%; background:transparent; border:none; color:#ddd; padding:12px 20px; cursor:pointer;
      font-size:.95rem; text-align:left; transition:background .12s, color .12s;
    }
    .opt-btn:hover { background:rgba(255,255,255,.06); color:#fff; }
    .opt-btn.active { color:#fff; font-weight:600; }
    .opt-btn .opt-label { display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-align:center; -webkit-align-items:center; align-items:center; gap:10px; -webkit-box-flex:1; -webkit-flex:1; flex:1; }
    .opt-btn .opt-tag { font-size:.7rem; padding:2px 8px; border-radius:20px; background:rgba(255,255,255,.1); color:#aaa; font-weight:600; letter-spacing:.3px; }
    .opt-btn.active .opt-tag { background:rgba(229,9,20,.2); color:#ff6b73; }
    .opt-btn .opt-check { width:20px; height:20px; color:#e50914; display:none; flex-shrink:0; }
    .opt-btn .opt-check svg { width:20px; height:20px; fill:currentColor; }
    .opt-btn.active .opt-check { display:block; }
    .settings-empty { padding:16px 20px; color:#666; font-size:.85rem; text-align:center; }

    @media (max-width:640px) {
      .top-bar { padding:14px 16px; }
      .top-bar h1 { font-size:1.15rem; }
      .top-bar .brand { font-size:1rem; margin-bottom:4px; }
      .top-bar p { font-size:.78rem; }
      .quality-hud { font-size:.65rem; padding:3px 8px; }
      .ps-title { font-size:1.55rem; }
      .ps-sub { font-size:.9rem; }
      .ps-poster { max-height:32vh; }
      .ps-play-btn { width:72px; height:72px; }
      .ps-play-btn svg { width:30px; height:30px; }
      .ps-hint { display:none; }
      .bottom-controls { padding:0 14px 16px; }
      .volume-slider { width:0; display:none; }
      .time { min-width:auto; font-size:.78rem; }
      .buttons-row .icon-btn { width:38px; height:38px; }
      .buttons-row .icon-btn.play-pause { width:42px; height:42px; }
      .buttons-row .icon-btn.small { display:none; }
      .close-btn { width:40px; height:40px; }
    }
  </style>
</head>
<body>

<div id="shell" tabindex="0">
  <video id="video" playsinline preload="auto"></video>
  <div class="grad top"></div>
  <div class="grad bottom"></div>

  <div class="top-bar">
    <div class="info">
      <div class="brand">flexji</div>
      <h1 id="title">Loading…</h1>
      <p id="subtitle"></p>
      <div class="quality-hud" id="qualityHud">
        <span>Source <strong id="qhSel">—</strong></span>
        <span class="qh-sep">·</span>
        <span>Decoded <strong id="qhAct">—</strong></span>
      </div>
    </div>
    <button class="icon-btn close-btn" id="closeBtn" title="Close (Esc)">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div class="paused-screen" id="pausedScreen">
    <div class="ps-bg" id="psBg"></div>
    <div class="ps-vignette"></div>
    <div class="ps-content">
      <div class="ps-poster-wrap" id="psPosterWrap">
        <img id="psPoster" class="ps-poster" alt="" />
      </div>
      <div class="ps-meta">
        <h2 class="ps-title" id="psTitle"></h2>
        <p class="ps-sub" id="psSub"></p>
      </div>
      <button class="ps-play-btn" id="psPlayBtn" title="Resume (Space)">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <p class="ps-hint">Press Space to resume</p>
    </div>
  </div>

  <div class="buffering" id="buffering">
    <div class="spinner"></div>
  </div>

  <div class="loading-screen" id="loadingScreen">
    <div class="spinner big"></div>
    <p id="loadingText">Loading stream…</p>
  </div>
  <div class="error-screen" id="errorScreen">
    <div class="err-icon">
      <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
    </div>
    <p id="errorText">Playback error</p>
    <button class="retry-btn" id="retryBtn">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Retry
    </button>
  </div>

  <div class="bottom-controls">
    <div class="progress-row">
      <div class="seekbar-wrap">
        <div class="seekbar-bg"></div>
        <div class="seekbar-buffered" id="seekBuffered"></div>
        <div class="seekbar-played" id="seekPlayed"></div>
        <input type="range" id="seekbar" class="seekbar" min="0" max="1000" value="0" step="1" />
      </div>
      <div class="time"><span id="currentTime">0:00</span> / <span id="duration">0:00</span></div>
    </div>
    <div class="buttons-row">
      <button class="icon-btn play-pause" id="playPause" title="Play / Pause (Space)">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn small" id="rewindBtn" title="Rewind 10s (←)">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
      <button class="icon-btn small" id="forwardBtn" title="Forward 10s (→)">
        <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
      </button>
      <button class="icon-btn small" id="nextEpBtn" title="Next Episode (N)" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      
      <button class="icon-btn" id="volBtn" title="Mute (M)">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <input type="range" class="volume-slider" id="volume" min="0" max="100" value="100" />
      <div class="spacer"></div>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function() {
  'use strict';

  var ICONS = {
    play:         '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause:        '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    volumeHigh:   '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>',
    volumeLow:    '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>',
    mute:         '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>',
    fullscreen:   '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>',
    exitFs:       '<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>',
    check:        '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>'
  };

  function getQueryParam(name) {
    var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
    var results = regex.exec(window.location.href);
    if (!results) return null;
    if (!results[2]) return '';
    return decodeURIComponent(results[2].replace(/\+/g, ' '));
  }

  var type       = getQueryParam('type') || 'movie';
  var tmdbId     = getQueryParam('id'); 
  var season     = parseInt(getQueryParam('season') || '1', 10);
  var episode    = parseInt(getQueryParam('episode') || '1', 10);
  var title      = getQueryParam('title') || '';
  var year       = getQueryParam('year')  || '';
  var posterUrl  = getQueryParam('poster')|| '';
  var savedTime  = parseFloat(getQueryParam('t') || '0');

  var shell          = document.getElementById('shell');
  var video          = document.getElementById('video');
  var titleEl        = document.getElementById('title');
  var subtitleEl     = document.getElementById('subtitle');
  var pausedScreen   = document.getElementById('pausedScreen');
  var psBg           = document.getElementById('psBg');
  var psPosterWrap   = document.getElementById('psPosterWrap');
  var psPoster       = document.getElementById('psPoster');
  var psTitle        = document.getElementById('psTitle');
  var psSub          = document.getElementById('psSub');
  var psPlayBtn      = document.getElementById('psPlayBtn');

  var qualityHud     = document.getElementById('qualityHud');
  var qhSel          = document.getElementById('qhSel');
  var qhAct          = document.getElementById('qhAct');

  var buffering      = document.getElementById('buffering');
  var loadingScreen  = document.getElementById('loadingScreen');
  var loadingText    = document.getElementById('loadingText');
  var errorScreen    = document.getElementById('errorScreen');
  var errorText      = document.getElementById('errorText');
  var retryBtn       = document.getElementById('retryBtn');

  var playPauseBtn   = document.getElementById('playPause');
  var rewindBtn      = document.getElementById('rewindBtn');
  var forwardBtn     = document.getElementById('forwardBtn');
  var nextEpBtn      = document.getElementById('nextEpBtn');
  var seekbar        = document.getElementById('seekbar');
  var seekPlayed     = document.getElementById('seekPlayed');
  var seekBuffered   = document.getElementById('seekBuffered');
  var currentTimeEl  = document.getElementById('currentTime');
  var durationEl     = document.getElementById('duration');
  var volBtn         = document.getElementById('volBtn');
  var volumeSlider   = document.getElementById('volume');
  var settingsBtn    = document.getElementById('settingsBtn');
  var fullscreenBtn  = document.getElementById('fullscreenBtn');
  var closeBtn       = document.getElementById('closeBtn');

  var settingsBackdrop = document.getElementById('settingsBackdrop');
  var settingsPanel    = document.getElementById('settingsPanel');
  var settingsClose    = document.getElementById('settingsClose');
  var audioSection     = document.getElementById('audioSection');
  var qualitySection   = document.getElementById('qualitySection');
  var audioOpts        = document.getElementById('audioOpts');
  var qualityOpts      = document.getElementById('qualityOpts');

  var displayTitle = title || 'Untitled';
  var displaySub = year;
  if (type === 'tv') {
    displaySub = (year ? year + ' · ' : '') + 'Season ' + pad2(season) + ', Episode ' + pad2(episode);
    nextEpBtn.style.display = 'inline-flex';
    nextEpBtn.onclick = function(e) {
      e.stopPropagation();
      var nextUrl = 'fplayer.html?type=tv&id=' + tmdbId + '&season=' + season + '&episode=' + (episode + 1) + 
                    '&title=' + encodeURIComponent(title) + '&year=' + encodeURIComponent(year);
      if (posterUrl) nextUrl += '&poster=' + encodeURIComponent(posterUrl);
      location.href = nextUrl;
    };
  }
  
  titleEl.textContent     = displayTitle;
  subtitleEl.textContent  = displaySub;
  psTitle.textContent     = displayTitle;
  psSub.textContent       = displaySub;
  document.title = displayTitle + ' · flexji';

  if (posterUrl) {
    psBg.style.backgroundImage = 'url("' + posterUrl + '")';
    psPoster.src = posterUrl;
    psPoster.onerror = function() { psPosterWrap.classList.add('hidden'); };
  } else {
    psPosterWrap.classList.add('hidden');
    psBg.style.background = 'radial-gradient(ellipse at center, #1a1a1a 0%, #000 100%)';
  }

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  var hlsInstance        = null;
  var currentData        = null;
  var currentSource      = null;
  var hideTimer          = null;
  var userInitiatedPause = false;
  var isSwitching        = false;
  var selectedLang       = null;
  var selectedQuality    = null;
  var timeRestored       = false;

  // ==== Quality HUD ====
  function updateQualityHud() {
    if (!selectedQuality) { qualityHud.classList.remove('show'); return; }
    qualityHud.classList.add('show');
    qhSel.textContent = selectedQuality;

    var h = video.videoHeight;
    if (h) {
      qhAct.textContent = h + 'p';
      var selNum = parseInt(String(selectedQuality).replace(/[^\d]/g, ''), 10) || 0;
      qualityHud.classList.remove('match', 'mismatch');
      if (selNum && h === selNum) qualityHud.classList.add('match');
      else if (selNum && h < selNum) qualityHud.classList.add('mismatch');
    } else {
      qhAct.textContent = '—';
      qualityHud.classList.remove('match', 'mismatch');
    }
  }
  video.addEventListener('loadedmetadata', updateQualityHud);
  video.addEventListener('playing', updateQualityHud);
  video.addEventListener('resize', updateQualityHud);

  function fetchStream() {
    if (!tmdbId) { showError('Missing TMDB ID in URL.'); return; }
    loadingScreen.style.display = 'flex';
    errorScreen.style.display   = 'none';
    loadingText.textContent = 'Loading stream…';

    var url = 'https://vidsync.pro/api/core/streams?type=' + encodeURIComponent(type) + '&id=' + encodeURIComponent(tmdbId);
    if (type === 'tv') url += '&season=' + season + '&episode=' + episode;

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 15000;
    xhr.ontimeout = function() { showError('Stream request timed out. Please retry.'); };
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (!data || !data.sources || !data.sources.length) throw new Error('No sources');
            currentData = data;
            var src = pickBestSource(data);
            if (!src) throw new Error('No playable source');
            selectedLang    = src.audioLanguage || src.language;
            selectedQuality = src.quality;
            buildSettings();
            playSource(src, false);
          } catch (err) {
            showError('Unable to load stream. ' + (err.message || ''));
          }
        } else {
          showError('HTTP Error: ' + xhr.status);
        }
      }
    };
    xhr.onerror = function() { showError('Network fetch failed.'); };
    xhr.send();
  }

  function pickBestSource(data) {
    if (!data || !data.sources || !data.sources.length) return null;
    var maxQ = detectMaxQuality();

    var preferred = null;
    for (var i = 0; i < data.sources.length; i++) {
      var s = data.sources[i];
      if (s.audioTracks && s.audioTracks[0] && s.audioTracks[0].original) {
        preferred = s.audioLanguage || s.language;
        break;
      }
    }
    var pool = data.sources.slice();
    if (preferred) {
      var filtered = pool.filter(function(x) { return (x.audioLanguage || x.language) === preferred; });
      if (filtered.length) pool = filtered;
    }
    pool.sort(function(a, b) {
      var qa = parseInt(String(a.quality || '').replace(/[^\d]/g, ''), 10) || 0;
      var qb = parseInt(String(b.quality || '').replace(/[^\d]/g, ''), 10) || 0;
      return qb - qa;
    });
    for (var j = 0; j < pool.length; j++) {
      var q = parseInt(String(pool[j].quality || '').replace(/[^\d]/g, ''), 10) || 0;
      if (q > 0 && q <= maxQ) return pool[j];
    }
    return pool[0];
  }

  // More generous quality detection: 4K screens get 4K, 1080p+ screens get 1080p
  function detectMaxQuality() {
    var s = window.screen || {};
    var w = s.width  || window.innerWidth;
    var h = s.height || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var maxRes = Math.max(w, h) * dpr;

    var q;
    if (maxRes >= 3800)      q = 2160;
    else if (maxRes >= 1900) q = 1080;
    else if (maxRes >= 1200) q = 720;
    else                     q = 480;

    // Only cap for clearly weak hardware
    var cores = navigator.hardwareConcurrency || 4;
    var mem   = navigator.deviceMemory || 4;
    if (cores <= 2 && q > 720) q = 720;
    if (mem   <= 2 && q > 720) q = 720;

    return q;
  }

  function absoluteProxy(source) {
    if (!source || !source.url) return null;
    var u = source.url;
    if (u.charAt(0) === '/') u = 'https://vidsync.pro' + u;
    return u;
  }

  function playSource(source, useRaw) {
    if (!source) return;
    currentSource = source;
    isSwitching = true;
    timeRestored = false; 

    if (hlsInstance) { try { hlsInstance.destroy(); } catch (e) {} hlsInstance = null; }
    try {
      video.pause();
      video.removeAttribute('src');
      video.load();
    } catch (e) {}

    var proxyUrl = absoluteProxy(source);
    var rawUrl   = source.rawUrl || source.directUrl || null;
    var playUrl  = useRaw ? rawUrl : (proxyUrl || rawUrl);
    if (!playUrl) { showError('No playable URL.'); isSwitching = false; return; }

    hideError();
    showLoading('Buffering video…');
    buffering.classList.remove('show');

    var isHls = (source.type === 'hls') || /\.m3u8(\?|$)/i.test(source.rawUrl || '') || /\.m3u8(\?|$)/i.test(playUrl);
    var canNative = video.canPlayType('application/vnd.apple.mpegurl');

    if (isHls && canNative) {
      video.src = playUrl;
      video.addEventListener('loadedmetadata', function onMeta() {
        video.removeEventListener('loadedmetadata', onMeta);
        hideLoading();
        isSwitching = false;
        tryPlay();
      });
      video.addEventListener('error', function onErr() {
        video.removeEventListener('error', onErr);
        if (!useRaw && rawUrl && rawUrl !== playUrl) {
          playSource(source, true);
        } else {
          isSwitching = false;
          showError('Cannot play this stream.');
        }
      });
      return;
    }

    if (isHls) {
      if (typeof Hls === 'undefined' || !Hls.isSupported()) {
        video.src = playUrl;
        hideLoading();
        isSwitching = false;
        tryPlay();
        return;
      }
      
      /* ============================================================
         KEY FIX: capLevelToPlayerSize is REMOVED so a "1080p" stream
         actually decodes at 1080p even when the player window is small.
         Buffers were also enlarged and ABR tuned for smooth playback.
         ============================================================ */
      hlsInstance = new Hls({
        maxBufferLength: 90,             // was 60
        maxMaxBufferLength: 180,         // was 120
        maxBufferSize: 150 * 1000 * 1000,// was 60 MB -> 150 MB for HD
        backBufferLength: 30,
        enableWorker: (typeof Worker !== 'undefined'),
        lowLatencyMode: false,
        startLevel: -1,
        abrEwmaDefaultEstimate: 5000000, // assume 5 Mbps on start -> faster first frame
        abrBandWidthFactor: 0.95,        // slightly conservative downward switch
        abrBandWidthUpFactor: 0.70,      // avoid oscillating
        manifestLoadingTimeOut: 15000,
        manifestLoadingMaxRetry: 4,
        levelLoadingTimeOut: 15000,
        levelLoadingMaxRetry: 4,
        fragLoadingTimeOut: 25000,
        fragLoadingMaxRetry: 6,
        highBufferWatchdogPeriod: 3,     // detect stalls faster
        nudgeMaxRetry: 6
      });

      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
        hideLoading();
        isSwitching = false;
        tryPlay();
      });

      // keep the HUD in sync when HLS auto-switches levels
      hlsInstance.on(Hls.Events.LEVEL_SWITCHED, function() {
        setTimeout(updateQualityHud, 400);
      });
      hlsInstance.on(Hls.Events.FRAG_CHANGED, updateQualityHud);
      
      hlsInstance.on(Hls.Events.ERROR, function(evt, data) {
        if (!data || !data.fatal) return;
        switch(data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            console.warn("Fatal network error, recovering…");
            hlsInstance.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            console.warn("Fatal media error, recovering…");
            hlsInstance.recoverMediaError();
            break;
          default:
            hlsInstance.destroy();
            isSwitching = false;
            if (!useRaw && rawUrl && rawUrl !== playUrl) {
                playSource(source, true);
            } else {
                showError('Stream error. Try another title.');
            }
            break;
        }
      });
      try {
        hlsInstance.loadSource(playUrl);
        hlsInstance.attachMedia(video);
      } catch (e) {
        isSwitching = false;
        showError('Could not initialise player.');
      }
      return;
    }

    video.src = playUrl;
    hideLoading();
    isSwitching = false;
    tryPlay();
  }

  function tryPlay() {
    var p = video.play();
    if (p && p.then) {
      p.then(function() {
        hideLoading();
        buffering.classList.remove('show');
      }).catch(function(e) {
        hideLoading();
        buffering.classList.remove('show');
        showPausedScreen();
      });
    }
  }

  function togglePlay() {
    if (video.paused || video.ended) {
      if (video.ended) video.currentTime = 0;
      userInitiatedPause = false;
      tryPlay();
    } else {
      userInitiatedPause = true;
      video.pause();
    }
  }

  function userPlay() {
    if (video.ended) video.currentTime = 0;
    userInitiatedPause = false;
    tryPlay();
  }

  function updatePlayPauseBtn() {
    if (video.paused || video.ended) {
      playPauseBtn.innerHTML = ICONS.play;
      playPauseBtn.title = 'Play (Space)';
    } else {
      playPauseBtn.innerHTML = ICONS.pause;
      playPauseBtn.title = 'Pause (Space)';
    }
  }

  function showPausedScreen() { pausedScreen.classList.add('active'); showControls(); }
  function hidePausedScreen() { pausedScreen.classList.remove('active'); }

  video.addEventListener('play', function() {
    hidePausedScreen(); updatePlayPauseBtn(); scheduleHide();
  });
  video.addEventListener('pause', function() {
    if (!video.ended && userInitiatedPause && !isSwitching) showPausedScreen();
    userInitiatedPause = false; updatePlayPauseBtn(); showControls();
  });
  video.addEventListener('ended', function() {
    showPausedScreen(); updatePlayPauseBtn(); showControls();
  });
  video.addEventListener('waiting', function() { buffering.classList.add('show'); });
  video.addEventListener('playing', function() { buffering.classList.remove('show'); hideLoading(); });
  video.addEventListener('canplay', function() { buffering.classList.remove('show'); });
  
  video.addEventListener('timeupdate', function() {
    updateProgress();
    saveProgress();
  });
  
  video.addEventListener('loadedmetadata', function() {
    if (savedTime > 0 && !timeRestored && video.duration > savedTime) {
      video.currentTime = savedTime;
      timeRestored = true;
    }
    updateProgress(); 
    updateVolume(); 
  });
  
  video.addEventListener('progress', function() {
    if (!video.duration || !video.buffered.length) return;
    var end = video.buffered.end(video.buffered.length - 1);
    var pct = Math.min(100, (end / video.duration) * 100);
    seekBuffered.style.width = pct + '%';
  });

  function updateProgress() {
    if (!video.duration) return;
    var pct = (video.currentTime / video.duration) * 100;
    seekbar.value = Math.round(pct * 10);
    seekPlayed.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(video.currentTime);
    durationEl.textContent    = formatTime(video.duration);
  }
  
  function saveProgress() {
    if (!video.duration || video.currentTime < 5) return;
    try {
      var progressStore = JSON.parse(localStorage.getItem('flexji_progress') || '{}');
      var key = type === 'tv' ? (tmdbId + '_' + season + '_' + episode) : tmdbId;
      progressStore[key] = {
        tmdbId: tmdbId, type: type, season: season, episode: episode,
        currentTime: video.currentTime, duration: video.duration,
        title: title, year: year, timestamp: Date.now()
      };
      localStorage.setItem('flexji_progress', JSON.stringify(progressStore));
    } catch(e){}
  }

  function formatTime(s) {
    if (!s || !isFinite(s)) return '0:00';
    s = Math.floor(s);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    if (h > 0) return h + ':' + pad2(m) + ':' + pad2(sec);
    return m + ':' + pad2(sec);
  }

  seekbar.addEventListener('input', function() {
    if (!video.duration) return;
    var pct = parseFloat(seekbar.value) / 10;
    seekPlayed.style.width = pct + '%';
    video.currentTime = (pct / 100) * video.duration;
    currentTimeEl.textContent = formatTime(video.currentTime);
  });

  volumeSlider.addEventListener('input', function() {
    var v = parseFloat(volumeSlider.value) / 100;
    video.volume = v; video.muted = v === 0; updateVolume();
  });
  volBtn.addEventListener('click', function(e) {
    e.stopPropagation(); video.muted = !video.muted; updateVolume();
  });
  video.addEventListener('volumechange', updateVolume);

  function updateVolume() {
    var pct = Math.round(video.volume * 100);
    volumeSlider.value = video.muted ? 0 : pct;
    if (video.muted || video.volume === 0) volBtn.innerHTML = ICONS.mute;
    else if (video.volume < 0.5) volBtn.innerHTML = ICONS.volumeLow;
    else volBtn.innerHTML = ICONS.volumeHigh;
  }

  function buildSettings() {
    if (!currentData || !currentData.sources) return;

    var audioMap = {}, qualityMap = {};
    for (var i = 0; i < currentData.sources.length; i++) {
      var s = currentData.sources[i];
      var lang = s.audioLanguage || s.language || 'en';
      var label = s.audioLabel || lang.toUpperCase();
      var isOriginal = s.audioTracks && s.audioTracks[0] && s.audioTracks[0].original;
      if (!audioMap[lang]) audioMap[lang] = { label: label, original: !!isOriginal };
      else if (isOriginal) audioMap[lang].original = true;
      qualityMap[s.quality || 'Auto'] = true;
    }

    var audioKeys = Object.keys(audioMap);
    var qualityKeys = Object.keys(qualityMap);

    audioSection.style.display   = audioKeys.length > 1 ? '' : 'none';
    qualitySection.style.display = qualityKeys.length > 1 ? '' : 'none';
    settingsBtn.style.display = (audioKeys.length > 1 || qualityKeys.length > 1) ? '' : 'none';

    audioOpts.innerHTML = '';
    if (audioKeys.length <= 1) {
      audioOpts.innerHTML = '<div class="settings-empty">Only one audio track</div>';
    } else {
      audioKeys.forEach(function(lang) {
        var info = audioMap[lang];
        var btn = document.createElement('button');
        btn.className = 'opt-btn' + (lang === selectedLang ? ' active' : '');
        var tag = info.original ? '<span class="opt-tag">Original</span>' : '';
        btn.innerHTML = '<span class="opt-label"><span>' + info.label + '</span>' + tag + '</span>' +
                        '<span class="opt-check">' + ICONS.check + '</span>';
        btn.onclick = function() { selectAudio(lang); };
        audioOpts.appendChild(btn);
      });
    }

    qualityOpts.innerHTML = '';
    if (qualityKeys.length <= 1) {
      qualityOpts.innerHTML = '<div class="settings-empty">Only one quality available</div>';
    } else {
      qualityKeys.sort(function(a, b) {
        return (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0);
      }).forEach(function(q) {
        var btn = document.createElement('button');
        btn.className = 'opt-btn' + (q === selectedQuality ? ' active' : '');
        btn.innerHTML = '<span class="opt-label"><span>' + q + '</span></span>' +
                        '<span class="opt-check">' + ICONS.check + '</span>';
        btn.onclick = function() { selectQuality(q); };
        qualityOpts.appendChild(btn);
      });
    }
  }

  function selectAudio(lang) {
    if (!currentData || !currentSource) return;
    var curLang = currentSource.audioLanguage || currentSource.language;
    if (lang === curLang) { closeSettings(); return; }

    var maxQ = detectMaxQuality();
    var candidates = currentData.sources.filter(function(s) {
      return (s.audioLanguage || s.language) === lang;
    });
    if (!candidates.length) return;
    candidates.sort(function(a, b) {
      var qa = parseInt(String(a.quality || '').replace(/[^\d]/g, ''), 10) || 0;
      var qb = parseInt(String(b.quality || '').replace(/[^\d]/g, ''), 10) || 0;
      return qb - qa;
    });
    var chosen = null;
    for (var i = 0; i < candidates.length; i++) {
      var q = parseInt(String(candidates[i].quality || '').replace(/[^\d]/g, ''), 10) || 0;
      if (q > 0 && q <= maxQ) { chosen = candidates[i]; break; }
    }
    if (!chosen) chosen = candidates[0];

    selectedLang    = lang;
    selectedQuality = chosen.quality;
    
    savedTime = video.currentTime;
    timeRestored = false;
    
    buildSettings(); closeSettings(); playSource(chosen, false);
  }

  function selectQuality(q) {
    if (!currentData || !currentSource) return;
    var curLang = currentSource.audioLanguage || currentSource.language;
    var match = null;
    for (var i = 0; i < currentData.sources.length; i++) {
      var s = currentData.sources[i];
      if ((s.audioLanguage || s.language) === curLang && s.quality === q) { match = s; break; }
    }
    if (!match) {
      for (var j = 0; j < currentData.sources.length; j++) {
        if (currentData.sources[j].quality === q) { match = currentData.sources[j]; break; }
      }
    }
    if (match) {
      selectedQuality = q;
      
      savedTime = video.currentTime;
      timeRestored = false;
      
      buildSettings(); closeSettings(); playSource(match, false);
    }
  }

  function openSettings() { settingsBackdrop.classList.add('open'); settingsPanel.classList.add('open'); showControls(); }
  function closeSettings() { settingsBackdrop.classList.remove('open'); settingsPanel.classList.remove('open'); }
  function toggleSettings() { if (settingsPanel.classList.contains('open')) closeSettings(); else openSettings(); }

  settingsBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleSettings(); });
  settingsClose.addEventListener('click', function(e) { e.stopPropagation(); closeSettings(); });
  settingsBackdrop.addEventListener('click', closeSettings);

  function showLoading(msg) { loadingText.textContent = msg || 'Loading…'; loadingScreen.style.display = 'flex'; }
  function hideLoading() { loadingScreen.style.display = 'none'; }
  function showError(msg) {
    errorText.textContent = msg || 'Playback error';
    errorScreen.style.display = 'flex'; hideLoading(); buffering.classList.remove('show');
  }
  function hideError() { errorScreen.style.display = 'none'; }

  function showControls() {
    shell.classList.remove('hide-ui'); clearTimeout(hideTimer);
    if (!video.paused && !video.ended && !settingsPanel.classList.contains('open')) scheduleHide();
  }
  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function() {
      if (!video.paused && !video.ended && !settingsPanel.classList.contains('open')) shell.classList.add('hide-ui');
    }, 2800);
  }
  document.addEventListener('mousemove', showControls);
  document.addEventListener('touchstart', showControls, { passive: true });

  shell.addEventListener('click', function(e) {
    if (e.target.closest('.top-bar, .bottom-controls, .settings-panel, .settings-backdrop, .error-screen, .loading-screen, .paused-screen')) return;
    togglePlay();
  });
  playPauseBtn.addEventListener('click', function(e) { e.stopPropagation(); togglePlay(); showControls(); });
  psPlayBtn.addEventListener('click', function(e) { e.stopPropagation(); userPlay(); });

  rewindBtn.addEventListener('click', function(e) { e.stopPropagation(); video.currentTime = Math.max(0, video.currentTime - 10); showControls(); });
  forwardBtn.addEventListener('click', function(e) { e.stopPropagation(); video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); showControls(); });

  function toggleFullscreen() {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl) {
      if (shell.requestFullscreen) shell.requestFullscreen().catch(function(){});
      else if (shell.webkitRequestFullscreen) shell.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }
  fullscreenBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleFullscreen(); });
  function updateFullscreenIcon() {
    var isFs = document.fullscreenElement || document.webkitFullscreenElement;
    fullscreenBtn.innerHTML = isFs ? ICONS.exitFs : ICONS.fullscreen;
  }
  document.addEventListener('fullscreenchange', updateFullscreenIcon);
  document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

  closeBtn.addEventListener('click', function() {
    window.close(); setTimeout(function() { if (!window.closed) location.href = 'flexji.html'; }, 120);
  });

  document.addEventListener('keydown', function(e) {
    var k = e.keyCode;
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    var isForm = tag === 'INPUT' || tag === 'BUTTON' || tag === 'SELECT';

    if ((k === 27 || k === 10009) && settingsPanel.classList.contains('open')) {
      closeSettings(); e.preventDefault(); return;
    }
    if (k === 32 || k === 13 || k === 415 || k === 179) {
      if (!isForm) { togglePlay(); e.preventDefault(); } showControls();
    } else if (k === 37) {
      video.currentTime = Math.max(0, video.currentTime - 10); e.preventDefault(); showControls();
    } else if (k === 39) {
      video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); e.preventDefault(); showControls();
    } else if (k === 38) {
      video.volume = Math.min(1, video.volume + 0.1); e.preventDefault(); showControls();
    } else if (k === 40) {
      video.volume = Math.max(0, video.volume - 0.1); e.preventDefault(); showControls();
    } else if (k === 70 || k === 102) {
      toggleFullscreen(); e.preventDefault();
    } else if (k === 78) {
      if(nextEpBtn.style.display !== 'none') nextEpBtn.click(); e.preventDefault();
    } else if (k === 77 || k === 109) {
      video.muted = !video.muted; updateVolume();
    } else if (k === 27 || k === 10009) {
      if (document.fullscreenElement) document.exitFullscreen().catch(function(){});
      else closeBtn.click();
    }
  });

  retryBtn.addEventListener('click', function() { hideError(); fetchStream(); });

  playPauseBtn.innerHTML = ICONS.play;
  volBtn.innerHTML = ICONS.volumeHigh;
  fullscreenBtn.innerHTML = ICONS.fullscreen;

  try { video.volume = 1; } catch (e) {}
  updateVolume(); updatePlayPauseBtn();
  fetchStream();
})();
</script>
</body>
</html>
