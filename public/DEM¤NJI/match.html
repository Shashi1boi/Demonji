<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>ClearKey DASH Player</title>

<!-- Shaka Player + UI CSS/JS (UI build bundles everything you need) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.6.18/dist/controls.css">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.6.18/dist/shaka-player.ui.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #000;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, Arial, Helvetica, sans-serif;
    color: #fff;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Shaka UI requires a positioned container */
  #player-container {
    position: fixed;
    inset: 0;
    background: #000;
  }

  #video {
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: contain;
    display: block;
    outline: none;
  }

  /* Make Shaka's own controls larger / more D-pad friendly on TVs */
  @media (min-width: 1280px) {
    .shaka-controls-container .shaka-controls-button-panel button {
      min-width: 48px;
      min-height: 48px;
      font-size: 16px;
    }
    .shaka-controls-container .shaka-seek-bar-container {
      height: 32px;
    }
  }

  /* Extra-visible focus outline (some Tizen builds don't show Shaka's default) */
  .shaka-controls-container button:focus,
  .shaka-controls-container button:focus-visible {
    outline: 2px solid #4fc3f7;
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div id="player-container">
  <video id="video"
         autoplay
         playsinline
         webkit-playsinline
         preload="auto"></video>
</div>

<script>
(function () {
  'use strict';

  // ─────────────────────────────────────────────
  // CONFIG
  // ─────────────────────────────────────────────
  var MANIFEST_URI   = 'https://otte.live.fly.ww.aiv-cdn.net/iad-nitro/live/clients/dash/enc/ppmrp8tlzz/out/v1/cf829370483b4212ac7d5e3009c514b1/cenc.mpd';
  var CLEAR_KEY_ID   = '952fb91696308da86bee7cd24edf0b58';
  var CLEAR_KEY_VAL  = 'bf359214ab3ac848738bdf014ace21b3';

  var video     = document.getElementById('video');
  var container = document.getElementById('player-container');
  var player    = null;
  var ui        = null;

  // ─────────────────────────────────────────────
  // TIZEN DETECTION
  // ─────────────────────────────────────────────
  function isTizen() {
    try { return shaka.util.Platform.isTizen(); }
    catch (e) { return false; }
  }

  // ─────────────────────────────────────────────
  // BOOT
  // ─────────────────────────────────────────────
  function boot() {
    if (!shaka || !shaka.Player) {
      console.error('[Player] Shaka failed to load.');
      return;
    }

    // ════════ TIZEN FIX #1: Skip polyfills ════════
    // Installing EME polyfills on Tizen triggers error 6001
    // (REQUESTED_KEY_SYSTEM_CONFIG_UNAVAILABLE).
    if (!isTizen()) {
      try {
        if (shaka.polyfill && shaka.polyfill.installAll) {
          shaka.polyfill.installAll();
        }
      } catch (e) {
        console.warn('[Player] Polyfill install failed:', e);
      }
    } else {
      console.log('[Player] Tizen detected — skipping polyfills to avoid error 6001.');
    }

    if (!shaka.Player.isBrowserSupported()) {
      console.error('[Player] Browser not supported (needs MSE / EME).');
      return;
    }

    // ─────────── Create Shaka Player ───────────
    player = new shaka.Player(video);

    // ─────────── Create Shaka UI (pure Shaka controls) ───────────
    // Everything below is drawn by Shaka's own UI library — no custom buttons.
    ui = new shaka.ui.Overlay(player, container, video, {
      addSeekBar: true,
      addBigPlayButton: true,
      // Controls visible in the bottom bar (this is where the quality
      // picker lives — Shaka's own gear / resolution button).
      controlPanelElements: [
        'play_pause',
        'time_and_duration',
        'spacer',
        'mute',
        'volume',
        'quality',      // ← Shaka's built-in quality button (Auto + resolutions)
        'fullscreen'
      ],
      // Everything else Shaka offers goes in the overflow (⋮) menu.
      overflowMenuButtons: [
        'captions',
        'language',
        'playback_rate',
        'loop',
        'statistics'
      ],
      seekBarColors: {
        base:     'rgba(255,255,255,0.30)',
        buffered: 'rgba(255,255,255,0.50)',
        played:   '#4fc3f7'
      }
    });

    // ─────────── ClearKey DRM ───────────
    var clearKeys = {};
    clearKeys[CLEAR_KEY_ID] = CLEAR_KEY_VAL;

    player.configure({
      drm: { clearKeys: clearKeys },
      streaming: { lowLatencyMode: true },
      abr: { enabled: true }
    });

    // ─────────── Error handling ───────────
    player.addEventListener('error', function (event) {
      var err = event.detail || {};
      var code = err.code || '???';
      var msg  = err.message || 'Unknown playback error';
      if (code === 6001) {
        msg += ' — ClearKey may be unavailable on this device, or the page is not served over HTTPS.';
      }
      console.error('[Player] Error', code, msg);
    });

    // ─────────── Load the live DASH manifest ───────────
    player.load(MANIFEST_URI).then(function () {
      console.log('[Player] Manifest loaded.');

      // ════════ TIZEN FIX #2: rebufferingGoal workaround ════════
      // Some Tizen models never fire "buffering = false" on live DASH,
      // leaving the screen black. A brief buffer-based start fixes it.
      if (isTizen()) {
        try {
          player.configure({ streaming: { rebufferingGoal: 1 } });
          setTimeout(function () {
            try { player.configure({ streaming: { rebufferingGoal: 0 } }); } catch (e) {}
          }, 5000);
          console.log('[Player] Tizen rebufferingGoal workaround applied.');
        } catch (e) {}
      }
    }).catch(function (err) {
      console.error('[Player] Load failed:', err);
    });
  }

  // ─────────────────────────────────────────────
  // ════════ TIZEN FIX #3: Remote Back / Exit key ════════
  // 10009 = RETURN (back) on Tizen remotes
  // 461   = EXIT
  // When Shaka has an overlay open (overflow menu, quality popup),
  // let Shaka handle it first; only exit the app if nothing is open.
  // ─────────────────────────────────────────────
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (k !== 10009 && k !== 461) return;

    // If Shaka has an active popup / menu open, let its own handlers
    // take it down instead of exiting the app.
    var popup = document.querySelector(
      '.shaka-overflow-menu, .shaka-settings-menu, ' +
      '.shaka-quality-menu, .shaka-client-side-ad-container'
    );
    if (popup && !popup.classList.contains('shaka-hidden')) {
      return; // let Shaka's default key handling close it
    }

    if (document.fullscreenElement || document.webkitFullscreenElement) {
      e.preventDefault();
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      return;
    }

    // Nothing open — exit the Tizen app (or fall back to browser history)
    e.preventDefault();
    try {
      if (window.tizen && window.tizen.application) {
        window.tizen.application.getCurrentApplication().exit();
      } else {
        history.back();
      }
    } catch (err) {
      history.back();
    }
  });

  // ─────────────────────────────────────────────
  // START
  // ─────────────────────────────────────────────
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(boot, 0);
  } else {
    document.addEventListener('DOMContentLoaded', boot);
  }
})();
</script>
</body>
</html>
